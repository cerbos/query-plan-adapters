ruby_version: 3.2

ignore:
  # Generated by example/run.sh: the unpacked gem and the example's installed bundle.
  - "example/vendor/**/*"
  - "example/.bundle-path/**/*"
  - "spec/**/*":
      # RSpec example groups are blocks, and shared fixtures read far better as constants
      # inside the group they belong to than as globals above it.
      - Lint/ConstantDefinitionInBlock
