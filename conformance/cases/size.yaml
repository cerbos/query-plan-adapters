# Conformance cases. The generator builds the policy, dataset and golden files from these;
# see conformance/README.md. Edit here, then run: go -C conformance/generator run .
area: size
description: 'size() of strings and collections, including thresholds no integer can meet.'
cases:
- id: 'size/equals/collection-two'
  tier: adversarial
  intent: 'A collection counted against a threshold other than zero or one (size(tags) == 2).'
  trap: 'Only emptiness maps to EXISTS; reading any equality as non-empty returns every tagged row, not the three with two tags.'
  condition:
    match:
      expr: 'size(R.attr.tags) == 2'
- id: 'size/equals/filtered-collection'
  tier: extended
  intent: 'Size of a filtered collection compared with a literal (size(tags.filter(t, t.name == "public")) == 1).'
  trap: The lambda must become the WHERE of the COUNT subquery; counting every element or ignoring the filter changes the result.
  condition:
    match:
      expr: 'size(R.attr.tags.filter(t, t.name == "public")) == 1'
- id: 'size/equals/fractional-threshold'
  tier: adversarial
  intent: 'size(tags) == dyn(1.5), OR''d with aNumber > 30 to keep the oracle discriminating.'
  trap: 'A count never equals 1.5; truncating the threshold to 1 returns every single-tag row.'
  condition:
    match:
      expr: 'size(R.attr.tags) == dyn(1.5) || R.attr.aNumber > 30'
- id: 'size/equals/huge-threshold'
  tier: adversarial
  intent: 'size(aString) == 4294967296 (2^32), OR''d with aNumber > 30.'
  trap: 'A narrowing int cast wraps 2^32 to 0 and returns a8, whose aString is empty.'
  condition:
    match:
      expr: 'size(R.attr.aString) == 4294967296 || R.attr.aNumber > 30'
- id: 'size/equals/negated-collection-zero'
  tier: adversarial
  intent: 'Negation over an emptiness check on a collection (!(size(tags) == 0)).'
  trap: 'size == 0 lowers to NOT EXISTS; negating that must still exclude rows whose collection is missing rather than treat them as non-empty.'
  condition:
    match:
      expr: '!(size(R.attr.tags) == 0)'
- id: 'size/equals/negated-fractional-threshold-on-missing-attribute'
  tier: adversarial
  intent: 'Negated size(optional string) == dyn(1.5), OR''d with aNumber > 10.'
  trap: 'The arm folds to constant FALSE for present strings; NOT flips a bare FALSE to TRUE for missing rows too, readmitting a2/a4/a8, which CEL denies.'
  condition:
    match:
      expr: '!(size(R.attr.aOptionalString) == dyn(1.5)) || R.attr.aNumber > 10'
- id: 'size/equals/string-length'
  tier: adversarial
  intent: 'size(aString) == 6, an exact string length.'
  trap: 'CEL counts code points: a6 ("héllo🚀") has six, seven UTF-16 units and eleven bytes, so a unit or byte count drops it.'
  condition:
    match:
      expr: 'size(R.attr.aString) == 6'
- id: 'size/equals/string-trailing-space'
  tier: adversarial
  intent: 'size() of a string ending in whitespace (i2 "51 ", i8 "\t ") compared with 2.'
  trap: 'CEL counts every code point. SQL Server''s LEN ignores trailing spaces, so it reads "51 " as 2 and over-grants i2, and "\t " as 1 and under-grants i8.'
  condition:
    match:
      expr: 'size(R.attr.aString) == 2'
- id: 'size/greater-or-equal/collection-at-least-one'
  tier: core
  intent: 'A non-empty collection spelled size(tags) >= 1.'
  trap: 'An emptiness fast path keyed only on > 0 must give >= 1 the same meaning; an off-by-one threshold admits empty lists.'
  condition:
    match:
      expr: 'size(R.attr.tags) >= 1'
- id: 'size/greater-or-equal/fractional-threshold'
  tier: adversarial
  intent: 'size() of a resource list compared >= a fractional literal (1.5).'
  trap: 'COUNT is integral, so >= 1.5 must round up to >= 2; truncating to 1 over-grants single-element rows.'
  condition:
    match:
      expr: 'size(R.attr.tags) >= 1.5'
- id: 'size/greater-or-equal/fractional-threshold-on-relation'
  tier: adversarial
  intent: 'size() of a list reached through the mainCategory chain compared >= 1.5.'
  trap: 'The threshold must round up to >= 2, which only i9 (two subCategories) meets; truncating to >= 1 also returns a1/a6/a8/c1.'
  condition:
    match:
      expr: 'size(R.attr.mainCategory.subCategories) >= 1.5'
- id: 'size/greater-or-equal/huge-threshold'
  tier: adversarial
  intent: 'size(aString) >= 2147483648 (2^31), OR''d with aNumber > 30.'
  trap: 'A narrowing int cast wraps 2^31 to -2^31 and returns every present string.'
  condition:
    match:
      expr: 'size(R.attr.aString) >= 2147483648 || R.attr.aNumber > 30'
- id: 'size/greater-or-equal/list-attribute-two'
  tier: adversarial
  intent: 'size() of a list attribute compared >= 2 (size(tagNames) >= 2).'
  trap: 'A count of a list attribute against a threshold above one needs its length; reading it as non-empty returns every row with one name.'
  condition:
    match:
      expr: 'size(R.attr.tagNames) >= 2'
- id: 'size/greater-than/collection-above-one'
  tier: extended
  intent: 'Collection size compared with a non-zero threshold (size(tags) > 1).'
  trap: 'Only emptiness maps to some/none; a threshold above zero needs a correlated COUNT, and degrading it to non-empty over-grants.'
  condition:
    match:
      expr: 'size(R.attr.tags) > 1'
- id: 'size/greater-than/filtered-collection'
  tier: extended
  intent: 'size() of a filtered tag list above one (size(tags.filter(t, t.name == "public")) > 1).'
  trap: 'The count is of matching elements; counting every element grants a6, whose second tag is private.'
  condition:
    match:
      expr: 'size(R.attr.tags.filter(t, t.name == "public")) > 1'
- id: 'size/greater-than/filtered-collection-value-first'
  tier: adversarial
  intent: 'A constant greater than the size of a filtered tag list (2 > size(tags.filter(t, t.name == "public"))).'
  trap: 'The comparison must be mirrored; reading it as size > 2 denies every row the PDP allows.'
  condition:
    match:
      expr: '2 > size(R.attr.tags.filter(t, t.name == "public"))'
- id: 'size/greater-than/fractional-threshold'
  tier: adversarial
  intent: 'size(tags) > 0.5.'
  trap: 'A count above 0.5 is any non-empty count; rounding the threshold up to 1 under > drops the single-tag rows.'
  condition:
    match:
      expr: 'size(R.attr.tags) > 0.5'
- id: 'size/greater-than/huge-negative-threshold'
  tier: adversarial
  intent: 'size(aString) > -4294967296 (-2^32).'
  trap: 'A narrowing int cast wraps -2^32 to 0 and drops a8 (""); the comparison holds for every present string and errors on j1.'
  condition:
    match:
      expr: 'size(R.attr.aString) > -4294967296'
- id: 'size/greater-than/huge-threshold'
  tier: adversarial
  intent: 'size() of a string compared > 4294967296 (2^32), outside 32-bit int range.'
  trap: 'A narrowing int cast wraps 2^32 to 0 and returns every non-empty string; the comparison is false for every row.'
  condition:
    match:
      expr: 'size(R.attr.aString) > 4294967296'
  degenerate:
    oracle: empty
    reason: 'No string''s length exceeds 2^32. An unguarded int narrowing that wraps the threshold to 0 would return every non-empty aString; the less-than sibling is the other half.'
- id: 'size/greater-than/map-projection'
  tier: adversarial
  intent: 'size() of a map() projection over a related collection (size(tags.map(t, t.name)) > 1).'
  trap: 'b6''s first tag has no name, so map() errors there and CEL denies b6; counting the tags instead of projecting them returns it, and a non-empty check returns single-tag rows.'
  condition:
    match:
      expr: 'size(R.attr.tags.map(t, t.name)) > 1'
- id: 'size/greater-than/negated-huge-negative-threshold-on-missing-attribute'
  tier: adversarial
  intent: 'Negated size(optional string) > -5000000000, OR''d with aNumber > 10.'
  trap: 'The arm holds for every present string, so an IS NOT NULL fold negates to IS NULL and readmits missing-attribute rows, which CEL denies.'
  condition:
    match:
      expr: '!(size(R.attr.aOptionalString) > -5000000000) || R.attr.aNumber > 10'
- id: 'size/greater-than/negated-huge-threshold-on-missing-attribute'
  tier: adversarial
  intent: 'Negated size(optional string) > 5000000000, OR''d with aNumber > 10.'
  trap: 'The arm is always false for present strings; folding it to a bare FALSE lets NOT readmit missing-attribute rows, which CEL denies.'
  condition:
    match:
      expr: '!(size(R.attr.aOptionalString) > 5000000000) || R.attr.aNumber > 10'
- id: 'size/greater-than/string-length'
  tier: extended
  intent: 'Length of a string attribute compared with a threshold (size(aString) > 4).'
  trap: 'size() on a string is a length, not a collection count, and stores count code points, UTF-16 units or bytes differently (the astral seed sits on one side of the threshold).'
  condition:
    match:
      expr: 'size(R.attr.aString) > 4'
- id: 'size/greater-than/string-non-empty'
  tier: adversarial
  intent: 'size() of a string attribute compared > 0.'
  trap: 'The size(x) > 0 spelling must not take a collection-emptiness fast path; aString is a scalar and only a8 ("") is denied.'
  condition:
    match:
      expr: 'size(R.attr.aString) > 0'
- id: 'size/greater-than/value-first-arbitrary'
  tier: adversarial
  intent: 'A threshold on the left of a count (2 > size(tags)).'
  trap: 'Operand inversion: rendering size(tags) > 2 returns nothing instead of every row with fewer than two tags.'
  condition:
    match:
      expr: '2 > size(R.attr.tags)'
- id: 'size/greater-than/value-first-emptiness'
  tier: adversarial
  intent: 'A constant one greater than the size of a tag list (1 > size(tags)), an emptiness check written value-first.'
  trap: 'The mirror is size < 1, NOT EXISTS; reading it as size > 1 grants rows with several tags and denies the empty ones.'
  condition:
    match:
      expr: '1 > size(R.attr.tags)'
- id: 'size/less-or-equal/fractional-huge-threshold'
  tier: adversarial
  intent: 'size(aString) <= 4294967296.5, a fractional threshold outside 32-bit int range.'
  trap: 'Rounding down to 2^32 and then narrowing to int wraps it to 0, which only a8 ("") meets; the comparison holds for every present string.'
  condition:
    match:
      expr: 'size(R.attr.aString) <= 4294967296.5'
- id: 'size/less-or-equal/fractional-threshold-on-relation'
  tier: adversarial
  intent: size() of a list reached through the mainCategory chain compared <= 1.5.
  trap: '<= 1.5 rounds down to <= 1, which a zero count also satisfies, so an unguarded chain admits parentless rows (all 22 instead of a1/a6/a8/c1).'
  condition:
    match:
      expr: size(R.attr.mainCategory.subCategories) <= 1.5
- id: 'size/less-or-equal/huge-threshold'
  tier: adversarial
  intent: 'size(aString) <= 2147483648 (2^31).'
  trap: 'A narrowing int cast wraps 2^31 to -2^31 and returns nothing; the comparison holds for every present string and errors on j1.'
  condition:
    match:
      expr: 'size(R.attr.aString) <= 2147483648'
- id: 'size/less-or-equal/list-with-null'
  tier: adversarial
  intent: 'size(aNumberList) <= 1, where j4 sends the list as null.'
  trap: 'size(null) has no overload and denies; a store that counts a null list as zero elements returns j4.'
  condition:
    match:
      expr: 'size(R.attr.aNumberList) <= 1'
- id: 'size/less-than/fractional-threshold'
  tier: adversarial
  intent: 'size(tags) < 1.5.'
  trap: 'A count below 1.5 is at most one; rounding the threshold down to 1 under < drops the single-tag rows.'
  condition:
    match:
      expr: 'size(R.attr.tags) < 1.5'
- id: 'size/less-than/fractional-threshold-below-one'
  tier: adversarial
  intent: 'size(tags) < 0.5, an emptiness check spelled with a fraction.'
  trap: 'Truncating 0.5 to 0 makes the comparison < 0 and returns nothing instead of the rows with no tags.'
  condition:
    match:
      expr: 'size(R.attr.tags) < 0.5'
- id: 'size/less-than/huge-threshold'
  tier: adversarial
  intent: 'size() of a string compared < 4294967296 (2^32), outside 32-bit int range.'
  trap: 'A narrowing int cast wraps 2^32 to 0 and returns nothing; the comparison is true for every present string, the empty one included, and errors on the missing one (j1), which a guard folded to TRUE readmits.'
  condition:
    match:
      expr: size(R.attr.aString) < 4294967296
- id: 'size/less-than/int-max-threshold'
  tier: adversarial
  intent: 'size(aString) < 2147483647, the largest 32-bit int.'
  trap: 'The boundary is in range and must compare as written; a guard that folds thresholds at or above it to always-false returns nothing.'
  condition:
    match:
      expr: 'size(R.attr.aString) < 2147483647'
- id: 'size/less-than/negated-huge-negative-threshold-on-missing-attribute'
  tier: adversarial
  intent: 'Negated size(optional string) < -5000000000, OR''d with aNumber > 10.'
  trap: 'The arm is always false for present strings; folding it to a bare FALSE lets NOT readmit missing-attribute rows, which CEL denies.'
  condition:
    match:
      expr: '!(size(R.attr.aOptionalString) < -5000000000) || R.attr.aNumber > 10'
- id: 'size/less-than/negated-huge-threshold-on-missing-attribute'
  tier: adversarial
  intent: 'Negated size(optional string) < 5000000000, OR''d with aNumber > 10 to keep the oracle discriminating.'
  trap: 'Folding the always-true arm to IS NOT NULL negates to IS NULL and readmits missing-attribute rows (a2/a4/a8), where size() errors and denies under both polarities.'
  condition:
    match:
      expr: '!(size(R.attr.aOptionalString) < 5000000000) || R.attr.aNumber > 10'
- id: 'size/less-than/string-holding-nul'
  tier: adversarial
  intent: 'size(aString) < 2 over k3, whose aString is "a", NUL, "x".'
  trap: 'k3 is three code points, so it is denied. SQLite''s LENGTH stops at the NUL and counts 1, which grants k3.'
  condition:
    match:
      expr: 'size(R.attr.aString) < 2'
- id: 'size/less-than/string-length-value-first'
  tier: adversarial
  intent: 'A threshold on the left of a string length (5 < size(aString)).'
  trap: 'Operand inversion: rendering size(aString) < 5 returns the short strings instead of the long ones.'
  condition:
    match:
      expr: '5 < size(R.attr.aString)'
- id: 'size/less-than/value-first'
  tier: adversarial
  intent: size() of a related collection on the right of an ordering (0 < size(tags)).
  trap: 'Operand inversion: rendering size(tags) < 0 returns nothing instead of the 13 rows with at least one tag.'
  condition:
    match:
      expr: 0 < size(R.attr.tags)
- id: 'size/not-equals/collection-zero'
  tier: adversarial
  intent: 'size(aNumberList) != 0, where j4 sends the list as null.'
  trap: 'The != 0 spelling is non-emptiness; size(null) denies j4.'
  condition:
    match:
      expr: 'size(R.attr.aNumberList) != 0'
- id: 'size/not-equals/filtered-collection'
  tier: extended
  intent: 'size() of a filtered tag list not equal to one (size(tags.filter(t, t.name == "public")) != 1).'
  trap: 'Rows with no matching element count zero and are allowed; a translation through EXISTS drops them.'
  condition:
    match:
      expr: 'size(R.attr.tags.filter(t, t.name == "public")) != 1'
- id: 'size/not-equals/fractional-threshold'
  tier: adversarial
  intent: 'size(tags) != dyn(1.5) AND''d with aNumber < 10.'
  trap: 'A count is never 1.5, so the arm holds for every row; truncating the threshold to != 1 drops the single-tag rows.'
  condition:
    match:
      expr: 'size(R.attr.tags) != dyn(1.5) && R.attr.aNumber < 10'
- id: 'size/not-equals/fractional-threshold-on-missing-attribute'
  tier: adversarial
  intent: 'size(aOptionalString) != dyn(1.5), the positive polarity.'
  trap: 'The comparison holds for every present string, so folding it to TRUE returns the missing-attribute rows (a2/a4/a8/c2/e1), which CEL denies.'
  condition:
    match:
      expr: 'size(R.attr.aOptionalString) != dyn(1.5)'
- id: 'size/not-equals/huge-threshold'
  tier: adversarial
  intent: 'size(aOptionalString) != 4294967296 (2^32).'
  trap: 'A narrowing int cast wraps 2^32 to 0 and drops a6 (""); folding the arm to TRUE returns the missing-attribute rows.'
  condition:
    match:
      expr: 'size(R.attr.aOptionalString) != 4294967296'
- id: 'size/not-equals/negated-collection-zero'
  tier: adversarial
  intent: '!(size(aNumberList) != 0), where j4 sends the list as null.'
  trap: 'NOT over an EXISTS reads a null list as empty and returns j4; size(null) denies under both polarities.'
  condition:
    match:
      expr: '!(size(R.attr.aNumberList) != 0)'
- id: 'size/not-equals/negated-fractional-threshold-on-missing-attribute'
  tier: adversarial
  intent: 'Negated size(optional string) != dyn(1.5), OR''d with aNumber > 10; dyn() makes the int/double comparison plannable.'
  trap: 'No integral length equals 1.5, so the arm folds to true for present strings and an IS NOT NULL fold negates to IS NULL, readmitting missing rows. Not unreachable: only size(x) != 1.5 without dyn() is a type error.'
  condition:
    match:
      expr: '!(size(R.attr.aOptionalString) != dyn(1.5)) || R.attr.aNumber > 10'
