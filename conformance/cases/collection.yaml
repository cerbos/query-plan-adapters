# Conformance cases. The generator builds the policy, dataset and golden files from these;
# see conformance/README.md. Edit here, then run: go -C conformance/generator run .
area: collection
description: 'Macros over resource collections: exists, all, exists_one, filter, map, except, hasIntersection, indexing.'
cases:
- id: 'collection/all/empty-collection'
  tier: adversarial
  intent: all() over a tag list where some rows have an empty list.
  trap: 'all() on an empty collection is vacuously true; requiring at least one match, or a store that cannot tell empty from missing, gets those rows wrong.'
  condition:
    match:
      expr: 'R.attr.tags.all(t, t.name == "public")'
- id: 'collection/all/negated-nested-exists-in-body'
  tier: adversarial
  intent: 'all over an object list whose body negates a nested exists (categories.all(c, !c.subCategories.exists(s, s.name in ["finance", "legal"]))).'
  trap: 'Hoisting the not() out of the lambda, or scoping NOT EXISTS against the outer row instead of each element, changes the rows; an empty list is vacuously true.'
  condition:
    match:
      expr: 'R.attr.categories.all(c, !c.subCategories.exists(s, s.name in ["finance", "legal"]))'
- id: 'collection/all/nested-all-over-literal-list'
  tier: adversarial
  intent: 'all over a resource list whose body is an all over a list literal referencing the outer variable (tagNames.all(t, ["private", "other"].all(x, x != t))).'
  trap: 'Inner and outer lambda variables must stay distinct; in CEL null != "private" is true, so a NULL element must not deny the row.'
  condition:
    match:
      expr: 'R.attr.tagNames.all(t, ["private", "other"].all(x, x != t))'
- id: 'collection/all/nested-exists-over-literal-list'
  tier: adversarial
  intent: 'all over a resource list whose body is an exists over a list literal binding both lambda variables (tagNames.all(t, ["pub", "pri"].exists(p, t.startsWith(p)))).'
  trap: 'Confusing the inner and outer variables, or unrolling the inner literal list wrongly, changes which rows pass; an empty list is vacuously true.'
  condition:
    match:
      expr: 'R.attr.tagNames.all(t, ["pub", "pri"].exists(p, t.startsWith(p)))'
- id: 'collection/all/nested-exists-over-same-collection'
  tier: adversarial
  intent: 'all() over tags whose body is an exists() over the same tags, requiring a different tag (by id) with the same name.'
  trap: 'Self-correlation makes u.id != t.id never true and drops a3; correlating the name but not the id counts a tag as its own duplicate and over-grants every single-tag row.'
  condition:
    match:
      expr: 'R.attr.tags.all(t, R.attr.tags.exists(u, u.id != t.id && u.name == t.name))'
- id: 'collection/all/nested-three-levels-middle'
  tier: extended
  intent: 'all() at the middle of three nested macros: categories.exists(subCategories.all(labels.exists(...))).'
  trap: all() lowers to NOT EXISTS of the negated body while keeping the erroring row (a6) denied; empty inner collections make all() vacuously true.
  condition:
    match:
      expr: 'R.attr.categories.exists(c, c.subCategories.all(s, s.labels.exists(l, l.name == "gold")))'
- id: 'collection/concatenate/ternary-list-branches-equals-literal'
  tier: adversarial
  intent: 'List concatenation with a ternary whose branches are list literals, compared with a list literal; the shape runtime.effectiveDerivedRoles plans to.'
  trap: 'List + is ordered, so the ternary must pick the right branch in place; an adapter that cannot express list concatenation must throw.'
  condition:
    match:
      expr: '["one"] + (R.attr.aBool ? ["three"] : []) + ["two"] == ["one", "three", "two"]'
- id: 'collection/except/as-whole-condition'
  tier: adversarial
  intent: 'The two-list except() used as the whole condition, returning a list rather than a boolean.'
  trap: 'Treating a non-empty difference as true, or dropping it, emits a filter where CEL denies every row; the shape must throw.'
  condition:
    match:
      expr: 'R.attr.tagNames.except(["public"])'
  degenerate:
    oracle: empty
    reason: 'except() returns a list, not a boolean, so the condition is not evaluable and CEL denies every seed.'
- id: 'collection/except/equals-empty-list'
  tier: extended
  intent: 'except() compared with an empty list (tagNames.except(["public"]) == []).'
  trap: 'Comparing to an empty list literal: rows holding only "public" (and empty lists) pass, a6 and b6 do not.'
  condition:
    match:
      expr: 'R.attr.tagNames.except(["public"]) == []'
- id: 'collection/except/equals-list-literal'
  tier: extended
  intent: 'A resource list minus a literal list, compared for equality with a list literal.'
  trap: 'List equality is ordered and exact; a containment or membership lowering over-grants lists with extra or reordered elements.'
  condition:
    match:
      expr: 'R.attr.tagNames.except(["public"]) == ["private"]'
- id: 'collection/except/size-of-difference'
  tier: extended
  intent: 'size() of a resource list minus a literal list, compared > 0.'
  trap: 'Lowering except() as the lambda macro form, or size() only over named collections, mistranslates the difference; null tagNames must deny.'
  condition:
    match:
      expr: 'size(R.attr.tagNames.except(["public"])) > 0'
- id: 'collection/exists-one/several-matches'
  tier: adversarial
  intent: exists_one() over a tag list where some rows have more than one matching element.
  trap: Degrading exists_one to exists admits rows with two or more matches; it needs an exact count of one.
  condition:
    match:
      expr: 'R.attr.tags.exists_one(t, t.name == "public")'
- id: 'collection/exists/arithmetic-on-outer-attribute'
  tier: extended
  intent: exists() whose body combines an element comparison with arithmetic over an outer resource number.
  trap: 'The outer attribute must stay bound to the parent row inside the element scope; resolving it against the element, or dropping the arithmetic, changes the rows.'
  condition:
    match:
      expr: 'R.attr.tags.exists(t, t.name == "public" && R.attr.aNumber + 1.0 > 2.0)'
- id: 'collection/exists/element-contains-outer-attribute'
  tier: adversarial
  intent: 'exists() whose body is element.contains(outer attribute), a substring match with a column needle across scopes.'
  trap: 'The outer needle must be LIKE-escaped at query time and bound to the parent row; a8''s empty needle matches every tag, and a missing needle must deny.'
  condition:
    match:
      expr: 'R.attr.tags.exists(t, t.name.contains(R.attr.aString))'
- id: 'collection/exists/element-field-to-element-field'
  tier: extended
  intent: exists() whose body compares two fields of the same element (t.id == t.name); b4 is the witness.
  trap: 'Both operands are element columns; treating one as a literal, or binding one to the outer row, is wrong.'
  condition:
    match:
      expr: 'R.attr.tags.exists(t, t.id == t.name)'
- id: 'collection/exists/element-field-to-outer-field'
  tier: extended
  intent: 'exists() whose body compares the element''s field with a top-level resource attribute (t.name == aString).'
  trap: The comparison crosses from the element column to the correlated outer column; binding both to one scope compares the wrong fields.
  condition:
    match:
      expr: 'R.attr.tags.exists(t, t.name == R.attr.aString)'
- id: 'collection/exists/element-in-literal-list'
  tier: extended
  intent: 'exists() over a resource string list whose body tests the element''s membership in a literal list.'
  trap: 'The literal list is folded inside the lambda; the lambda variable must stay bound to the element, not resolve outside the lambda.'
  condition:
    match:
      expr: '(R.attr.tagNames.exists(tagName, tagName in ["public", "other"]))'
- id: 'collection/exists/map-keys'
  tier: adversarial
  intent: 'exists() over a map-valued attribute, which ranges over its keys (parent.exists(k, k == "inner")).'
  trap: 'A CEL macro over a map iterates its keys, so every row whose parent has a parent of its own is allowed; reading a map as no collection under-grants them, and a row with no parent is a missing attribute that denies.'
  condition:
    match:
      expr: 'R.attr.parent.exists(k, k == "inner")'
- id: 'collection/exists/element-in-principal-list'
  tier: extended
  intent: 'exists() over resource tags whose body tests the element''s name for membership in a principal list attribute.'
  trap: 'The principal list is folded into a literal list inside the lambda; the IN must apply to the element column, not the outer row.'
  condition:
    match:
      expr: 'R.attr.tags.exists(t, t.name in P.attr.allowedTags)'
- id: 'collection/exists/empty-collection'
  tier: core
  intent: exists() over a tag list where some rows have an empty list.
  trap: 'exists() on an empty collection is false; a join-based translation must not return rows with no related elements.'
  condition:
    match:
      expr: 'R.attr.tags.exists(t, t.name == "public")'
- id: collection/exists/negated
  tier: adversarial
  intent: 'Negated exists() over a tag list (!tags.exists(t, t.name == "private")).'
  trap: 'Negating a nullable collection predicate turns a missing collection (a CEL error, denied) into a match; an empty collection must be allowed but a missing one must not.'
  condition:
    match:
      expr: '!R.attr.tags.exists(t, t.name == "private")'
- id: 'collection/exists/literal-list-element-as-contains-needle'
  tier: adversarial
  intent: 'exists over a list literal whose body uses the lambda variable as a contains() needle, kept as a comprehension by sitting under an or.'
  trap: 'The needle is bound per element and matched literally: an unescaped LIKE makes "%_o" match any "o" after a character and over-grants a3 "100xdone" and b1; the X needle is case-sensitive.'
  condition:
    match:
      expr: 'R.attr.aNumber == 33 || ["%_o", "X"].exists(t, R.attr.aString.contains(t))'
- id: 'collection/exists/negated-element-in-literal-list'
  tier: adversarial
  intent: Negated exists() over a resource string list whose body tests membership in a literal list.
  trap: 'Under negation a null tagNames list or null elements must not flip to an allow; NOT over a nullable array lowering over-grants.'
  condition:
    match:
      expr: '!(R.attr.tagNames.exists(tagName, tagName in ["public", "other"]))'
- id: 'collection/exists/negated-empty-collection'
  tier: adversarial
  intent: 'Negated exists() over tags where several rows (a2, b1, b2, b3) have no tags.'
  trap: 'exists over an empty collection is false, so its negation is true; stores that do not index empty arrays drop those rows, and NULL-name elements must stay UNKNOWN.'
  condition:
    match:
      expr: '!R.attr.tags.exists(t, t.name == "public")'
- id: 'collection/exists/negated-map-keys'
  tier: adversarial
  intent: 'Negated exists() over a map-valued attribute''s keys (!parent.exists(k, k == "inner")).'
  trap: 'CEL allows each row whose parent has no parent of its own; reading a map as no collection is an error that denies them under both polarities, and a row with no parent stays denied.'
  condition:
    match:
      expr: '!R.attr.parent.exists(k, k == "inner")'
- id: 'collection/exists/negated-nested-over-same-collection'
  tier: adversarial
  intent: '!tags.exists(t, tags.exists(u, u.name != t.name)): every tag has the same name.'
  trap: 'Reusing one alias for both levels makes the inner exists never true, so the negation over-grants a6; b6''s NULL-name tag must deny under both polarities.'
  condition:
    match:
      expr: '!R.attr.tags.exists(t, R.attr.tags.exists(u, u.name != t.name))'
- id: 'collection/exists/negated-nested-three-levels'
  tier: adversarial
  intent: 'Negation of the three-level nested exists over categories, subCategories and labels.'
  trap: 'Rows that are definitely false are allowed but the erroring row (a6, unnamed label) must still deny; a plain NOT EXISTS allows it.'
  condition:
    match:
      expr: '!R.attr.categories.exists(c, c.subCategories.exists(s, s.labels.exists(l, l.name == "gold")))'
- id: 'collection/exists/nested-collection-size'
  tier: extended
  intent: 'size() of a nested collection inside exists() over another collection (categories.exists(c, size(c.subCategories) == 1)).'
  trap: The count must be scoped to the current outer element; counting over the whole resource or the wrong join level gives wrong sizes.
  condition:
    match:
      expr: 'R.attr.categories.exists(c, size(c.subCategories) == 1)'
- id: 'collection/exists/nested-over-same-collection'
  tier: adversarial
  intent: 'tags.exists(t, tags.exists(u, u.name != t.name)): some pair of tags differs by name.'
  trap: 'The inner subquery needs a fresh alias correlated to the outer one; reusing one alias compares each tag with itself and drops a6 (#509).'
  condition:
    match:
      expr: 'R.attr.tags.exists(t, R.attr.tags.exists(u, u.name != t.name))'
- id: 'collection/exists/nested-three-levels'
  tier: extended
  intent: 'exists nested three levels deep: categories, subCategories, labels with name == "gold".'
  trap: 'An unnamed label (a6) errors and must deny through every level, and matching is case-sensitive (c1''s "Gold" must not match).'
  condition:
    match:
      expr: 'R.attr.categories.exists(c, c.subCategories.exists(s, s.labels.exists(l, l.name == "gold")))'
- id: 'collection/exists/nested-with-outer-attribute'
  tier: extended
  intent: 'exists() over categories nesting exists() over subcategories, whose inner body also reads a top-level resource attribute (aBool).'
  trap: The outer attribute must stay correlated to the root row across two lambda scopes; resolving it against the inner element loses the correlation.
  condition:
    match:
      expr: 'R.attr.categories.exists(c, c.subCategories.exists(s, s.name == "finance" && R.attr.aBool))'
- id: 'collection/exists/outer-collection-inside-lambda'
  tier: adversarial
  intent: 'categories.exists() whose body tests size(c.subCategories) == 1 and the root''s tags.exists().'
  trap: 'The inner tags.exists must correlate to the root entity, not to the category the outer lambda is iterating.'
  condition:
    match:
      expr: 'R.attr.categories.exists(c, size(c.subCategories) == 1 && R.attr.tags.exists(t, t.name == "public"))'
- id: 'collection/exists/range-built-from-attributes'
  tier: extended
  intent: 'exists over a list literal built from two attributes ([aString, aOptionalString].exists(s, s == "set")), which is never unrolled.'
  trap: 'The range is an expression, not a stored list; a missing element attribute makes the list error, so the row denies.'
  condition:
    match:
      expr: '[R.attr.aString, R.attr.aOptionalString].exists(s, s == "set")'
- id: 'collection/exists/relative-window-in-body'
  tier: extended
  intent: 'A relative time window inside an exists body, so the folded now() literal sits in a lambda.'
  trap: 'The harness and translator must handle the folded timestamp inside the lambda; a4 (private) and the future-dated public rows deny.'
  condition:
    match:
      expr: 'R.attr.tags.exists(t, t.name == "public" && timestamp(R.attr.createdAt) < now() - duration("24h"))'
- id: 'collection/exists/scalar-list-equals'
  tier: core
  intent: 'exists() over a string list with an equality body (tagNames.exists(tagName, tagName == "public")).'
  trap: 'The lambda variable is the element itself, not a field of a related row; tagNames'' explicit null elements must neither error the row nor match (#430).'
  condition:
    match:
      expr: 'R.attr.tagNames.exists(tagName, tagName == "public")'
- id: 'collection/exists/scalar-list-negated-body'
  tier: adversarial
  intent: 'exists() over a string list with a negated equality body (tagNames.exists(tagName, !(tagName == "public"))).'
  trap: 'A null element satisfies !(null == "public") in CEL but SQL NOT(NULL = ''public'') is UNKNOWN; a flat-array must_not also excludes mixed arrays CEL allows (#430).'
  condition:
    match:
      expr: 'R.attr.tagNames.exists(tagName, !(tagName == "public"))'
- id: 'collection/exists/two-variable-index-and-element'
  tier: adversarial
  intent: 'A two-variable exists over a list binding the index and the element (tagNames.exists(i, n, i == 0 && n == "public")).'
  trap: 'Ignoring the index over-grants b6, whose "public" sits at index 1; binding the first variable to the element is wrong.'
  condition:
    match:
      expr: 'R.attr.tagNames.exists(i, n, i == 0 && n == "public")'
- id: 'collection/exists/two-variable-map-key-and-value'
  tier: adversarial
  intent: 'A two-variable exists over a map binding the key and the value (obj.exists(k, v, k == "inner" && v.startsWith("100"))).'
  trap: 'The first variable is the key, the second the value; swapping them, or treating the map as a list, changes the rows.'
  condition:
    match:
      expr: 'R.attr.obj.exists(k, v, k == "inner" && v.startsWith("100"))'
- id: 'collection/filter/as-conjunct'
  tier: adversarial
  intent: 'A list-valued filter() as one conjunct of an and, beside a boolean attribute.'
  trap: Dropping the untranslatable filter() conjunct leaves aBool alone and returns the 14 aBool rows; CEL denies every row because the conjunct is not a boolean.
  condition:
    match:
      all:
        of:
        - expr: 'R.attr.tags.filter(t, t.name == "public")'
        - expr: R.attr.aBool
  degenerate:
    oracle: empty
    reason: 'The filter() conjunct returns a list, not a boolean, so the conjunction is not evaluable and CEL denies every seed. Dropping that conjunct leaves a bare-boolean filter that returns rows.'
- id: 'collection/filter/as-whole-condition'
  tier: adversarial
  intent: 'filter() used as the entire condition, returning a list rather than a boolean.'
  trap: 'There is no boolean meaning and check() denies every row; treating it as exists() (non-empty result) over-grants. It must be rejected.'
  condition:
    match:
      expr: 'R.attr.tags.filter(t, t.name == "public")'
  degenerate:
    oracle: empty
    reason: 'filter() returns a list, not a boolean, so the condition is not evaluable and CEL denies every seed.'
- id: 'collection/filter/literal-in-filtered-list'
  tier: extended
  intent: 'A literal tested for membership in a filtered resource list ("public" in tagNames.filter(t, t.startsWith("p") && aBool)).'
  trap: 'Ignoring the filter degrades to plain membership and over-grants a5 and b6, whose aBool is false.'
  condition:
    match:
      expr: '"public" in R.attr.tagNames.filter(t, t.startsWith("p") && R.attr.aBool)'
- id: 'collection/has-intersection/mapped-names-value-first'
  tier: adversarial
  intent: 'hasIntersection(["public", "other"], tags.map(t, t.name)): the literal list first, a projection second.'
  trap: 'A translator that assumes field-first inverts the operands or fails to resolve the map() projection to the related column.'
  condition:
    match:
      expr: 'hasIntersection(["public", "other"], R.attr.tags.map(t, t.name))'
- id: 'collection/has-intersection/mapped-names-with-metacharacters'
  tier: adversarial
  intent: hasIntersection of a map() projection of tag names with a literal list holding unicode and LIKE metacharacters.
  trap: 'List values must be compared by exact equality, never LIKE, so "100%_x" is not a pattern; unicode must round-trip byte-exact.'
  condition:
    match:
      expr: 'hasIntersection(R.attr.tags.map(t, t.name), ["public", "héllo🚀", "100%_x"])'
- id: 'collection/has-intersection/negated-mapped-names'
  tier: adversarial
  intent: 'The negation of hasIntersection between a map() projection over an object list and a list literal.'
  trap: 'A nameless tag makes map() error, which CEL denies under the negation too; a guard ANDed with the result turns that error into true under not() and over-grants b5 and e1.'
  condition:
    match:
      expr: '!hasIntersection(R.attr.tags.map(t, t.name), ["public"])'
- id: 'collection/has-intersection/value-first'
  tier: adversarial
  intent: hasIntersection with the literal list first and the resource list second.
  trap: 'The answer is symmetric but the query is not: one side is a column and the other a parameter list, so swapping roles breaks; matching stays case-sensitive (c1''s "Public").'
  condition:
    match:
      expr: 'hasIntersection(["public", "other"], R.attr.tagNames)'
- id: 'collection/index/first-element-of-boolean-list'
  tier: extended
  intent: 'The first element of a boolean list compared with true (aBoolList[0] == true).'
  trap: 'A position-blind match also finds true in second position (a5 [false, true]); a store reading true as 1 loses the boolean type.'
  condition:
    match:
      expr: 'R.attr.aBoolList[0] == true'
- id: 'collection/index/first-element-of-number-list'
  tier: extended
  intent: 'The first element of a number list compared with a literal (aNumberList[0] == 2).'
  trap: 'A position-blind membership test (term query, $contains) also matches [3, 2]; losing the number type or reading empty lists as NULL matches the wrong rows.'
  condition:
    match:
      expr: 'R.attr.aNumberList[0] == 2'
- id: 'collection/index/first-element-of-object-list'
  tier: extended
  intent: 'A field of the first element of an object list compared with a literal (tags[0].name == "public").'
  trap: 'Collection order must match the PDP''s list order and an out-of-range index is an error that denies; an unordered relation cannot express position.'
  condition:
    match:
      expr: 'R.attr.tags[0].name == "public"'
- id: 'collection/index/first-element-of-string-list'
  tier: extended
  intent: 'The first element of a resource string list compared with a literal (tagNames[0] == "public").'
  trap: 'Row order is undefined in SQL, so most adapters must refuse; rewriting the index as any-element over-grants b6 ([null, "public"]), and empty lists are out of range and deny.'
  condition:
    match:
      expr: 'R.attr.tagNames[0] == "public"'
- id: 'collection/index/first-element-of-string-list-equals-null'
  tier: adversarial
  intent: 'The first element of a string list compared with null (tagNames[0] == null).'
  trap: 'An explicit null at position 0 is true while an absent position 0 is an out-of-range error; treating both as NULL over-grants.'
  condition:
    match:
      expr: 'R.attr.tagNames[0] == null'
- id: 'collection/index/fractional-position'
  tier: adversarial
  intent: 'tagNames[0.5] == "public", OR''d with aNumber == 5 to keep the oracle discriminating.'
  trap: 'A fractional index is an error in CEL; truncating 0.5 to 0 over-grants.'
  condition:
    match:
      expr: 'R.attr.tagNames[0.5] == "public" || R.attr.aNumber == 5'
- id: 'collection/index/map-literal-by-attribute-key'
  tier: extended
  intent: 'A map literal indexed by an attribute and compared at the root ({...}[aString] == "ADMIN"), which the planner rewrites to an or of equalities on the key.'
  trap: 'The keys whose value matches are the answer; a missing key errors in CEL and denies, so no row outside "one" and "same" passes.'
  condition:
    match:
      expr: '{"one": "ADMIN", "same": "ADMIN", "xa_by": "USER"}[R.attr.aString] == "ADMIN"'
- id: 'collection/index/map-literal-by-attribute-key-under-or'
  tier: adversarial
  intent: 'The same map literal indexed by an attribute, but under an or, so the planner keeps the index over a struct literal.'
  trap: 'An index into a map literal needs lookup semantics, and a missing key errors and denies; an adapter that cannot express it must throw.'
  condition:
    match:
      expr: 'R.attr.aNumber == 33 || {"one": "ADMIN", "same": "ADMIN", "xa_by": "USER"}[R.attr.aString] == "ADMIN"'
- id: 'collection/index/map-literal-by-attribute-key-value-first'
  tier: adversarial
  intent: 'The literal on the left of a map literal indexed by an attribute ("ADMIN" == {...}[aString]), which the planner does not rewrite.'
  trap: 'The plan keeps the index over a struct literal; translating it as a column lookup, or letting a missing key match, is wrong.'
  condition:
    match:
      expr: '"ADMIN" == {"one": "ADMIN", "same": "ADMIN", "xa_by": "USER"}[R.attr.aString]'
- id: 'collection/index/negated-first-element-of-boolean-list'
  tier: adversarial
  intent: '!(aBoolList[0] == true): the negated first-element comparison over a boolean list.'
  trap: 'Empty lists error and must deny under negation while a null first element (a4) must allow; a must_not over an any-position match is a different predicate.'
  condition:
    match:
      expr: '!(R.attr.aBoolList[0] == true)'
- id: 'collection/index/negated-first-element-of-number-list'
  tier: adversarial
  intent: '!(aNumberList[0] == 2): the negated first-element comparison over a number list.'
  trap: 'Empty lists error and must deny, while a null first element (a6 [null, 2]) is a value and must allow; a SQL NULL reading gets both wrong.'
  condition:
    match:
      expr: '!(R.attr.aNumberList[0] == 2)'
- id: 'collection/index/negated-first-element-of-string-list'
  tier: adversarial
  intent: 'Negated equality on the first element of a string list (!(tagNames[0] == "public")).'
  trap: 'Out-of-range rows are errors and stay denied under negation, while a null element at position 0 is a value and is allowed.'
  condition:
    match:
      expr: '!(R.attr.tagNames[0] == "public")'
- id: 'collection/index/negated-out-of-bounds'
  tier: adversarial
  intent: '!(tagNames[1] == "public"): the second element under negation, where most rows have fewer than two tags.'
  trap: 'An out-of-bounds index is an error that denies even under negation; reading the missing element as NULL or false and negating it over-grants every short list.'
  condition:
    match:
      expr: '!(R.attr.tagNames[1] == "public")'
- id: 'collection/index/negative-position'
  tier: adversarial
  intent: 'tagNames[-1] == "public", OR''d with aNumber == 5 to keep the oracle discriminating.'
  trap: 'Index -1 is an error in CEL; treating it as the last element (Python or JSON-path style) over-grants.'
  condition:
    match:
