  tier: adversarial
  intent: 'The size of intersect() between a resource list and a list literal (size(intersect(tagNames, ["public", "other"])) == 1).'
  trap: 'Cerbos intersect keeps duplicates from the shorter list, so a3 ["public", "public"] has size 2 and denies; set semantics over-grants it.'
