# Conformance cases. The generator builds the policy, dataset and golden files from these;
# see conformance/README.md. Edit here, then run: go -C conformance/generator run .
area: timestamp
description: 'Timestamp comparisons, now(), durations.'
cases:
- id: 'timestamp/equals/field-to-field-without-conversion'
  tier: adversarial
  intent: Equality between two timestamp attributes without timestamp() wrappers (R.attr.createdAt == R.attr.updatedAt).
  trap: 'Bare attributes compare as RFC 3339 strings in CEL; native timestamp columns compare instants, so two spellings of one instant match in the store while CEL denies.'
  condition:
    match:
      expr: R.attr.createdAt == R.attr.updatedAt
- id: 'timestamp/equals/literal-instant'
  tier: extended
  intent: timestamp(field) == a literal UTC timestamp.
  trap: 'Equality must compare parsed instants, not raw strings; a4 is the exact-match witness.'
  condition:
    match:
      expr: 'timestamp(R.attr.createdAt) == timestamp("2024-06-01T00:00:00Z")'
- id: 'timestamp/equals/literal-instant-non-utc-offset'
  tier: adversarial
  intent: 'timestamp(field) == the same instant written with a +02:00 offset.'
  trap: 'CEL compares instants, so a4 must still match; a string comparison against the offset spelling drops it.'
  condition:
    match:
      expr: 'timestamp(R.attr.createdAt) == timestamp("2024-06-01T02:00:00+02:00")'
- id: 'timestamp/greater-than/relative-window-value-first'
  tier: adversarial
  intent: 'now() - duration("24h") > timestamp(field), the constant instant on the left.'
  trap: The planner keeps source order; reading operands positionally inverts the comparison and flips the whole set.
  condition:
    match:
      expr: 'now() - duration("24h") > timestamp(R.attr.createdAt)'
- id: 'timestamp/greater-than/time-since-duration'
  tier: extended
  intent: 'timeSince() on a timestamp attribute compared with a duration literal (timestamp(createdAt).timeSince() > duration("24h")).'
  trap: 'timeSince is relative to the query clock, and the duration is not a string: rows dated in the future (2036, 2037) deny, and a3 has no createdAt.'
  condition:
    match:
      expr: 'timestamp(R.attr.createdAt).timeSince() > duration("24h")'
- id: 'timestamp/less-than/attribute-plus-duration'
  tier: extended
  intent: 'A timestamp attribute shifted by a duration and compared with a timestamp literal.'
  trap: 'Dropping the duration over-grants a7, b3 and h4 (2021-05-05T05:05:05Z), which are inside the window only before the shift.'
  condition:
    match:
      expr: 'timestamp(R.attr.createdAt) + duration("24h") < timestamp("2021-05-06T00:00:00Z")'
- id: 'timestamp/less-than/relative-window'
  tier: extended
  intent: 'timestamp(field) < now() - duration("24h"), which the planner folds to a constant instant.'
  trap: 'The folded timestamp literal must be compared as an instant, not a string; a3 has no createdAt and must deny.'
  condition:
    match:
      expr: 'timestamp(R.attr.createdAt) < now() - duration("24h")'
- id: 'timestamp/not-equals/literal-instant'
  tier: extended
  intent: 'timestamp(field) != a literal UTC timestamp.'
  trap: 'Returns every row except a4 and a3, whose missing createdAt errors in CEL; a negation that admits NULL over-grants a3.'
  condition:
    match:
      expr: 'timestamp(R.attr.createdAt) != timestamp("2024-06-01T00:00:00Z")'
- id: 'timestamp/greater-or-equal/stored-millisecond-spelling'
  tier: adversarial
  intent: 'timestamp(updatedAt) >= a literal at the instant a1 stores, which a1 spells with a zero fraction (2020-03-15T10:30:00.000Z).'
  trap: 'CEL compares instants, so a1 is equal and allowed; comparing the stored text with the canonical literal (…00Z) as strings puts "." before "Z" and drops a1.'
  condition:
    match:
      expr: 'timestamp(R.attr.updatedAt) >= timestamp("2020-03-15T10:30:00Z")'
- id: 'timestamp/not-equals/stored-millisecond-spelling'
  tier: adversarial
  intent: 'timestamp(updatedAt) != a literal at the instant a1 stores, which a1 spells with a zero fraction (2020-03-15T10:30:00.000Z).'
  trap: 'CEL compares instants, so a1 is equal and denied; comparing the stored text with the canonical literal (…00Z) as strings finds them different and over-grants a1.'
  condition:
    match:
      expr: 'timestamp(R.attr.updatedAt) != timestamp("2020-03-15T10:30:00Z")'
- id: 'timestamp/less-or-equal/sub-second-past-literal'
  tier: adversarial
  intent: 'timestamp(createdAt) <= a whole-second literal that a5 passes by 123456 microseconds (2020-03-15T10:30:00.123456Z).'
  trap: 'a1 sits on the literal and is allowed; a5 is later and denied. A column that drops the fraction (MySQL DATETIME without fsp 6) stores a5 on the literal, and an Elasticsearch upper bound that omits the fraction reads it as …00.999; both over-grant a5.'
  condition:
    match:
      expr: 'timestamp(R.attr.createdAt) <= timestamp("2020-03-15T10:30:00Z")'
- id: 'timestamp/equals/sub-second-past-literal'
  tier: adversarial
  intent: 'timestamp(createdAt) == a whole-second literal that a5 passes by 123456 microseconds.'
  trap: 'Only a1 is equal. Elasticsearch fills the fraction a date literal omits with its largest value at an upper bound, so a term query for …00Z also matches a5.'
  condition:
    match:
      expr: 'timestamp(R.attr.createdAt) == timestamp("2020-03-15T10:30:00Z")'
- id: 'timestamp/greater-than/literal-instant'
  tier: adversarial
  intent: 'timestamp(createdAt) > a literal at a4''s instant (2024-06-01T00:00:00Z).'
  trap: 'a4 is equal and denied, the later rows allowed. Rendering > as >= over-grants a4; a3 has no createdAt and must deny.'
  condition:
    match:
      expr: 'timestamp(R.attr.createdAt) > timestamp("2024-06-01T00:00:00Z")'
- id: 'timestamp/less-than/literal-instant-value-first'
  tier: adversarial
  intent: 'timestamp("2024-06-01T00:00:00Z") < timestamp(createdAt), the constant instant on the left.'
  trap: 'Only the rows after a4 are allowed. Reading the operands positionally selects the earlier rows instead (a1, a5, a7, b3, h4), and inverting rather than mirroring the operator admits a4.'
  condition:
    match:
      expr: 'timestamp("2024-06-01T00:00:00Z") < timestamp(R.attr.createdAt)'
- id: 'timestamp/less-or-equal/literal-instant-value-first'
  tier: adversarial
  intent: 'timestamp("2024-06-01T00:00:00Z") <= timestamp(createdAt), the constant instant on the left.'
  trap: 'a4 and the later rows are allowed. Reading the operands positionally selects a4 and the earlier rows, and mirroring <= to < drops a4.'
  condition:
    match:
      expr: 'timestamp("2024-06-01T00:00:00Z") <= timestamp(R.attr.createdAt)'
- id: 'timestamp/greater-or-equal/literal-instant-value-first'
  tier: adversarial
  intent: 'timestamp("2024-06-01T00:00:00Z") >= timestamp(createdAt), the constant instant on the left.'
  trap: 'a4 and the earlier rows (a1, a5, a7, b3, h4) are allowed. Reading the operands positionally selects a4 and the later rows instead.'
  condition:
    match:
      expr: 'timestamp("2024-06-01T00:00:00Z") >= timestamp(R.attr.createdAt)'
- id: 'timestamp/equals/literal-instant-value-first'
  tier: adversarial
  intent: 'timestamp("2024-06-01T00:00:00Z") == timestamp(createdAt), the constant instant on the left.'
  trap: 'Only a4 is equal. A translation that expects the attribute on the left and refuses or misreads a constant there loses it.'
  condition:
    match:
      expr: 'timestamp("2024-06-01T00:00:00Z") == timestamp(R.attr.createdAt)'
- id: 'timestamp/not-equals/literal-instant-value-first'
  tier: adversarial
  intent: 'timestamp("2024-06-01T00:00:00Z") != timestamp(createdAt), the constant instant on the left.'
  trap: 'Every row except a4 and a3 is allowed: a3 has no createdAt, so CEL errors and denies it. A negation that admits NULL over-grants a3.'
  condition:
    match:
      expr: 'timestamp("2024-06-01T00:00:00Z") != timestamp(R.attr.createdAt)'
- id: 'timestamp/less-or-equal/sub-second-literal-before-stored-fraction'
  tier: adversarial
  intent: 'timestamp(createdAt) <= a literal one microsecond past a1 (2020-03-15T10:30:00.000001Z), inside a5''s second.'
  trap: 'a1 is allowed and a5 (…00.123456Z) denied. A literal whose fraction is dropped and then filled to the end of its second at an upper bound, as an Elasticsearch date bound does, over-grants a5.'
  condition:
    match:
      expr: 'timestamp(R.attr.createdAt) <= timestamp("2020-03-15T10:30:00.000001Z")'
- id: 'timestamp/less-or-equal/sub-second-literal-at-stored-fraction'
  tier: adversarial
  intent: 'timestamp(createdAt) <= a literal at a5''s exact microsecond (2020-03-15T10:30:00.123456Z).'
  trap: 'a1 and a5 are allowed. A literal truncated to the second or the millisecond falls before a5 and drops it.'
  condition:
    match:
      expr: 'timestamp(R.attr.createdAt) <= timestamp("2020-03-15T10:30:00.123456Z")'
- id: 'timestamp/equals/ternary-over-literal-instants'
  tier: adversarial
  intent: 'A ternary choosing between two timestamp literals, compared with the first ((aBool ? timestamp("2024-01-01T02:00:00+02:00") : timestamp("2030-01-01T00:00:00Z")) == timestamp("2024-01-01T00:00:00Z")).'
  trap: 'The first branch is the same instant with an offset, so exactly the aBool-true rows are allowed, and j3 (no aBool) denies. Comparing the branch spellings as strings denies every row; dropping the ternary allows every row or none.'
  condition:
    match:
      expr: '(R.attr.aBool ? timestamp("2024-01-01T02:00:00+02:00") : timestamp("2030-01-01T00:00:00Z")) == timestamp("2024-01-01T00:00:00Z")'
- id: 'timestamp/greater-than/ternary-over-literal-instants'
  tier: adversarial
  intent: 'A ternary choosing between two timestamp literals, ordered against a third ((aBool ? timestamp("2024-01-01T00:00:00Z") : timestamp("2030-01-01T00:00:00Z")) > timestamp("2025-01-01T00:00:00Z")).'
  trap: 'Only the aBool-false rows are allowed, and j3 (no aBool) denies. Swapping the branches selects the aBool-true rows instead.'
  condition:
    match:
      expr: '(R.attr.aBool ? timestamp("2024-01-01T00:00:00Z") : timestamp("2030-01-01T00:00:00Z")) > timestamp("2025-01-01T00:00:00Z")'
