# Conformance cases. The generator builds the policy, dataset and golden files from these;
# see conformance/README.md. Edit here, then run: go -C conformance/generator run .
area: relation
description: 'The real to-one relation (parent, parent.inner) and the mainCategory join chain.'
cases:
- id: 'relation/all/negated-to-one-chain'
  tier: adversarial
  intent: '!all() over the flattened mainCategory chain.'
  trap: 'i9''s one category holds finance and legal, so all() is false and its negation true; negating the some-wrapped chain (some { NOT some P }) denies it, and a category with no elements would be admitted.'
  condition:
    match:
      expr: '!R.attr.mainCategory.subCategories.all(s, s.name == "finance")'
- id: 'relation/all/to-one-chain'
  tier: adversarial
  intent: all() over mainCategory.subCategories where most rows have no mainCategory.
  trap: 'CEL denies a missing path, but an unguarded join makes all() vacuously true for parentless rows and over-grants them (#309).'
  condition:
    match:
      expr: 'R.attr.mainCategory.subCategories.all(s, s.name == "finance")'
- id: 'relation/and/negated-conjunction-one-hop-null-literal'
  tier: adversarial
  intent: 'A negated && of a negated parent boolean and a parent null comparison (!(!parent.aBool && parent.aOptionalString == null)).'
  trap: 'Where parent.aBool is true the conjunction is false before the null leaf is read, so a7 is allowed although its leaf is NULL; a4 and c1 (parent.aBool false, leaf NULL) are errors that deny. De Morgan into a two-valued IS NOT NULL denies a7 or admits a4/c1.'
  condition:
    match:
      expr: '!(!R.attr.parent.aBool && R.attr.parent.aOptionalString == null)'
- id: 'relation/and/negated-conjunction-short-circuits-absent-parent'
  tier: adversarial
  intent: 'A negated && whose root operand decides the row before the to-one hop is read.'
  trap: 'Where aBool is true, !aBool && ... is false without reading parent, so the negation is true even with no parent (a6, a8, b3, b5, h1-h7); requiring the parent hop around the whole negation denies them.'
  condition:
    match:
      expr: '!(!R.attr.aBool && R.attr.parent.aString == "one")'
- id: 'relation/and/negated-conjunction-two-hops-null-literal'
  tier: adversarial
  intent: 'The negated conjunction two levels out (!(!parent.inner.aBool && parent.inner.aOptionalString == null)).'
  trap: 'b1''s inner has aBool false and a NULL leaf, so the conjunction is an error that denies; the 6 rows with a parent but no inner are errors too. A plain NOT over the relation filter admits them.'
  condition:
    match:
      expr: '!(!R.attr.parent.inner.aBool && R.attr.parent.inner.aOptionalString == null)'
- id: 'relation/and/one-hop-and-root-attribute'
  tier: extended
  intent: 'A root predicate AND a parent predicate (aBool == true && parent.aString.contains("re")).'
  trap: 'Dropping or mis-scoping the root conjunct returns b6 (whose root aBool is false) beside d1.'
  condition:
    match:
      expr: 'R.attr.aBool == true && R.attr.parent.aString.contains("re")'
- id: 'relation/and/one-hop-range'
  tier: extended
  intent: 'Two comparisons on the same parent field (parent.aNumber > 2 && parent.aNumber < 12).'
  trap: Both predicates must share one join; a separate join or EXISTS per conjunct lets two different parent rows satisfy each half.
  condition:
    match:
      expr: 'R.attr.parent.aNumber > 2 && R.attr.parent.aNumber < 12'
- id: 'relation/bare-attribute/negated-one-hop-boolean'
  tier: adversarial
  intent: 'Negation of a bare boolean on the to-one parent (!R.attr.parent.aBool).'
  trap: 'A LEFT JOIN that does not require the parent makes NOT true for the 8 parentless rows, which CEL denies; only the negation exposes this.'
  condition:
    match:
      expr: '!R.attr.parent.aBool'
- id: 'relation/bare-attribute/one-hop-boolean'
  tier: core
  intent: 'A bare boolean field of the to-one parent as the whole condition (R.attr.parent.aBool).'
  trap: 'A bare field needs an explicit truth test on the joined column, and the 8 parentless rows must not appear.'
  condition:
    match:
      expr: R.attr.parent.aBool
- id: 'relation/contains/negated-one-hop'
  tier: adversarial
  intent: 'Negated contains() on a parent field (!parent.aString.contains("done")).'
  trap: 'NOT LIKE over a missing parent or parent string must stay UNKNOWN and deny; a negation that is true for absent parents over-grants (#430).'
  condition:
    match:
      expr: '!R.attr.parent.aString.contains("done")'
- id: 'relation/contains/one-hop'
  tier: core
  intent: 'Substring test on a parent field (parent.aString.contains("done")).'
  trap: 'No metacharacter or case trap, only the join: reading the root''s aString gives a2/a3 instead of a1/a4.'
  condition:
    match:
      expr: 'R.attr.parent.aString.contains("done")'
- id: 'relation/ends-with/negated-one-hop-missing-leaf'
  tier: adversarial
  intent: 'Negated endsWith() on a parent field that some parents lack (!parent.aOptionalString.endsWith("ror")).'
  trap: 'a4, a7 and c1 have a parent with no aOptionalString, a missing attribute CEL denies under negation; a NOT over EXISTS (parent WHERE col LIKE ...) is true for their NULL column and over-grants them. Found by fuzzing (fuzz/s23/0190).'
  condition:
    match:
      expr: '!R.attr.parent.aOptionalString.endsWith("ror")'
- id: 'relation/equals/negated-one-hop'
  tier: adversarial
  intent: 'Negated equality on a parent field (!(parent.aString == "One")).'
  trap: 'A parentless row, or a missing parent aString, is a CEL error that denies; a not-equals over a LEFT JOIN, or a $ne that matches absent keys, returns them (#430).'
  condition:
    match:
      expr: '!(R.attr.parent.aString == "One")'
- id: 'relation/equals/negated-one-hop-against-two-hops'
  tier: adversarial
  intent: 'The negated cross-depth comparison (!(parent.aBool == parent.inner.aBool)).'
  trap: 'a2, b1, b6 and f1 differ; the rows with a parent but no inner are missing-attribute errors that deny, so a negation that does not require the inner hop over-grants a3, a7, a9, b2, c1 and d1.'
  condition:
    match:
      expr: '!(R.attr.parent.aBool == R.attr.parent.inner.aBool)'
- id: 'relation/equals/negated-one-hop-null-literal'
  tier: adversarial
  intent: '!(parent.aOptionalString == null) through the to-one parent.'
  trap: 'Only rows whose parent holds a set aOptionalString are allowed; a plain NOT over the relation filter also admits a4/a7/c1, whose parent has a NULL leaf, and the parentless rows.'
  condition:
    match:
      expr: '!(R.attr.parent.aOptionalString == null)'
- id: 'relation/equals/negated-two-hops-null-literal'
  tier: adversarial
  intent: '!(parent.inner.aOptionalString == null), two levels out.'
  trap: 'b1''s inner has a NULL leaf and 6 rows have a parent but no inner; each is an error that denies, which a plain NOT over the relation filter admits.'
  condition:
    match:
      expr: '!(R.attr.parent.inner.aOptionalString == null)'
- id: 'relation/equals/one-hop-against-two-hops'
  tier: adversarial
  intent: 'A parent field compared with the same field one level further out (parent.aBool == parent.inner.aBool).'
  trap: 'Both sides read the parents table at different depths, so the inner hop must correlate to the parent row, not to the root: a1, a4 and e1 match. Nesting the inner subquery outside the parent one names a table that is not in scope. Found by fuzzing (fuzz/s23/0040).'
  condition:
    match:
      expr: 'R.attr.parent.aBool == R.attr.parent.inner.aBool'
- id: 'relation/equals/one-hop-null-literal'
  tier: adversarial
  intent: 'parent.aOptionalString == null through the to-one parent.'
  trap: 'A two-valued IS NULL over a LEFT JOIN returns a4/a7/c1 (NULL leaf) and every parentless row, all of which CEL denies as a missing attribute.'
  condition:
    match:
      expr: 'R.attr.parent.aOptionalString == null'
  degenerate:
    oracle: empty
    reason: 'aOptionalString is omitted when NULL, so a parent leaf is either a set string (== null is false) or missing (an error), and a missing parent is an error too: no row can be allowed. The empty oracle still fails any translation that returns a row; relation/or/one-hop-null-literal-or-root-attribute carries the discriminating oracle.'
- id: 'relation/equals/one-hop-number'
  tier: core
  intent: 'Numeric equality on a field of the to-one parent (parent.aNumber == 2).'
  trap: 'Reading the root''s aNumber instead of the joined parent''s returns different rows.'
  condition:
    match:
      expr: R.attr.parent.aNumber == 2
- id: 'relation/equals/one-hop-string'
  tier: core
  intent: 'String equality on a field of the to-one parent (parent.aString == "One").'
  trap: 'A case-insensitive collation on the joined table adds e1 (parent holds "one"); parentless rows must deny.'
  condition:
    match:
      expr: 'R.attr.parent.aString == "One"'
- id: 'relation/equals/two-hops-boolean'
  tier: extended
  intent: Boolean equality two levels out (parent.inner.aBool == true).
  trap: 'Alias scoping and correlated-subquery nesting break at two hops; rows missing either level (14, for two reasons) must deny.'
  condition:
    match:
      expr: R.attr.parent.inner.aBool == true
- id: 'relation/equals/two-hops-null-literal'
  tier: adversarial
  intent: 'parent.inner.aOptionalString == null, two levels out.'
  trap: 'A two-valued IS NULL returns b1 (inner with a NULL leaf), the rows with a parent but no inner, and the parentless rows, all of which CEL denies.'
  condition:
    match:
      expr: 'R.attr.parent.inner.aOptionalString == null'
  degenerate:
    oracle: empty
    reason: 'aOptionalString is omitted when NULL, so an inner leaf is either set (== null is false) or missing (an error), and a missing level is an error too: no row can be allowed. The empty oracle still fails any translation that returns a row; relation/or/two-hops-null-literal-or-root-attribute carries the discriminating oracle.'
- id: 'relation/exists/negated-to-one-chain'
  tier: adversarial
  intent: Negated exists() over mainCategory.subCategories where most rows have no mainCategory.
  trap: 'An unguarded NOT EXISTS is true for parentless rows, which CEL denies as a missing path (#309).'
  condition:
    match:
      expr: '!R.attr.mainCategory.subCategories.exists(s, s.name == "finance")'
- id: 'relation/exists/to-one-chain'
  tier: extended
  intent: 'exists() over mainCategory.subCategories, a to-one object followed by a collection.'
  trap: 'One nested object to check() is two hops in the store; the subquery must join through the intermediate hop, never off the root.'
  condition:
    match:
      expr: 'R.attr.mainCategory.subCategories.exists(s, s.name == "finance")'
- id: 'relation/greater-or-equal/one-hop'
  tier: core
  intent: 'parent.aNumber >= 2 through the to-one parent.'
  trap: 'The threshold sits on a boundary value so >= and > differ; reading the root''s column instead of the parent''s disagrees everywhere.'
  condition:
    match:
      expr: 'R.attr.parent.aNumber >= 2'
- id: 'relation/greater-than/one-hop'
  tier: core
  intent: 'parent.aNumber > 2 through the to-one parent.'
  trap: 'None beyond joining the parent and reading its column, not the root''s; parentless rows must deny.'
  condition:
    match:
      expr: 'R.attr.parent.aNumber > 2'
- id: 'relation/has-intersection/negated-empty-list-on-to-one-chain'
  tier: adversarial
  intent: Negated hasIntersection of the mainCategory.subNames chain with an empty principal list.
  trap: 'Folding hasIntersection(x, []) to false makes the negation true for every row, over-granting rows with no mainCategory, where CEL errors on the missing hop.'
  condition:
    match:
      expr: '!hasIntersection(R.attr.mainCategory.subNames, P.attr.emptyTeams)'
- id: 'relation/has-intersection/negated-to-one-chain'
  tier: adversarial
  intent: Negated hasIntersection over the chained string list mainCategory.subNames.
  trap: 'hasIntersection reaches the chain through a different translator branch than in; without the absent-parent guard the negation over-grants parentless rows (#315).'
  condition:
    match:
      expr: '!hasIntersection(R.attr.mainCategory.subNames, ["finance"])'
- id: 'relation/has/negated-parent-attribute'
  tier: adversarial
  intent: '!has(parent.aOptionalString): absence of a field one hop across the to-one relation.'
  trap: 'has() through a missing parent is an error CEL denies under both polarities, so only rows whose parent lacks the field are allowed; a flat key or an IS NULL over the joined column cannot tell a missing parent from a missing field, and its negation returns every parentless row.'
  condition:
    match:
      expr: '!has(R.attr.parent.aOptionalString)'
  plannerDivergence:
    issue: 'has() over an omitted attribute: unknown to the planner, absent to check()'
    pdp:
    - 0.56.0
    reason: 'Before 0.57.0 the planner folds has() to true, so the negation plans as KIND_ALWAYS_DENIED. The per-row check() calls omit parent.aOptionalString where the parent lacks it, so check() allows those rows. From 0.57.0 the plan carries the has().'
- id: 'relation/has/negated-two-hops-attribute'
  tier: adversarial
  intent: '!has(parent.inner.aString): absence of a field two hops across the to-one relations.'
  trap: 'A missing parent and a missing parent.inner are both errors that deny under both polarities; guarding only a mapped parent, and not the unmapped parent.inner below it, returns the rows whose parent has no inner.'
  condition:
    match:
      expr: '!has(R.attr.parent.inner.aString)'
  degenerate:
    oracle: empty
    reason: 'Every seed that holds a parent.inner holds its aString, so the negated presence is false for it, and every seed without a parent or a parent.inner is a missing-path error. The case exists for those error rows, which a presence test that guards only the parent returns.'
- id: 'relation/has/parent'
  tier: extended
  intent: 'has(parent): presence of the to-one relation itself.'
  trap: 'Rows with no parent hop must be denied; a translation that tests a parent column instead of the relation, or reads has() as always true, grants them.'
  condition:
    match:
      expr: 'has(R.attr.parent)'
  plannerDivergence:
    issue: 'has() over an omitted attribute: unknown to the planner, absent to check()'
    pdp:
    - 0.56.0
    reason: 'Before 0.57.0 the planner folds has() to true, so the plan is KIND_ALWAYS_ALLOWED. The per-row check() calls omit parent on rows without a parent hop, so check() denies them. From 0.57.0 the plan carries the has().'
- id: 'relation/has/parent-attribute'
  tier: adversarial
  intent: 'has(parent.aOptionalString): presence of a field one hop across the to-one relation.'
  trap: 'Rows without a parent and rows whose parent lacks aOptionalString (a4, a7, c1) are both denied; testing only the relation grants the second group, testing only the column without the join mishandles the first.'
  condition:
    match:
      expr: 'has(R.attr.parent.aOptionalString)'
  plannerDivergence:
    issue: 'has() over an omitted attribute: unknown to the planner, absent to check()'
    pdp:
    - 0.56.0
    reason: 'Before 0.57.0 the planner folds has() to true, so the plan is KIND_ALWAYS_ALLOWED. The per-row check() calls omit parent.aOptionalString where the hop or the field is missing, so check() denies those rows. From 0.57.0 the plan carries the has().'
- id: 'relation/in/negated-to-one-chain'
  tier: adversarial
  intent: 'Negated membership !("finance" in mainCategory.subNames) where most rows have no mainCategory.'
  trap: 'An unguarded NOT EXISTS adds the parentless rows; the absent-parent guard belongs in the shared relation-scope code, not in each macro (#315).'
  condition:
    match:
      expr: '!("finance" in R.attr.mainCategory.subNames)'
- id: 'relation/in/to-one-chain'
  tier: extended
  intent: 'A literal''s membership in the string list mainCategory.subNames.'
  trap: 'The membership subquery must join through the intermediate to-one hop and map to the element''s name, not the root.'
  condition:
    match:
      expr: '"finance" in R.attr.mainCategory.subNames'
- id: 'relation/less-or-equal/one-hop'
  tier: core
  intent: 'parent.aNumber <= 2 through the to-one parent.'
  trap: 'The threshold sits on a boundary value so <= and < differ (a1/a7); reading the root''s column instead of the parent''s disagrees everywhere.'
  condition:
    match:
      expr: R.attr.parent.aNumber <= 2
- id: 'relation/less-than/one-hop'
  tier: core
  intent: 'parent.aNumber < 2 through the to-one parent.'
  trap: 'The threshold sits on a boundary value so < and <= differ; reading the root''s column instead of the parent''s disagrees everywhere.'
  condition:
    match:
      expr: R.attr.parent.aNumber < 2
- id: 'relation/not-equals/negated-one-hop-null-literal'
  tier: adversarial
  intent: '!(parent.aOptionalString != null) through the to-one parent.'
  trap: 'Rewriting the negation to a two-valued IS NULL returns a4/a7/c1 and the parentless rows, all of which CEL denies.'
  condition:
    match:
      expr: '!(R.attr.parent.aOptionalString != null)'
  degenerate:
    oracle: empty
    reason: 'aOptionalString is omitted when NULL, so != null is true for every set parent leaf (its negation false) and an error for a missing leaf or parent: no row can be allowed. The empty oracle still fails any translation that returns a row; relation/or/negated-one-hop-not-null-or-negated-root-attribute carries the discriminating oracle.'
- id: 'relation/not-equals/negated-two-hops-null-literal'
  tier: adversarial
  intent: '!(parent.inner.aOptionalString != null), two levels out.'
  trap: 'Rewriting the negation to a two-valued IS NULL returns b1, the rows with a parent but no inner, and the parentless rows, all of which CEL denies.'
  condition:
    match:
      expr: '!(R.attr.parent.inner.aOptionalString != null)'
  degenerate:
    oracle: empty
    reason: 'aOptionalString is omitted when NULL, so != null is true for every set inner leaf (its negation false) and an error for a missing leaf or level: no row can be allowed. The empty oracle still fails any translation that returns a row; relation/or/negated-two-hops-not-null-or-negated-root-attribute carries the discriminating oracle.'
- id: 'relation/not-equals/one-hop-null-literal'
  tier: adversarial
  intent: 'parent.aOptionalString != null through the to-one parent.'
  trap: 'Both a missing parent (8 rows) and a missing parent attribute (a4/a7/c1) must deny; an unguarded LEFT JOIN or a two-valued IS NOT NULL mishandles one of them.'
  condition:
    match:
      expr: 'R.attr.parent.aOptionalString != null'
- id: 'relation/not-equals/two-hops-null-literal'
  tier: adversarial
  intent: 'parent.inner.aOptionalString != null, two levels out.'
  trap: 'b1''s inner has a NULL leaf and most rows have no inner; each is an error that denies, which an unguarded join or a two-valued IS NOT NULL under a NOT mishandles.'
  condition:
    match:
      expr: 'R.attr.parent.inner.aOptionalString != null'
- id: 'relation/or/negated-one-hop-not-null-or-negated-root-attribute'
  tier: adversarial
  intent: '!(parent.aOptionalString != null) || !aBool, the always-erroring negation beside a discriminating root predicate.'
  trap: 'Only the aBool-false rows are allowed; a4/a7/c1 (NULL parent leaf) and the parentless aBool-true rows are errors the || cannot absorb, and a two-valued IS NULL admits them.'
  condition:
    match:
      expr: '!(R.attr.parent.aOptionalString != null) || !R.attr.aBool'
- id: 'relation/or/negated-two-hops-not-null-or-negated-root-attribute'
  tier: adversarial
  intent: '!(parent.inner.aOptionalString != null) || !aBool, two levels out.'
  trap: 'Only the aBool-false rows are allowed; b1 (NULL inner leaf), the aBool-true rows with no inner and the parentless ones are errors, and a two-valued IS NULL admits them.'
  condition:
    match:
      expr: '!(R.attr.parent.inner.aOptionalString != null) || !R.attr.aBool'
- id: 'relation/or/one-hop-null-literal-or-root-attribute'
  tier: adversarial
  intent: 'parent.aOptionalString == null || aBool, a relation-reached null comparison under a disjunction.'
  trap: 'The null comparison is false or an error on every row, so only the aBool-true rows are allowed; the error must not absorb the ||, and a two-valued IS NULL over a LEFT JOIN adds the parentless aBool-false rows (a5, b4, c2, d2, g1).'
  condition:
    match:
      expr: 'R.attr.parent.aOptionalString == null || R.attr.aBool'
- id: 'relation/or/two-hops-null-literal-or-root-attribute'
  tier: adversarial
  intent: 'parent.inner.aOptionalString == null || aBool, two levels out.'
  trap: 'Only the aBool-true rows are allowed; a two-valued IS NULL adds b2 (a parent but no inner) and the parentless aBool-false rows.'
  condition:
    match:
      expr: 'R.attr.parent.inner.aOptionalString == null || R.attr.aBool'
- id: 'relation/or/two-hops-or-collection-exists'
  tier: adversarial
  intent: 'A two-level parent predicate OR an exists() over categories.'
  trap: 'CEL''s OR absorbs the missing-path error, so rows with no inner level but a matching category (a6/a8/c1) are allowed; an inner join on either side under-grants them.'
  condition:
    match:
      expr: 'R.attr.parent.inner.aBool == true || R.attr.categories.exists(c, c.name == "business")'
- id: 'relation/overlaps/negated-one-hop'
  tier: adversarial
  intent: 'Negated hierarchy overlaps on a parent path (!hierarchy(parent.aString).overlaps(hierarchy("one"))).'
  trap: 'A missing parent or parent path is a CEL error that denies under negation; NOT(prefix match) over a NULL join column returns those rows (#430).'
  condition:
    match:
      expr: '!hierarchy(R.attr.parent.aString).overlaps(hierarchy("one"))'
- id: 'relation/size/negated-non-empty-to-one-chain'
  tier: adversarial
  intent: '!(size(mainCategory.subCategories) > 0), which the planner emits verbatim rather than as == 0.'
  trap: 'Guarding only the == 0 spelling misses this; an unguarded negated count readmits parentless rows, so the guard must sit on the count itself (#316).'
  condition:
    match:
      expr: '!(size(R.attr.mainCategory.subCategories) > 0)'
  degenerate:
    oracle: empty
    reason: 'Every seed that holds a mainCategory holds exactly one subCategory, so the negated count is false for it, and every seed without one is a missing-path error. A two-valued absent-parent guard would readmit the parentless rows under the negation.'
- id: 'relation/size/non-empty-to-one-chain'
  tier: extended
  intent: 'size(mainCategory.subCategories) > 0, a count over a to-one-then-collection chain.'
  trap: The count must join through the intermediate hop; counting off the root or the wrong hop miscounts.
  condition:
    match:
      expr: 'size(R.attr.mainCategory.subCategories) > 0'
- id: 'relation/size/non-empty-string-one-hop'
  tier: adversarial
  intent: 'size(parent.aString) > 0: a non-empty string reached through the to-one parent.'
  trap: 'The > 0 spelling must not take the relation-emptiness fast path: a7''s parent holds "", so reading it as "has a parent" returns a7.'
  condition:
    match:
      expr: 'size(R.attr.parent.aString) > 0'
- id: 'relation/size/non-negative-to-one-chain'
  tier: adversarial
  intent: 'size(mainCategory.subCategories) >= 0, true exactly for rows that have a mainCategory.'
  trap: 'Folding a >= 0 count to always-true, or leaving the chain unguarded, returns all 22 rows instead of the four with a mainCategory (#309).'
  condition:
    match:
      expr: 'size(R.attr.mainCategory.subCategories) >= 0'
- id: 'relation/size/string-length-one-hop'
  tier: adversarial
  intent: 'size(parent.aString) <= 3: the length of a string reached through the to-one parent.'
  trap: 'size() of a scalar behind a to-one hop is a string length, not a count of the hop''s rows: counting the parent row makes the size 1 and returns every row with a parent.'
  condition:
    match:
      expr: 'size(R.attr.parent.aString) <= 3'
- id: 'relation/size/string-length-two-hops'
  tier: adversarial
  intent: 'size(parent.inner.aString) <= 7: the length of a string reached through two to-one hops.'
  trap: 'Counting the inner row instead of measuring its string returns every row with a parent.inner; a row whose parent has no inner, or no parent, is a missing-path error and denies.'
  condition:
    match:
      expr: 'size(R.attr.parent.inner.aString) <= 7'
- id: 'relation/size/zero-to-one-chain'
  tier: adversarial
  intent: size(mainCategory.subCategories) == 0 where most rows have no mainCategory.
  trap: 'An unguarded chain counts 0 for parentless rows and over-grants them; CEL denies the missing path (#309).'
  condition:
    match:
      expr: size(R.attr.mainCategory.subCategories) == 0
  degenerate:
    oracle: empty
    reason: 'No seed holds a mainCategory with zero subCategories, and every seed without one is a missing-path error. The non-negative size sibling carries the discriminating oracle for the same chain.'
- id: 'relation/starts-with/negated-two-hops-missing-leaf'
  tier: adversarial
  intent: 'Negated startsWith() two levels out on a field that one inner parent lacks (!parent.inner.aOptionalString.startsWith("x")).'
  trap: 'b1''s inner has no aOptionalString, so the negation is a missing-attribute error that denies; a NOT over the two-hop EXISTS admits b1, and the rows with no inner at all.'
  condition:
    match:
      expr: '!R.attr.parent.inner.aOptionalString.startsWith("x")'
- id: 'relation/starts-with/two-hops'
  tier: extended
  intent: 'Prefix match two levels out (parent.inner.aString.startsWith("100")).'
  trap: 'Reading the wrong depth gives a disjoint answer: the right level is e1, one level short is a1/a4, the root is a2/a3.'
  condition:
    match:
