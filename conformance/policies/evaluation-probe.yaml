# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: evaluation_probe
  version: default
  importDerivedRoles: [evaluation_probe_roles]
  variables:
    local:
      invalid_flag: P.attr.variableBlocked == true
  rules:
    # Erroring DENY rules must override this otherwise matching ALLOW in strict mode.
    - name: baseline_allow
      actions: [missing-deny, type-deny, variable-deny, derived-deny, unrelated]
      roles: [USER]
      effect: EFFECT_ALLOW
    # An absent principal attribute errors while all resource inputs remain known.
    - name: missing_attribute_deny
      actions: [missing-deny]
      roles: [USER]
      effect: EFFECT_DENY
      condition:
        match:
          expr: P.attr.blocked == true
    # The hostile principal supplies a string where ordering expects a number.
    - name: invalid_type_deny
      actions: [type-deny]
      roles: [USER]
      effect: EFFECT_DENY
      condition:
        match:
          expr: P.attr.level > 0
    # A variable error must affect its referencing action, not the unrelated action.
    - name: invalid_variable_deny
      actions: [variable-deny]
      roles: [USER]
      effect: EFFECT_DENY
      condition:
        match:
          expr: V.invalid_flag
    # A failed derived role must not silently remove a DENY in strict mode.
    - name: invalid_derived_role_deny
      actions: [derived-deny]
      derivedRoles: [blocked_department]
      effect: EFFECT_DENY
    # Without a second ALLOW, an errored ALLOW denies in both evaluation modes.
    - name: missing_attribute_allow
      actions: [missing-allow]
      roles: [USER]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: P.attr.blocked == true
