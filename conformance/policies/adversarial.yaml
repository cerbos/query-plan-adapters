# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
#
# Hostile policy shapes for the adversarial differential test. Each action is exercised through
# a REAL PDP and the adapter's filtered result set is compared against an oracle computed by
# calling the check API per seeded row — no hand-computed expectations.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: adversarial
  # Composition probes only (#487): the derived role and the two variables below are referenced by
  # the `compose-*` actions at the end of this file and by nothing else.
  importDerivedRoles: ["adversarial_compose"]
  variables:
    local:
      compose_teamed: R.attr.aOptionalString in P.attr.fewTeams
      compose_large: R.attr.aNumber > 10
  rules:
    # -- value-first comparisons (planner preserves source order) --
    - actions: ["vf-le"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 3 <= R.attr.aNumber

    - actions: ["vf-ge"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 2 >= R.attr.aNumber

    - actions: ["vf-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"one" != R.attr.aString'

    # -- in normalization (single element -> eq; empty -> always-denied) --
    - actions: ["in-single"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString in ["one"]

    - actions: ["in-empty"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString in []

    # -- LIKE metacharacters must be escaped, not interpreted --
    - actions: ["like-percent"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.startsWith("100%")

    - actions: ["like-underscore"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.contains("a_b")

    - actions: ["like-backslash"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.endsWith("\\")

    # '[' must be escaped: T-SQL LIKE treats '[...]' as a character class even under an
    # ESCAPE clause (unescaped '[SEC]%' would match the d2 seed "Secret" and miss the d1
    # seed "[SEC]ret" on SQL Server). On H2/PostgreSQL/MySQL — the three oracle legs —
    # '\[' with ESCAPE must stay a literal '[': d1 in, d2 out, proving the escape is a
    # semantic no-op on those dialects.
    - actions: ["like-bracket"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.startsWith("[SEC]")

    # -- case sensitivity: CEL string equality is exact and case-sensitive, so the c1 seed
    # (aString "One") is DENIED here. A case-insensitive database collation (MySQL default
    # utf8mb4_0900_ai_ci, SQL Server *_CI_*) matches it anyway — the differential oracle
    # turns that into a test failure, proving the over-grant. See the README's
    # "Database collation requirements" section. h6 (aString "o\u00ADne", a SOFT HYPHEN) is
    # DENIED too, and a case-sensitive but not byte-exact collation (MySQL utf8mb4_0900_as_cs)
    # matches it: see the corpus README, "Case-sensitive is not byte-exact" (#474).
    - actions: ["cs-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString == "one"

    # -- the same hazard through STRING MATCHING, which collation does not govern --
    # cs-eq above probes `=`, and the advice it points at — "use a case-sensitive collation" —
    # is genuinely sufficient there. It is NOT sufficient for LIKE. SQLite's `LIKE` is
    # case-insensitive for ASCII no matter what collation the column was created with; only
    # `PRAGMA case_sensitive_like = ON` changes it. So an adapter can pass cs-eq on SQLite and
    # still over-grant every string predicate, which is exactly the state the corpus was in
    # before these three actions existed.
    #
    # One action per operator, matching the like-* group above (startsWith / contains /
    # endsWith are three different lowerings — LIKE 'x%', LIKE '%x%', LIKE '%x', or `instr`,
    # or `substr`+compare — and an adapter can get case right in one and wrong in another).
    #
    # c1 ("One") is the single witness in all three, and it is the ONLY seed that differs by
    # case, so a case-insensitive match adds exactly one row and nothing else moves:
    #   contains   oracle a1/a2/a3/b1  ("one", "100%_done", "100xdone", "oneXtwo")
    #   startsWith oracle a1/b1
    #   endsWith   oracle a1/a2/a3
    # The needles carry no LIKE metacharacter on purpose — like-percent/like-underscore/
    # like-backslash already own that hazard, and an adapter that rejects metacharacter
    # needles outright would otherwise never reach the comparison these actions probe.

    - actions: ["cs-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.contains("one")

    - actions: ["cs-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.startsWith("one")

    - actions: ["cs-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.endsWith("one")

    # -- string edge values --
    - actions: ["unicode-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString == "héllo🚀"

    - actions: ["empty-string-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString == ""

    # -- numeric edges --
    - actions: ["neg-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber < -1

    - actions: ["double-threshold"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber >= 1.5

    # -- collection macro semantics on empty/multi collections --
    - actions: ["all-on-empty"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.tags.all(t, t.name == "public")

    - actions: ["exists-on-empty"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.tags.exists(t, t.name == "public")

    - actions: ["exists-one-multi"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.tags.exists_one(t, t.name == "public")

    - actions: ["not-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.tags.exists(t, t.name == "private")'

    # -- outer resource attribute at TWO lambda depths (correlation-rebase probe) --
    - actions: ["outer-attr-depth2"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.categories.exists(c, c.subCategories.exists(s, s.name == "finance" && R.attr.aBool))

    # -- principal list folded into a lambda-scoped in --
    - actions: ["lambda-in-principal"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.tags.exists(t, t.name in P.attr.allowedTags)

    # -- logical shapes --
    - actions: ["nary-and"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.aBool
              - expr: R.attr.aNumber >= 0
              - expr: R.attr.aString != "one"

    - actions: ["double-negation"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(!R.attr.aBool)'

    - actions: ["triple-negation"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(!(!R.attr.aBool))'

    # not over NOT EXISTS (size==0) — negation composing over a negated subquery predicate
    - actions: ["not-empty"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(size(R.attr.tags) == 0)'

    # -- null-attribute alignment: CEL missing-attr error (deny) vs SQL NULL (excluded) --
    - actions: ["optional-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aOptionalString != "x"

    # -- field-to-field comparison inside a lambda (join column vs correlated outer column) --
    - actions: ["lambda-field-to-field"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.tags.exists(t, t.name == R.attr.aString)

    # -- size(coll) compared with a non-zero threshold → correlated COUNT subquery --
    - actions: ["size-threshold"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: size(R.attr.tags) > 1

    # -- size over a filtered collection → COUNT subquery with the lambda as WHERE --
    - actions: ["size-filter-count"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: size(R.attr.tags.filter(t, t.name == "public")) == 1

    # -- size(string) → LENGTH(column). Threshold chosen so the astral-char seed ("héllo🚀",
    # 6 code points in CEL vs 7 UTF-16 units in the DB) lands on the same side either way.
    - actions: ["string-size"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: size(R.attr.aString) > 4

    # -- top-level field-to-field: column compared to column, incl. NULL exclusion semantics --
    - actions: ["field-to-field"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString == R.attr.aOptionalString

    # -- CEL ternary (planner emits if(cond, then, else)) --
    # Canonical comparison-wrapped ternary: cmp(if(c,a,b), v) rewritten into guarded branches.
    - actions: ["ternary-cmp"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aBool ? R.attr.aNumber : 0) > 1'

    # Ternary whose condition is itself an expression (startsWith), not a bare bool column.
    - actions: ["ternary-expr-cond"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aString.startsWith("100") ? R.attr.aNumber : -1) >= 0'

    # Nested ternary: the then-branch is another ternary; empty-string seed lands in the inner else.
    - actions: ["ternary-nested"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aBool ? (R.attr.aString == "" ? 0 : R.attr.aNumber) : -1) >= 2'

    # Negation must inspect only the selected ternary arm. aBool=true permits even
    # without a parent; a selected missing parent/optional string is an error and denies.
    # This catches an outer NOT that either requires an unselected relation or turns
    # a selected relation's NULL predicate into an allow.
    - actions: ["not-ternary-parent"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aBool ? "one" : R.attr.parent.aOptionalString) == "set")'

    # Ternary under !(...): NOT over the OR-of-guarded-branches rewrite.
    - actions: ["ternary-negated"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aBool ? R.attr.aNumber : 0) > 1)'

    # Bare boolean-result ternary: both branches are predicates, no wrapping comparison.
    - actions: ["ternary-bare"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBool ? R.attr.aString == "one" : R.attr.aNumber < 0'

    # Value-first form: constant on the left of the comparison wrapping the ternary.
    - actions: ["ternary-value-first"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '0 < (R.attr.aBool ? R.attr.aNumber : -1)'

    # NULL condition column (aOptionalString is NULL on a2/a4/a8): CEL missing-attr error (deny)
    # must align with SQL three-valued logic excluding the row from BOTH rewritten branches.
    - actions: ["ternary-null-cond"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aOptionalString != "x" ? R.attr.aNumber : 0) > 1'

    # -- field-to-field contains/startsWith/endsWith: the needle is a COLUMN, so its LIKE
    # metacharacters (b1/b2/b3 seeds hold _ % \) must be escaped dynamically; NULL needle
    # rows (a2/a4/a8) are a CEL missing-attr error (deny) and must be excluded in SQL too.
    - actions: ["f2f-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.contains(R.attr.aOptionalString)

    - actions: ["f2f-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.startsWith(R.attr.aOptionalString)

    - actions: ["f2f-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.endsWith(R.attr.aOptionalString)

    # -- arithmetic in comparisons. Literals are double-typed on purpose: Cerbos attribute
    # values are CEL doubles, so int-literal arithmetic (e.g. R.attr.aNumber + 1) is a CEL
    # no-overload error that denies EVERY row at check time — and the wire plan is identical
    # for both spellings, so the adapter translates the (only satisfiable) double semantics.
    - actions: ["arith-add"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber + 1.0 > 2.0'

    # Value-first: constant on the left, arithmetic on the right (mirrored by the adapter).
    - actions: ["arith-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '2.0 < R.attr.aNumber + 1.0'

    - actions: ["arith-sub"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber - 3.0 <= 0.0'

    # Negative multiplier: emitted as SQL-side arithmetic, so no inequality flipping.
    # Negative seeds (a2:-2, a5:-5, b3:-4) sit on the excluded side.
    - actions: ["arith-mult-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber * -2.0 < 3.0'

    # Division truncation probe: 2/2.0 == 1.0 matches, but 3/2.0 == 1.5 must NOT — an
    # adapter doing integer division would wrongly include the aNumber==3 seed (a6).
    - actions: ["arith-div"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / 2.0 == 1.0'

    # Fractional threshold over division (double-space comparison end to end).
    - actions: ["arith-div-frac"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / 2.0 >= 1.5'

    # Arithmetic on BOTH sides of the comparison: n + 1 > n * 2 ⇔ n < 1.
    - actions: ["arith-both"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber + 1.0 > R.attr.aNumber * 2.0'

    # -- IEEE add-solve probes: eq/ne over field + FRACTIONAL constant. An algebraic solve
    # computes 0.1 - 0.7 = exactly -0.6 in Java, but IEEE subtraction does not invert IEEE
    # addition: check(aDouble=-0.6) DENIES eq because -0.6 + 0.7 == 0.09999999999999998 !=
    # 0.1 (and ALLOWS ne). The a1 seed holds aDouble=-0.6 so a pre-solved `a_double = -0.6`
    # filter diverges from the oracle in both directions; the adapter must lower these to
    # SQL-side double arithmetic like the ordering operators.
    - actions: ["arith-add-eq-frac"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aDouble + 0.7 == 0.1'

    - actions: ["arith-add-ne-frac"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aDouble + 0.7 != 0.1'

    # Exactly-representable witness: 0.25 + 0.5 == 0.75 IS exact in binary floating point,
    # so the a2 seed (aDouble=0.25) must be INCLUDED — pins that the SQL lowering of eq is
    # not just always-false.
    - actions: ["arith-add-eq-frac-exact"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aDouble + 0.5 == 0.75'

    # CEL's `+` over two COLUMNS, the one `add` shape where the plan carries no constant to say
    # which overload it is (cerbos/query-plan-adapters#391).
    #
    # The `id-concat` pair proved the string overload where one operand is a literal: CEL has no
    # mixed-type `+`, so a string constant settles it. Here BOTH operands are variables and
    # nothing in the plan names a column's type, so an adapter that dispatches `add` straight to
    # SQL `+` cannot know it is concatenating. Every store then answers differently, and one of
    # them answers WRONGLY IN THE DANGEROUS DIRECTION:
    #
    #   - PostgreSQL   `text + text` has no operator — a hard error, which is at least loud.
    #   - SQLite       'one' + 'set' is 0 + 0 = 0, and `0 = 'oneset'` is FALSE across storage
    #                  classes — 0 rows, an under-grant.
    #   - MySQL        the same coercion to 0, but `0 = 'oneset'` coerces the CONSTANT to 0 too,
    #                  so `0 = 0` is TRUE for every row whose columns are both non-NULL — 16 of
    #                  the 21 seeds against a ONE-row oracle. A silent over-grant.
    #
    # Oracle {a1}: "one" + "set" = "oneset". c1 is the case trap — "One" + "Set" = "OneSet" must
    # not match, so the shape also crosses concatenation with the collation invariant. The five
    # NULL-aOptionalString seeds (a2/a4/a8/c2/e1) are missing-attribute errors that deny, and
    # `col || NULL` is NULL in SQL, so both sides exclude them for the same reason. Every seed's
    # concatenation is distinct, so no other row can match by accident.
    - actions: ["concat-f2f"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString + R.attr.aOptionalString == "oneset"'

    # ==================== clean-room probes (coverage gap hunt) ====================

    # -- GROUP A: compositions claimed-supported but unproven e2e --

    # A1: ternary inside an exists() lambda body.
    - actions: ["p-ternary-in-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, (R.attr.aBool ? t.name : "zz") == "public")'

    # A2: arithmetic inside a lambda body (over the outer numeric attr).
    - actions: ["p-arith-in-lambda"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, t.name == "public" && R.attr.aNumber + 1.0 > 2.0)'

    # A3: field-to-field where BOTH fields are lambda-element columns (b4 is the witness).
    - actions: ["p-lambda-inner-f2f"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, t.id == t.name)'

    # A4: field-to-field LIKE inside a lambda, needle is an OUTER attr column
    # (a8 has aString == "" so every tag matches contains("")).
    - actions: ["p-lambda-f2f-like"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, t.name.contains(R.attr.aString))'

    # A5: size() of a NESTED relation path (relation reached through another relation).
    - actions: ["p-size-nested"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.categories.exists(c, size(c.subCategories) == 1)'

    # A6a: ternary whose BOTH branches are themselves ternaries.
    - actions: ["p-ternary-of-ternaries"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aBool ? (R.attr.aString == "" ? 0.0 : R.attr.aNumber) : (R.attr.aNumber < 0.0 ? -1.0 : 5.0)) > 1.0'

    # A6b: ternaries on BOTH sides of the comparison.
    - actions: ["p-ternary-vs-ternary"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aBool ? R.attr.aNumber : 0.0) > (R.attr.aString == "" ? 1.0 : 2.0)'

    # A6c: ternary under all().
    - actions: ["p-ternary-under-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.all(t, (R.attr.aBool ? t.name : "zz") != "private")'

    # A7: hasIntersection over a map(...) projection with unicode + LIKE metachars in the list.
    - actions: ["p-hasintersection-map"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.tags.map(t, t.name), ["public", "héllo🚀", "100%_x"])'

    # A8: deep and/or/not nesting (5+ levels) mixing arith, LIKE, exists, f2f.
    - actions: ["p-deep-nest"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aBool && (R.attr.aNumber + 1.0 > 2.0 || R.attr.aString.startsWith("100%"))) || (!R.attr.aBool && R.attr.tags.exists(t, t.name == "public" || t.name == R.attr.aString)))'

    # A9a: single-element in against a NULLABLE column.
    - actions: ["p-in-null-single"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aOptionalString in ["x"]'

    # A9b: multi-element in against a NULLABLE column.
    - actions: ["p-in-null-multi"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aOptionalString in ["x", "one_two"]'

    # A10: startsWith with a constant-folded concat needle.
    - actions: ["p-startswith-concat"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.startsWith("100" + "%")'

    # -- GROUP B: suspected-unsupported shapes; record throw vs silent-wrong --

    # B11: timestamp comparison over a string column (h5 is malformed; all other rows are ISO dates).
    - actions: ["p-timestamp"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'timestamp(R.attr.createdBy) < timestamp("2025-01-01T00:00:00Z")'

    # B12: has() macro over an optional attribute.
    - actions: ["p-has"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'has(R.attr.aOptionalString)'

    # B13: map/struct member access (obj.inner mirrors aString on the check side).
    - actions: ["p-struct"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.obj.inner == "one"'

    # B14: matches() regex.
    - actions: ["p-matches"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^h")'

    # B15: list indexing.
    - actions: ["p-index"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags[0].name == "public"'

    # B16: negation of a NULL-condition ternary (three-valued logic under NOT).
    - actions: ["p-not-ternary-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aOptionalString != "x" ? R.attr.aNumber : 0.0) > 1.0)'

    # B17: negated exists over rows with ZERO tags (a2/b1/b2/b3).
    - actions: ["p-not-exists-empty"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.tags.exists(t, t.name == "public")'

    # B18: non-representable fraction: 3 * 0.1 != 0.3 in IEEE double.
    - actions: ["p-double-frac"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber * 0.1 == 0.3'

    # B19-B21: int()/double() casts (cerbos/query-plan-adapters#311).
    # CEL reads a WHOLE string or raises; SQL reads the leading digits. `int("100%_done")` is a
    # CEL error and check() DENIES, while `CAST('100%_done' AS INTEGER)` is 100 on SQLite (and
    # 0 on MySQL, and a hard error on PostgreSQL) — a direct lowering returns rows the PDP
    # denies. Both oracles below are EMPTY by construction: every seed's aString raises. The
    # assertion that matters is therefore the REJECTION, and the over-grant it prevents is
    # concrete: an adapter that lowers the cast returns a2 ("100%_done"), a3 ("100xdone") and
    # b2 ("50%_off"), the three seeds whose aString casts to a non-zero number.
    #
    # The shared policy suite's `convert-int` looks like it covers this, but its fixtures hold
    # no string that casts to a non-zero number, so it passes for every adapter without ever
    # exercising the difference.
    - actions: ["cast-int-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'int(R.attr.aString) > 50'

    - actions: ["cast-double-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'double(R.attr.aString) > 50.0'

    # The second, independent cast hazard: rounding. CEL's int() truncates TOWARD ZERO, and so
    # does SQLite's CAST — but PostgreSQL and MySQL CAST round to nearest. a1 (aDouble = -0.6)
    # is the sole discriminator: int(-0.6) is 0 and the row is ALLOWED, while a rounding cast
    # gives -1 and drops it. Oracle a1/a2/a7 (aDouble -0.6 / 0.25 / 0.3). Unlike the string
    # casts this one has a real oracle, so an adapter that emits an explicit truncation rather
    # than a bare CAST can be declared in `adapterSupportedExpected` and proved against it.
    - actions: ["cast-int-double"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'int(R.attr.aDouble) == 0'

    # The third cast direction: string(), the OUTBOUND cast. `string` is one of the operators the
    # corpus has never put on the wire, so no adapter has ever been asked what it does with one
    # (cerbos/query-plan-adapters#376). Unlike the two inbound casts above these carry REAL
    # oracles, so an adapter that lowers them can be proved right rather than only refused.
    #
    # The pair is split by whether the rendering is store-INDEPENDENT, because that is what
    # decides whether lowering is defensible at all:
    #
    # `cast-string-double` is the agreeing half, for the values this corpus holds. CEL renders
    # -0.6 as "-0.6" and so does every store the corpus executes against: PostgreSQL 17 renders
    # `CAST((-0.6)::float8 AS TEXT)` as `-0.6`, as do SQLite and MySQL. (The `-0.60000000000000009`
    # rendering only appears under `extra_float_digits = 3`; PostgreSQL 12 made shortest
    # round-trip the default, so a port that relied on that divergence would pin nothing. Measured
    # against the pinned images, not assumed.) a1 is the sole witness — aDouble is -0.6 there,
    # 0.25 on a2, MISSING on a3 (a CEL error, denied) and aNumber + 0.3 everywhere else, none of
    # which formats to "-0.6".
    #
    # "Agreeing for these values" is the whole claim. CEL's number formatting is Go's and does NOT
    # agree with every runtime everywhere — an adapter that reimplements the conversion rather
    # than delegating to its store has to bound the range it can reproduce; convex does, and says
    # so at `convertToString`. This action pins the corpus's own values, not the general rule.
    - actions: ["cast-string-double"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'string(R.attr.aDouble) == "-0.6"'

    # `cast-string-bool` is the diverging half, and the reason this group is a pair. CEL renders a
    # bool as "true"/"false"; SQLite and MySQL have no boolean type and store 1/0, so
    # `CAST(a_bool AS TEXT)` is "1" and a direct lowering matches NOTHING. PostgreSQL renders
    # "true" and the same lowering is correct. One translator, one wire node, two answers
    # depending only on the store — which is why an adapter spanning both (prisma and drizzle each
    # run this corpus twice, once per ADAPTER_TEST_DB) cannot lower it store-blind, and why the
    # oracle is deliberately large: 14 of the 22 seeds carry aBool = true, so the SQLite failure
    # direction is an UNDER-grant of all 14 rather than a near miss.
    - actions: ["cast-string-bool"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'string(R.attr.aBool) == "true"'

    # B22-B23: filter()/map() in a BOOLEAN position (cerbos/query-plan-adapters#313).
    # Both return a list, not a boolean. Cerbos compiles the policy and the planner emits the
    # macro verbatim as the whole condition (PDP-verified: KIND_CONDITIONAL with a bare
    # `filter`/`map` node), but check() cannot evaluate a non-boolean condition, so the oracle
    # is empty for all 22 seeds. Every adapter must REJECT the shape: translating it means
    # choosing a meaning the policy never stated — `filter(...)` is not `size(filter(...)) > 0`,
    # and a `map(...)` projection is not "the projection is non-empty".
    - actions: ["filter-as-condition"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.filter(t, t.name == "public")'

    - actions: ["map-as-condition"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.map(t, t.name)'

    # ==================== NULL element columns under collection macros ====================
    # b5 has ONLY a NULL-name tag; b6 mixes a NULL-name tag with a "public" one. A missing
    # element attribute is a CEL evaluation error: exists/all absorb it only through a
    # true/false witness, exists_one never does. The SQL translation must keep these rows
    # UNKNOWN (excluded under both polarities), never FALSE — NOT(FALSE) leaks.

    # exists_one errors on ANY erroring element — even alongside a true one (b6).
    - actions: ["n-not-exists-one-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.tags.exists_one(t, t.name == "public")'

    # all with a determined-true sibling and one NULL element (b6): no false witness, so the
    # error surfaces — the unknown-element detection must work on MIXED collections.
    - actions: ["n-all-mixed-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.all(t, t.name != "x")'

    # NOT over an erroring all(): !error is still an error → deny.
    - actions: ["n-not-all-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.tags.all(t, t.name == "public")'

    # Absorption control: b6 has a FALSE witness for this body ("public" != "public"), so
    # all = false (not error) and the negation must still ALLOW despite the NULL sibling.
    - actions: ["n-not-all-absorb"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.tags.all(t, t.name != "public")'

    # ==================== constant-receiver string matches ====================
    # The CONSTANT is the receiver (haystack) and the COLUMN the needle: the planner preserves
    # source order, so these arrive as contains(value, variable) and must NOT be operand-order
    # normalized (swapping silently inverts haystack and needle). Constants are chosen so the
    # metacharacter seeds discriminate needle escaping: a2 "100%_done" (unescaped '%…_…' would
    # falsely match "…100Xdone…"), a4 "xa_by" (unescaped '_' would match the 'X' in "xaXby…"),
    # a7 "tail\" (a mis-escaped '\' turns the pattern into a literal '%').

    # True for a1 ("one" ⊂ "…Xdone…"), a7 ("tail\" ⊂ "…-tail\one…"), a8 (""); a2 is the
    # escaping discriminator.
    - actions: ["cr-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"s100Xdone-tail\\one-end".contains(R.attr.aString)'

    # True for a5 ("xaXby" prefix) and a8 (""); a4 "xa_by" is the escaping discriminator.
    - actions: ["cr-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"xaXby-tail".startsWith(R.attr.aString)'

    # True for a5 ("xaXby" suffix) and a8 (""); a4 "xa_by" is the escaping discriminator.
    - actions: ["cr-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"prefix-xaXby".endsWith(R.attr.aString)'

    # Concat RECEIVER: whether the planner ships it folded or as add(value, value), the
    # adapter must treat the fold as the haystack, never as a column-receiver LIKE.
    - actions: ["cr-startswith-concat"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '("xaX" + "by-tail").startsWith(R.attr.aString)'

    # ==================== arithmetic edge probes ====================

    # Column divisor with a zero row (a7 aNumber=0): CEL 0.0/0.0 is NaN → an ORDERED
    # comparison against NaN is false → deny; the SQL must not abort on division by zero.
    # A NULLIF guard yields UNKNOWN, which also excludes the row, so this probe agrees with
    # a NULL lowering and CANNOT discriminate the two. cr-div-zero-ne below is what does.
    - actions: ["cr-div-zero"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / R.attr.aNumber > 0.5'

    # The discriminator cr-div-zero cannot be: an INEQUALITY against NaN. CEL attribute
    # arithmetic is double-typed, so 0/0 is NaN and `NaN != 1.0` is TRUE — a7 is ALLOWED.
    # An adapter that lowers the division to SQL NULL (a NULLIF divide-by-zero guard) gets
    # `NULL != 1.0` → UNKNOWN and wrongly EXCLUDES a7, denying a row the PDP permits.
    # Over-restrictive rather than a bypass, but it still breaks the oracle equality.
    # a7 (aNumber=0) is the sole witness; every other numeric seed divides to exactly 1.0.
    - actions: ["cr-div-zero-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / R.attr.aNumber != 1.0'

    # Same NaN witness reached through negated equality instead of a bare inequality, so an
    # adapter cannot pass by special-casing `ne`. Under CEL, `0/0 == 1.0` is false and the
    # negation is TRUE, so a7 is allowed. Under SQL three-valued logic a NULL lowering gives
    # UNKNOWN, and NOT UNKNOWN is still UNKNOWN — a7 stays excluded under BOTH polarities.
    - actions: ["cr-div-zero-eq-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aNumber / R.attr.aNumber == 1.0)'

    # IEEE-754 keeps the SIGN of a zero: 2.0 / -0.0 is -Infinity while 2.0 / 0.0 is +Infinity.
    # The planner ships the denominator verbatim as the double -0.0 (PDP-verified: the wire
    # operand is `-0`, and protobuf doubles preserve the sign bit), so an adapter that folds the
    # division has everything it needs — but one that reads the magnitude only, or takes the
    # sign of the result from the numerator, inverts every row. Oracle: the NEGATIVE-aNumber
    # seeds a2/a5/b3 (n / -0.0 = +Infinity > 0.0), NOT the positive ones; a7 (aNumber = 0) is
    # 0.0 / -0.0 = NaN, and every ordering against NaN is false.
    #
    # Note the half no adapter can reach: when the denominator is a COLUMN holding zero, SQL
    # cannot tell -0.0 from 0.0 (both satisfy `= 0`, and no portable function reads the sign
    # bit), so the sign of the Infinity is unknowable. The existing cr-div-zero* actions all
    # divide a column by ITSELF, where a zero denominator forces a zero numerator and the result
    # is the sign-free NaN, so they never reach it either. Pinning that half would need a seed
    # whose aDouble is a signed zero, which would make column division inexpressible for every
    # SQL adapter — a separate decision, deliberately not taken here.
    - actions: ["cr-div-neg-zero"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / -0.0 > 0.0'

    # A denominator that is a DIFFERENT column. Every existing division probe is x/x, so the
    # NULL denominator (a3 has no aDouble), the negative denominator (a1 = -0.6, which must not
    # flip the comparison) and the plain two-column form are all uncovered. Oracle excludes
    # a1 (5 / -0.6 < 0), a2 (-2 / 0.25 < 0), a3 (missing attribute -> CEL error) and a7
    # (0 / 0.3 == 0, not > 0).
    - actions: ["cr-div-other-column"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / R.attr.aDouble > 0.0'

    # Arithmetic composed ON a division that can be non-finite. a7 divides 0/0 to NaN, and
    # NaN + 1.0 is NaN. This ORDERING form is the absorbing control — `NaN > 1.0` is false and a
    # NULL lowering is UNKNOWN, so both exclude a7 and the two cannot be told apart here, the
    # same way cr-div-zero cannot discriminate what cr-div-zero-ne does.
    - actions: ["cr-div-then-add"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / R.attr.aNumber + 1.0 > 1.0'

    # The discriminator: an INEQUALITY over the same sum. CEL gives `NaN != 2.0` -> TRUE, so a7
    # is the sole ALLOWED row. An adapter that guards the division with NULLIF propagates NULL
    # through the addition and gets `NULL != 2.0` -> UNKNOWN, excluding the one row the PDP
    # permits and returning the empty set.
    - actions: ["cr-div-then-add-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / R.attr.aNumber + 1.0 != 2.0'

    # ==================== multi-hop relation chains (W1) ====================
    # Direct dotted-chain syntax. mainCategory is a SINGLE nested object on the check side
    # (each seed holds at most one category) so CEL evaluates the chain naturally, while the
    # adapter maps the same path through TWO collection hops (categories JOIN subCategories):
    # the translated subquery must join through the intermediate hop, never off the root.
    # Rows without the attribute are a CEL missing-attr error (deny) on the check side and an
    # empty join chain (excluded) on the SQL side.

    - actions: ["w1-exists-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.mainCategory.subCategories.exists(s, s.name == "finance")'

    # size() over the chain = JOIN-through COUNT of the flattened tail elements.
    - actions: ["w1-size-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.mainCategory.subCategories) > 0'

    # Plain membership over the chained string list (adapter: defaultMemberField name).
    - actions: ["w1-in-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"finance" in R.attr.mainCategory.subNames'

    # -- the ABSENT to-one parent (cerbos/query-plan-adapters#309) --
    # The three chain probes above are all POSITIVE (exists / size > 0 / in), where "the parent
    # is absent" and "the parent is present with no matching child" both exclude the row — so
    # both sides agree for the wrong reason and the hazard hides. Only a UNIVERSAL, a NEGATED
    # existential, or a zero/lower-bound count discriminates them:
    #
    #   check(): rows with no mainCategory attribute are a CEL missing-path error -> DENY.
    #   a filter rooted at the resource row: the join chain yields no correlated rows, so
    #   `all` is vacuously TRUE, `!exists` is TRUE, and the count is 0 -> ALLOW.
    #
    # That is an over-grant: rows the PDP denies come back. The adapter's chain must require the
    # intermediate hop to EXIST, so an absent parent stays excluded under both polarities rather
    # than collapsing to the empty-collection case.
    #
    # Seeds discriminate already — a category graph is created only for a seed with
    # subCategoryNames, so 18 of the 22 seeds carry NO mainCategory at all: a1/a6 hold
    # "finance", a8 "tech", c1 "Finance" (the case witness).

    # all() over the chain: oracle a1/a6; a vacuous-TRUE chain adds the 17 parentless rows.
    - actions: ["w1-all-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.mainCategory.subCategories.all(s, s.name == "finance")'

    # Negated existential over the chain: oracle a8/c1 (present parent, no "finance" child).
    - actions: ["w1-not-exists-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.mainCategory.subCategories.exists(s, s.name == "finance")'

    # Zero-count over the chain. No seed holds a parent with zero children, so the oracle is
    # EMPTY by construction — deliberately, because the whole assertion is that the 16
    # parentless rows must NOT come back. Prisma-style relation filters reach this through a
    # different code path than the ordering thresholds (`none:` rather than a COUNT), which is
    # why it is worth its own action. Being oracle-empty it stays OUT of the degeneracy guard;
    # w1-all-chain and w1-not-exists-chain carry the anti-vacuity assertion for this group.
    - actions: ["w1-size-zero-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.mainCategory.subCategories) == 0'

    # The lower-bound mirror of w1-size-chain (`> 0`, which agrees for the wrong reason because
    # a positive count already implies the parent exists). A count is never negative, so `>= 0`
    # is TRUE for exactly the rows that HAVE the attribute: oracle a1/a6/a8/c1, while a chain
    # that folds the threshold to always-true returns all 22. Non-degenerate, so this is the
    # count-path member of the degeneracy guard.
    - actions: ["w1-size-nonneg-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.mainCategory.subCategories) >= 0'

    # -- the same hazard through MEMBERSHIP (cerbos/query-plan-adapters#315) --
    # w1-in-chain above is the only membership probe over the chain and it is POSITIVE, so
    # "parent absent" and "parent present, no match" both exclude the row and agree for the
    # wrong reason — the identical blind spot the #309 additions closed for the collection
    # macros. Membership is not a collection macro in most adapters, so the per-macro guard
    # never reached it: the guard belongs one level lower, in the shared relation-scope
    # construction every operator builds on (which is why ent and pgx were already aligned).
    #
    # Both oracles are a8 ("tech") and c1 ("Finance") — the present-parent-no-match witnesses.
    # An unguarded NOT EXISTS wrongly adds the 17 parentless seeds. Non-degenerate, so both
    # belong in the degeneracy guard.

    # Negated membership over the chained string list.
    - actions: ["w1-not-in-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!("finance" in R.attr.mainCategory.subNames)'

    # The same operand under a sibling operator: hasIntersection reaches the chain through a
    # different translation branch in every adapter, so it discriminates the guard separately.
    - actions: ["w1-not-hasint-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!hasIntersection(R.attr.mainCategory.subNames, ["finance"])'

    # -- the same hazard through the NEGATED count spelling (#316) --
    # The planner does NOT normalise `!(size(...) > 0)` into `size(...) == 0` — it emits the
    # negation verbatim — so the two spellings are different wire shapes hitting different
    # branches. An adapter that special-cases a positive count into an existence check before
    # the hop guard applies negates that check and readmits every parentless row, even though
    # w1-size-zero-chain passes. Guarding the COUNT EXPRESSION instead makes `== 0`, `> 0`,
    # `>= N` and their negations all inherit it.
    #
    # Every seed that HAS a mainCategory has at least one subCategory, and the 17 without it
    # are CEL missing-path errors, so the oracle is EMPTY by construction — like
    # w1-size-zero-chain it therefore stays OUT of the degeneracy guard, which asserts a
    # non-empty non-total oracle; w1-all-chain, w1-not-exists-chain and w1-size-nonneg-chain
    # carry the anti-vacuity assertion for this group.
    - actions: ["w1-not-size-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(size(R.attr.mainCategory.subCategories) > 0)'

    # -- the same hazard through a TERNARY CONDITION (#334) --
    # A ternary reaches its false-branch through its own rewrite rather than through the
    # negation helper, so an adapter that spells "the condition is false" as a bare NOT over
    # the chain filter never picks up the hop requirement: `NOT(chain matches)` is TRUE for an
    # absent to-one parent, which selects the ELSE branch for rows CEL denies outright (the
    # missing path is an evaluation error, not a false condition).
    #
    # The branches are chosen to disagree on the four seeds that HAVE a parent, so branch
    # selection is discriminated separately from the guard: a1/a6 take the then-branch
    # (aBool -> true, ALLOW), a8/c1 take the else-branch (!aBool -> false, DENY). Oracle a1/a6.
    # An unguarded false-branch adds the parentless rows whose aBool is false — a2, a5, b2, b4,
    # b6, c2, d2 — on top. Non-degenerate, so this belongs in the degeneracy guard.
    - actions: ["w1-ternary-chain-cond"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '("finance" in R.attr.mainCategory.subNames) ? R.attr.aBool : !R.attr.aBool'

    # ==================== the real to-one join (G1) ====================
    # `parent` is the corpus's ONE real to-one relation and `parent.inner` is one hop further
    # out; both are a JOIN, unlike `obj.inner` above, which is a flat column wearing a dotted
    # name. See README.md, "The real to-one relation", and ADR 0005. The W1 block above reaches
    # a COLLECTION through a chain; this block reaches a SCALAR, which is a different set of
    # hazards: a collection tail has an aggregation form in every adapter, a scalar tail does
    # not, and mongoose's `$cond` treats a missing scalar path as falsy rather than as an error.
    #
    # The seeds split 8 / 6 / 7 by depth and every action below turns on that split:
    #   no parent at all  (8): a5 a6 a8 b3 b4 b5 c2 d2
    #   parent, no inner  (6): a3 a7 a9 b2 c1 d1
    #   parent and inner  (7): a1 a2 a4 b1 b6 e1 f1
    #
    # On the check side a level that does not exist sends NO attribute, so the path is a CEL
    # missing-path error and the PDP DENIES. A filter rooted at the resource row reaches the
    # same answer only if its join REQUIRES the hop; a LEFT JOIN left unguarded readmits every
    # row whose parent is absent. That is the same over-grant #309 documents for collections,
    # and the negated and null-comparison shapes below are what discriminate it — the positive
    # ones agree for the wrong reason, because "no parent" and "parent that does not match"
    # both exclude the row.
    #
    # A filter that is correct but joins with the wrong MULTIPLICITY returns duplicate or
    # missing rows, which no wire-shape assertion can see. Only executed rows catch it.

    # Scalar string equality through one hop. Deliberately NOT the shared suite's `== true`
    # (rel-bool-hop below already covers a boolean): a case trap is worth more here, because a
    # join carries the operand into whatever collation the JOINED table was created with.
    # Oracle b1 (parent c1, "One"). e1's parent a1 holds "one", so a case-insensitive collation
    # one hop out — the column most likely to have been created without the root's collation —
    # wrongly adds e1.
    - actions: ["rel-eq-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aString == "One"'

    # Numeric equality through one hop. Oracle a1/a7 (parents a3 and a8, both aNumber 2).
    - actions: ["rel-eq-num-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber == 2'

    # The four orderings through one hop. The parent numbers span negatives and zero (a2 = -2,
    # b3 = -4, a8 = 0), so none of these folds to a tautology over the parented rows, and each
    # threshold sits ON a boundary value so `<` and `<=` cannot agree by accident:
    #   lt  oracle a4/b2        (2 of the 13 parented rows)
    #   le  oracle a1/a4/a7/b2  (4 — the two boundary rows a1/a7 are the whole difference)
    #   gt  oracle 9            (the complement of le among parented rows)
    #   ge  oracle 11           (gt plus the same two boundary rows)
    # A hop that silently drops the join returns rows against the ROOT's aNumber instead, which
    # disagrees with every one of these.
    - actions: ["rel-lt-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber < 2'

    - actions: ["rel-le-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber <= 2'

    - actions: ["rel-gt-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber > 2'

    - actions: ["rel-ge-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber >= 2'

    # TWO comparisons against the SAME hop under a conjunction. They must resolve to ONE join,
    # not two: a second independent join multiplies the row set, and against a to-one relation
    # that is invisible until the two predicates disagree — which is exactly what a range does.
    # Oracle a2/a3/a9/b1/e1/f1 (parent aNumber strictly between 2 and 12).
    - actions: ["rel-range-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber > 2 && R.attr.parent.aNumber < 12'

    # Bare boolean through one hop, and its negation. The pair partitions the 13 parented rows
    # exactly — oracle a1/a3/a7/b1/b2/b6/e1/f1 (8) and a2/a4/a9/c1/d1 (5) — so the 8 rows with
    # NO parent must appear in NEITHER. That is the whole absent-parent hazard in two actions:
    # the positive one cannot see it (absent and false both exclude), the negated one can, and
    # an unguarded outer join readmits all 8 under the negation only.
    - actions: ["rel-bool-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aBool'

    - actions: ["rel-not-bool-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.parent.aBool'

    # Substring through one hop. The needle is deliberately free of BOTH a LIKE metacharacter
    # and a case variant, because what this action exists to prove is the JOIN — and the corpus
    # already proves the other two at the root (like-percent/like-underscore, cs-eq). A needle
    # carrying either would be rejected or mismatched before the walk ever reached the hop,
    # leaving the action classified against a mechanism it never tested. ("one" was tried and
    # does exactly that: SQLite's LIKE is ASCII-case-insensitive even where `=` is not, so b1's
    # parent "One" matched — a real store hazard, but not this action's.)
    # Oracle a1/a4 (parents "100xdone", "100%_done"). Reading the ROOT's own aString instead of
    # the parent's gives a2/a3 — disjoint, so the wrong level cannot agree by accident.
    - actions: ["rel-contains-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aString.contains("done")'

    # `!= null` through one hop. Two different absences have to reach the same answer: the 8
    # rows with no parent (no `parent` attribute at all) and the 3 whose parent's optional
    # column IS NULL (a4/a7/c1, parents a2/a8/c2 — a MISSING attribute one hop out, per the
    # relation's stated convention). Oracle is the other 10. An adapter that emits
    # `parent.aOptionalString IS NOT NULL` without requiring the join readmits the 8.
    - actions: ["rel-ne-null-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aOptionalString != null'

    # -- two levels out: where alias scoping and correlated-subquery nesting break --
    # One hop and two hops are different bugs. Only 7 seeds have an inner level at all, so 14
    # rows must be excluded here for one of two distinct reasons (no parent, or a parent with
    # no parent of its own) that an adapter is free to conflate and must not.

    # Boolean two levels out. Oracle a1/a2/e1 (inners a6, b3, a3). The other four two-level
    # rows carry a FALSE inner (a4, b1, b6, f1), so the action separates "inner is absent" from
    # "inner is present and false" as well as from the 14 rows with no inner.
    - actions: ["rel-bool-hop2"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.inner.aBool == true'

    # String prefix two levels out. The needle separates all three levels PAIRWISE, so an
    # adapter that anchors the predicate at the wrong depth cannot agree by accident:
    #   correct (parent.inner.aString): e1          — inner a3, "100xdone"
    #   wrong, one level short (parent): a1, a4     — "100xdone", "100%_done"
    #   wrong, at the root:              a2, a3     — "100%_done", "100xdone"
    # The three sets are disjoint, which is the property "startsWith on a chained string" alone
    # would not have given.
    - actions: ["rel-startswith-hop2"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.inner.aString.startsWith("100")'

    # -- the hop composed with something else --

    # A root-level predicate AND a hop predicate. The conjunction must not push the root's
    # condition into the join, nor drop either conjunct once a join is introduced. The hop
    # alone is TRUE for b6 and d1 (parents "[SEC]ret" and "Secret"); b6's own aBool is FALSE,
    # so the oracle is d1 alone and b6 is the witness — a filter that drops the root conjunct
    # returns it. Metacharacter-free for the same reason as rel-contains-hop above.
    - actions: ["rel-hop-and-root"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBool == true && R.attr.parent.aString.contains("re")'

    # A two-level hop OR a collection subquery — a to-one join and a to-many subquery in one
    # plan, under a disjunction, so neither may be emitted as a row-restricting inner join.
    # Oracle a1/a2/e1 (inner is TRUE) plus a6/a8/c1 (a category exists), and that second set is
    # the point: none of the three HAS an inner level, so their left branch is a CEL error, and
    # CEL's OR absorbs an error when the other branch is TRUE. Both flavours of absence are
    # represented — a6 and a8 have no parent at all, c1 has a parent with no parent of its own.
    # An adapter that treats the absent hop as row-excluding rather than as branch-local drops
    # all three: an UNDER-grant, where every other action in this block probes the over-grant.
    - actions: ["rel-hop2-or-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.inner.aBool == true || R.attr.categories.exists(c, c.name == "business")'

    # ==================== root relation inside a lambda body (W2) ====================
    # The inner R.attr.tags.exists(...) is planned INSIDE the categories lambda; its subquery
    # must correlate the ROOT entity (owner of "tags"), not the category join the lambda scope
    # is rooted at — CategoryEntity has no tags collection, so a wrongly anchored join fails at
    # query-build time (and would be silently wrong if a same-named collection existed).
    - actions: ["w2-outer-relation"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.categories.exists(c, size(c.subCategories) == 1 && R.attr.tags.exists(t, t.name == "public"))'

    # ==================== fractional size() thresholds ====================
    # COUNT is integral: >= 1.5 must round UP to >= 2 (truncation to >= 1 over-includes).
    # CEL's type checker rejects ==/!= between int and double (no matching overload), but
    # `dyn(1.5)` defers that to runtime and the planner drops the wrapper — so a fractional
    # eq/ne against size() IS plannable (see size-frac-ne-not / size-frac-eq-not below).
    - actions: ["cr-size-frac-ge"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.tags) >= 1.5'

    # -- the fractional threshold over a CHAIN (#333) --
    # `R.attr.tags` above is a DIRECT relation, so the ROUNDING these two pin has only ever
    # been exercised where there is no hop to require. Over a chain the rounded threshold and
    # the absent-parent guard interact, and each arm probes a different half of that.
    #
    # The `eq`/`ne` COLLAPSE is not probed over a chain yet. CEL rejects `size(...) == 1.5`
    # with "found no matching overload for '_==_' applied to '(int, double)'", but
    # `size(...) == dyn(1.5)` plans to the same wire node, so this is a corpus gap, not an
    # unreachable branch. An adapter that folds the collapse to a constant must still guard it
    # under a chain (`hops AND constant` is two-valued and readmits parentless rows under an
    # outer NOT). See conformance/README.md, "The absent to-one parent".

    # `>= 1.5` rounds UP to `>= 2`. No seed holds a parent with two or more subCategories, so
    # the oracle is EMPTY by construction and this arm cannot discriminate the hop guard — what
    # it discriminates is the ROUNDING: an adapter that TRUNCATES to `>= 1` returns a1/a6/a8/c1
    # while check() allows nothing. Being oracle-empty it stays OUT of the degeneracy guard,
    # which asserts a non-empty non-total oracle.
    - actions: ["w1-size-frac-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.mainCategory.subCategories) >= 1.5'

    # `<= 1.5` rounds DOWN to `<= 1`, which a count of ZERO also satisfies — so this arm
    # discriminates the hop guard as well as the rounding. Oracle a1/a6/a8/c1, the rows that
    # HAVE the parent (each holds one subCategory); an unguarded chain counts 0 for the 18
    # parentless rows and returns all 22. Non-degenerate, so this one belongs in the guard.
    - actions: ["w1-size-frac-le-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.mainCategory.subCategories) <= 1.5'

    # ==================== size(string) thresholds outside int range ====================
    # The planner delivers giant integer constants verbatim (PDP-verified — not folded).
    # cb.length is Expression<Integer>, so an unguarded (int) narrowing cast wrapped these
    # (4294967296 → 0), turning `size(aString) > 4294967296` into LENGTH(a_string) > 0 —
    # every non-empty row returned while check() denies ALL rows (no string has 2^32
    # chars). The fixed adapter folds statically: gt huge → always-false.
    - actions: ["size-huge-gt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.aString) > 4294967296'

    # The mirror arm: lt huge is true for every PRESENT string (check() allows all seeds —
    # every seed has aString set, including the empty a8), while the wrapped translation
    # LENGTH(a_string) < 0 excluded everything.
    - actions: ["size-huge-lt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.aString) < 4294967296'

    # The always-true size(string) arms UNDER NEGATION, over a NULLABLE column. A decided
    # threshold (a fractional `!=`) and a threshold outside int range (`< huge`, `> -huge`) are
    # true for every PRESENT string, so an adapter folds them statically — but a NULL column is a
    # missing attribute, and size() of it is a CEL error that denies under BOTH polarities. A
    # two-valued `col IS NOT NULL` fold negates to `col IS NULL` and readmits exactly those rows.
    # aString is never NULL, so size-huge-* cannot see this; aOptionalString is NULL on
    # a2/a4/a8/c2/e1. The negated arm is false for every present string, so on its own the
    # oracle would be empty by construction: the `|| aNumber > 10` disjunct makes it
    # non-degenerate (error || true absorbs to true in CEL, UNKNOWN OR TRUE is TRUE in SQL).
    # Oracle: b6/c1/c2/d1/d2/e1/f1/g1/h1–h7. An IS NULL fold also returns a2/a4/a8.
    - actions: ["size-huge-lt-not"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(size(R.attr.aOptionalString) < 5000000000) || R.attr.aNumber > 10'

    # The same fold below int range: `> -huge` holds for every present string.
    - actions: ["size-huge-neg-gt-not"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(size(R.attr.aOptionalString) > -5000000000) || R.attr.aNumber > 10'

    # The same fold for a DECIDED threshold: no integral length equals 1.5, so `!= 1.5` holds
    # for every present string. `size(x) != 1.5` is an (int, double) type error, but `dyn()`
    # defers the check to runtime heterogeneous equality and the planner drops the wrapper: the
    # wire carries `ne(size(x), 1.5)`, so a fractional size() equality IS policy-reachable.
    - actions: ["size-frac-ne-not"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(size(R.attr.aOptionalString) != dyn(1.5)) || R.attr.aNumber > 10'

    # The ALWAYS-FALSE folds under negation. `== 1.5`, `> huge` and `< -huge` hold for no present
    # string, so an adapter folds them to a constant FALSE — which NOT flips to TRUE for a NULL
    # column just as surely as it flips IS NOT NULL to IS NULL. Here the negated arm is TRUE for
    # every present string, so the oracle is every row with aOptionalString set plus c2/e1
    # (aNumber > 10); a2/a4/a8 are the NULL rows a bare FALSE readmits.
    - actions: ["size-frac-eq-not"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(size(R.attr.aOptionalString) == dyn(1.5)) || R.attr.aNumber > 10'

    - actions: ["size-huge-gt-not"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(size(R.attr.aOptionalString) > 5000000000) || R.attr.aNumber > 10'

    - actions: ["size-huge-neg-lt-not"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(size(R.attr.aOptionalString) < -5000000000) || R.attr.aNumber > 10'

    # ==================== constant NaN / ±Infinity ordering ====================
    # CEL 0.30 (Cerbos 0.55) returns false for ordering comparisons involving NaN.
    # not-nan-ord-le below proves negation must therefore allow the NaN arm.
    # Cerbos 0.55 folds literal non-finite arithmetic before planning, which cannot be
    # serialized as JSON. now() == now() is true within one evaluation (Cerbos captures
    # one timestamp) and prevents compile-time folding, preserving the division subtree.
    # The unguarded serialization failure is pinned in evaluation-modes/ separately.
    # Double.compare ranks NaN above every number and would turn the else arm into
    # always-true, returning every aBool=false row the PDP denies.
    - actions: ["nan-ord-ternary"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '((R.attr.aBool ? 1.0 : 0.0/0.0) > 0.5) && now() == now()'

    # Value-first spelling: the planner preserves source order, so the mirrored branch
    # comparison places the folded NaN on the normalized LEFT (lt → gt divergence arm).
    - actions: ["nan-ord-ternary-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(0.5 < (R.attr.aBool ? 1.0 : 0.0/0.0)) && now() == now()'

    # NaN on the RIGHT of the comparison (ternary vs ternary — both sides stay
    # expressions, so no mirror moves the NaN): le(0.5, NaN) must also be false.
    - actions: ["nan-ord-le"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '((R.attr.aBool ? 1.0/1.0 : 1.0/2.0) <= (R.attr.aBool ? 0.5 : 0.0/0.0)) && now() == now()'

    # ±Infinity sanity: infinities are ORDERED normally in IEEE space (+Inf > 0.5 allows,
    # -Inf > 0.5 denies) — they must not be excluded the way NaN is.
    - actions: ["nan-ord-inf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '((R.attr.aBool ? 1.0/0.0 : -1.0/0.0) > 0.5) && now() == now()'

    # ==================== hierarchy operators (hier-*) ====================
    # Both operand orders for each operator, plus LIKE-metacharacter path segments. The
    # planner preserves source order (PDP-verified: hierarchy(...) wrappers survive to the
    # plan verbatim in both orders), so field-first spellings put hierarchy(variable) FIRST:
    # when the field lands on the ANCESTOR side the adapter emits a strict-prefix IN list,
    # and when it lands on the DESCENDANT side an escaped prefix LIKE. ancestorOf and
    # descendentOf are STRICT (a path is never its own ancestor/descendant — the a3/b4
    # equal-path seeds pin this); overlaps is inclusive. The scope seeds also include
    # sibling STRING prefixes that are not PATH prefixes ("dept.engineering",
    # "dept.eng.platform2") and unescaped-wildcard traps (b2/b3) — see scopeFor(...) in
    # AdversarialConformanceTest.

    # field-first ancestorOf → scope IN ('dept', 'dept.eng') — the strict-prefix IN list.
    - actions: ["hier-ancestor-ff"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope).ancestorOf(hierarchy("dept.eng.platform"))'

    # constant-first ancestorOf → scope LIKE 'dept.eng.%' (strict descendants only).
    - actions: ["hier-ancestor-cf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy("dept.eng").ancestorOf(hierarchy(R.attr.scope))'

    # field-first descendentOf → scope LIKE 'dept.eng.%'.
    - actions: ["hier-descendent-ff"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope).descendentOf(hierarchy("dept.eng"))'

    # constant-first descendentOf → the FIELD is the ancestor → strict-prefix IN list.
    - actions: ["hier-descendent-cf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy("dept.eng.platform").descendentOf(hierarchy(R.attr.scope))'

    # field-first overlaps → IN ('dept') OR = 'dept.eng' OR LIKE 'dept.eng.%' (inclusive).
    - actions: ["hier-overlaps-ff"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope).overlaps(hierarchy("dept.eng"))'

    # constant-first overlaps → the same union with the operands mirrored.
    - actions: ["hier-overlaps-cf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy("dept.eng").overlaps(hierarchy(R.attr.scope))'

    # metachar LIKE branch: the prefix '50%:a_b:' must be escaped ('%'/'_' literal). The
    # b2 seed ("50x:a_b:y") is the unescaped-% trap, b3 ("50%:aXb:y") the unescaped-_ trap,
    # and b4 ("50%:a_b") the equal-path strictness trap.
    - actions: ["hier-meta-like"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope, ":").descendentOf(hierarchy("50%:a_b", ":"))'

    # metachar IN branch: strict prefixes ('50%', '50%.a_b') compared by equality — the
    # a9/b6 seeds match; no pattern matching may occur.
    - actions: ["hier-meta-in"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope).ancestorOf(hierarchy("50%.a_b.x"))'

    # metachar overlaps: the inclusive union emits BOTH branches at once over a constant whose
    # segments carry LIKE metacharacters — an equality IN list for the strict prefixes, an
    # equality for the whole path, and a prefix LIKE on '50%:a_b:' that must be escaped. The
    # hier-meta-like reaches the prefix-LIKE branch through descendentOf and hier-meta-in the
    # IN branch through ancestorOf; only overlaps reaches the prefix LIKE through the union,
    # so an adapter that escapes on its ancestor/descendant path but not on its overlap path
    # passes both of those and still leaks here. a9 ("50%") is the strict
    # prefix, b4 ("50%:a_b") the equal path, b1 ("50%:a_b:x") the descendant; b2 ("50x:a_b:y")
    # is the unescaped-% trap and b3 ("50%:aXb:y") the unescaped-_ trap, both of which an
    # unescaped LIKE '50%:a_b:%' would wrongly ALLOW. b6 ("50%.a_b") stays a single segment
    # under the ':' delimiter and must not match any branch.
    - actions: ["hier-overlaps-meta"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope, ":").overlaps(hierarchy("50%:a_b", ":"))'

    # '[' in a path segment routes through the prefix-LIKE branch: the pattern must escape
    # it as '\[' (SQL Server character classes ignore ESCAPE). The d1 scope
    # ("[env]:prod:eu") is the literal-bracket descendant; d2 ("e:prod:eu") is the row an
    # unescaped '[env]' class would match one character of on SQL Server.
    - actions: ["hier-bracket"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope, ":").descendentOf(hierarchy("[env]:prod", ":"))'

    # ==================== the primary key as a filterable attribute (id-*) ====================
    # Every other action in this corpus filters on a resource ATTRIBUTE. These six filter on
    # `request.resource.id` — the resource's own identity, which the planner leaves symbolic
    # because PlanResources is asked about a KIND, not a row (PDP-verified: the operand is a
    # `variable` named `request.resource.id`, not `request.resource.attr.id`).
    #
    # It is a distinct hazard from any attribute because it is the one column whose mapping is
    # structurally different per adapter rather than merely named differently: an ObjectId rather
    # than a string in mongoose, the PRIMARY KEY in the SQL adapters, the document identifier
    # rather than a metadata field in ChromaDB, and `_id` versus a mapped field in Elasticsearch.
    # An adapter that resolves attributes by stripping a `request.resource.attr.` prefix does not
    # reach this name at all, and the failure is silent: the variable looks like an unmapped
    # attribute rather than the key.
    #
    # `f1` is the witness seed, added for exactly this group: its aString EQUALS its own id and
    # its aOptionalString is that id prefixed, so the field-to-field and concatenation oracles are
    # non-degenerate without any comparison against a literal the corpus had to invent. The
    # retired suite's 24-hex ObjectId literal is deliberately NOT reproduced: it matches no seed,
    # so its oracle would be empty under any mapping, and the corpus cannot mandate an ObjectId
    # column in the first place — a store's key type is the harness's business. Mongoose's
    # coercion is a caller-supplied `valueParser` on the mapper entry, and three of these six
    # compare the key against a STRING column, so one key mapping cannot be an ObjectId and
    # satisfy them; that adapter pins the coercion against the id-eq-const wire fixture in its
    # translator unit test instead (#378). See README.md, "The primary key as a filterable
    # attribute".

    # The key against a constant. Oracle {f1} — one row, and necessarily so: an id is unique, so
    # this is the largest oracle the shape admits. It still discriminates in both directions, and
    # it is the shape most adapters CAN express: it reduces to a bare key compared with a literal,
    # which is the only id-* form ChromaDB and Elasticsearch translate at all.
    - actions: ["id-eq-const"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.id == "f1"'

    # The key against a COLUMN, both polarities. `field-to-field` already covers column-versus-
    # column, but never against the key, where an adapter has to name the primary key on one side
    # of a comparison it usually only reads. The negation is the load-bearing half: its oracle is
    # 21 of 22, so an adapter that resolves the key to the wrong column, or drops the comparison,
    # is caught by the row COUNT rather than by a single missing row.
    - actions: ["id-f2f"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == R.id'

    - actions: ["id-f2f-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString != R.id'

    # STRING concatenation against the key, in both operand orders. The corpus's `add` is numeric
    # everywhere else (arith-add and friends), so `add` over strings is itself a new wire shape —
    # an adapter that dispatches `add` straight to SQL `+` produces a numeric addition on
    # PostgreSQL and a silent 0 on MySQL rather than concatenation.
    #
    # Field-first: `eq(V, add(K, V))`. f1's aOptionalString is "prefix:f1"; the five NULL-
    # aOptionalString seeds (a2/a4/a8/c2/e1) are missing-attribute errors and deny.
    - actions: ["id-concat"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aOptionalString == "prefix:" + R.id'

    # Value-first: `eq(K, add(K, V))`. The principal side folds to the constant "projects:f1" at
    # plan time, so the whole comparison is a constant against a concatenation the adapter must
    # build from the key — operand inversion (this repo's canonical bug class) crossed with the
    # key and with string `add` at once. `principal.attr.context` carries the id for this and for
    # hier-list-id below.
    - actions: ["id-concat-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.context == "projects:" + R.id'

    # The key inside a hierarchy path built by `list()`. Two firsts in one shape: `list` is the
    # third operator the corpus has never put on the wire, and it is the only place a hierarchy
    # operand is CONSTRUCTED rather than read from a column. The hier-* block above always hands
    # `hierarchy()` a bare variable or a literal; here the descendant path is `["projects", <key>]`,
    # so an adapter must build the path from a constant segment and the key before it can compare.
    # Oracle {f1}: both sides are two segments, so the inclusive overlap reduces to key equality.
    - actions: ["hier-list-id"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(P.attr.context, ":").overlaps(hierarchy(["projects", R.id]))'

    # -- timestamp(field) vs constant-instant comparisons (ts-*) --
    # Wire shape (PDP-verified): the planner folds now()-duration arithmetic to a constant
    # instant and re-wraps it in timestamp("<RFC-3339>"); both operand orders keep policy
    # source order (both sides are EXPRESSION nodes — no normalization applies), so the
    # value-first form below exercises the adapter's mirroring, not inversion.

    # The retention-cutoff / time-window shape: rows older than 24h. now() is evaluated at
    # PLAN time; the seeds are split firmly before 2026 and after 2036 so the boundary never
    # lands near a seed. a3 has no created_at: timestamp(missing attr) is a CEL error →
    # check() denies, and the SQL comparison over NULL excludes the row — both sides agree.
    - actions: ["ts-window"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'timestamp(R.attr.createdAt) < now() - duration("24h")'

    # Value-first form of the same window: gt(timestamp(constant), timestamp(variable)) on
    # the wire. An inversion bug (translating lt instead of the mirrored gt) flips the
    # entire included set — the oracle catches it on every seed.
    - actions: ["ts-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'now() - duration("24h") > timestamp(R.attr.createdAt)'

    # Instant equality against a literal (a4 is the exact-match witness).
    - actions: ["ts-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'timestamp(R.attr.createdAt) == timestamp("2024-06-01T00:00:00Z")'

    # The same instant expressed at a non-UTC offset: CEL timestamp equality is INSTANT
    # equality (PDP-verified), so a4 must still match — pins the adapter's offset
    # normalization (OffsetDateTime.parse fallback → Instant).
    - actions: ["ts-eq-offset"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'timestamp(R.attr.createdAt) == timestamp("2024-06-01T02:00:00+02:00")'

    # ne: allows every row EXCEPT the equal one — and except a3 (NULL created_at), whose
    # missing attribute errors at check time while SQL three-valued logic excludes it.
    - actions: ["ts-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'timestamp(R.attr.createdAt) != timestamp("2024-06-01T00:00:00Z")'

    # ==================== direct null comparisons ====================
    # The planner has NO existence operator: `R.attr.x != null` arrives as a plain `ne`
    # with a `{"value": null}` operand, never an `isSet`. Verified against the pinned PDP
    # (the wire fixtures below are the record) and structurally guaranteed — the wire
    # operator is the CEL function name, and Cerbos registers no `isSet` function; `has()`
    # is folded away at plan time to ALWAYS_ALLOWED/DENIED and can never reach the wire.
    # Six adapters carried dead `isSet` branches until cerbos/query-plan-adapters#261;
    # these actions pin IS NULL / IS NOT NULL through the eq/ne-null path instead.
    #
    # `owner` (not aOptionalString) is deliberate: it is the explicit-null alias, so the
    # oracle sends `null` rather than omitting the attribute. Under the default
    # missing-attribute convention `== null` would deny every row at check time while the
    # adapter's IS NULL returned five, which probes attribute representation rather than
    # the operator. NULL owners: a2/a4/a8/c2/e1 (5 of 22) — non-degenerate either way.

    - actions: ["null-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner == null'

    - actions: ["null-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner != null'

    # Value-first: the planner preserves source order, so the null lands in operand 0 and
    # the column in operand 1. An adapter that assumes variable-first reads the null as the
    # column and the column as the value — the inversion class of #258/#259.
    - actions: ["vf-null-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'null != R.attr.owner'

    # Negation over IS NULL. Unlike `NOT (col = x)`, `NOT (col IS NULL)` is never UNKNOWN,
    # so this must return every non-null row rather than collapsing to the empty set.
    - actions: ["null-not-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner == null)'

    # ==================== explicit null against a NON-null constant ====================
    # `null-eq`/`null-ne` above compare the explicit-null attribute only AGAINST NULL, where
    # SQL's IS NULL and CEL's null-valued comparison agree. Against a non-null constant they
    # do not: CEL holds a null VALUE under this convention, so `null != "x"` is TRUE and the
    # row is ALLOWED, while `NULL != 'x'` is UNKNOWN in SQL and excludes it. A SQL-backed
    # adapter therefore returns FEWER rows than the PDP permits — safe in direction, but the
    # id sets do not match, which is what this corpus exists to enforce
    # (cerbos/query-plan-adapters#308).
    #
    # `optional-ne` is the only other comparison against a non-null constant and it uses
    # `aOptionalString`, the OMITTED-convention attribute, where UNKNOWN and a
    # missing-attribute error agree. So these two are the only actions that reach the
    # explicit convention's behaviour against a constant.
    #
    # NULL owners a2/a4/a8/c2/e1 are the witnesses; a3's owner IS "x", so the oracle is
    # neither empty nor total under either polarity.
    - actions: ["null-value-ne-const"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner != "x"'

    # The negated-equality spelling. It takes a different branch from `ne`: the planner emits
    # `not(eq(...))` verbatim, so an adapter that fixes only the `ne` leaf still under-grants
    # here. `!(null == "x")` is `!false` = TRUE in CEL; `NOT (NULL = 'x')` stays UNKNOWN.
    - actions: ["null-value-not-eq-const"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner == "x")'

    # Membership without a null ELEMENT, negated. The `in-null-elem-*` probes above all carry a
    # null in the list, which already forces the `IN (...) OR IS NULL` disjunction and makes the
    # predicate definite; a list of plain constants does not, so `NOT (col IN (...))` is UNKNOWN
    # for a NULL column and drops it. CEL compares a null VALUE against each element — false, not
    # an error — so the negation is TRUE. a3 ("x") and b1 ("one_two") are the two matches, so the
    # oracle is 20 of 22 and the naive translation returns 15.
    #
    # This is why the rule is stated over the EQUALITY FAMILY rather than over `ne`: `eq`, `ne`
    # and `in` are the operators CEL evaluates to a definite boolean over a null operand, so they
    # are exactly the ones whose SQL has to be definite. `lt`/`le`/`gt`/`ge` and the string
    # operators raise a no-overload or no-such-member error on a null receiver, which denies under
    # both polarities — the same thing UNKNOWN already does — so they must keep propagating it.
    - actions: ["null-value-not-in-const"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner in ["x", "one_two"])'

    # Column-versus-column, both explicit-null. Two null VALUES are EQUAL in CEL, so the PDP
    # allows the row; `a = b` is UNKNOWN in SQL and excludes it. This is a different render
    # from the constant case: the both-NULL row has to MATCH, which no amount of `OR col IS NULL`
    # on one side expresses. It is deliberately NOT spelled as a null-safe equality operator —
    # see `null-value-f2f-mixed` below, where the rendering has to tell "both sides declared"
    # from "one side declared", and a symmetric operator cannot.
    #
    # `coOwner` is the explicit-null alias of the `scope` column, added for this action.
    # It is NOT a second alias of `aOptionalString`: comparing a column with itself is TRUE
    # for all 22 seeds, and the degeneracy guard forbids a total oracle. Against `scope` the
    # only row where both sides are NULL is e1, and no row holds the same non-null value in
    # both columns, so the oracle is exactly {e1} — one row, but the only row the naive
    # translation loses.
    #
    # `field-to-field` does not reach this: it compares `aString` with `aOptionalString`, and
    # `aOptionalString` is on the OMITTED convention, where UNKNOWN and a missing-attribute
    # error agree.
    - actions: ["null-value-f2f"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner == R.attr.coOwner'

    # The MIXED field-to-field: one side declared explicit-null, the other on the corpus default.
    # This is the shape that punishes a definite rendering applied too eagerly. `scope` is omitted
    # when NULL, so a NULL there is a missing attribute and CEL denies under BOTH polarities —
    # only UNKNOWN reproduces that. An adapter that makes the comparison definite because ONE side
    # is declared turns `owner != scope` into TRUE for e1 (both columns NULL) and returns a row the
    # PDP refuses. That is an OVER-grant, the direction the rest of this group is safe from.
    #
    # Oracle: a7, e1 and f1 are denied (scope missing), no row holds the same value in both
    # columns, so the other 18 are allowed. The definite-everywhere rendering returns 20 — it
    # readmits a7 and f1, whose owner is non-null against a missing scope, while e1's two nulls
    # compare equal and stay out.
    - actions: ["null-value-f2f-mixed"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner != R.attr.scope'

    # The same divergence reached through the value-list macro fold (#295/#301), under a
    # negation. `manyTeams` has eleven elements, so the planner ships the lambda with a
    # literal value-list collection rather than an unrolled or-chain; the fold turns it into a
    # chain of equalities, every one of which is UNKNOWN for a NULL column, so the enclosing
    # NOT excludes the row. CEL compares a null VALUE against each element — false, not an
    # error — so `!exists` is TRUE and the PDP allows it.
    #
    # This is the #315/#316 lesson restated for the null convention: the guard has to live in
    # the shared comparison construction, not in the operators that happen to be looked at.
    # `pv-exists`/`pv-all` do not reach it — they use `aOptionalString`, the omitted-convention
    # attribute, where the NULL rows are missing-attribute errors that deny under both
    # polarities. Allowed: every seed whose owner matches no element — a1/a6/a9/b2 match
    # ("set"/""/"same"/"%_o") and are denied, so the oracle is 18 of 22 and the naive fold
    # returns 13.
    - actions: ["null-value-pv-not-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!P.attr.manyTeams.exists(t, R.attr.owner == t)'

    # The SAME shape against `aOptionalString`, which follows the corpus DEFAULT convention:
    # a NULL column sends NO attribute at all. CEL then raises a missing-attribute error for
    # every NULL row, and `"set" == null` is false for every non-NULL row, so check() denies
    # ALL 22 seeds. The planner emits the identical `eq(a_optional_string, null)` wire node as
    # `null-eq` — the two are indistinguishable on the wire, which is exactly the point: the
    # adapter cannot recover the caller's representation from the plan.
    #
    # Rendering this as IS NULL returns the five NULL-column rows the PDP denies (#302), so
    # under `nullAttributeRepresentation: "omitted"` every adapter must reject it instead.
    # `actions.json` lists it in `nullRepresentationOmitted`: harnesses translate this action
    # with the option set to "omitted" and assert the throw. Do not add it to `conformance`;
    # a throwing action has no filter to compare against the oracle.
    - actions: ["null-eq-missing"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aOptionalString == null'

    # ==================== in-lists containing null ====================
    # `R.attr.owner in [..., null]` compiles and the planner emits the null element
    # VERBATIM in the value list; check() ALLOWS an explicitly-null attribute (CEL
    # `null in [..., null]` is true). `owner` maps to the a_optional_string column, and —
    # unlike aOptionalString — the oracle sends an EXPLICIT null attribute for NULL columns,
    # matching the adapter's eq-null → IS NULL convention (the planner itself folds
    # `x in [null]` to `eq(x, null)`). The null element must become an IS NULL disjunct:
    # `IN (nonNulls) OR IS NULL`; a raw `IN (..., NULL)` silently excludes null rows and
    # makes the negation UNKNOWN everywhere.

    # Mixed list: matching ("x" → a3, "one_two" → b1), null (a2/a4/a8/c2), non-matching rest.
    - actions: ["in-null-elem-mixed"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner in ["x", "one_two", null]'

    # Negation: three-valued trap — over `IN (..., NULL)` the negation returned NOTHING.
    - actions: ["in-null-elem-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner in ["x", "one_two", null])'

    # Degenerate all-null list: the planner folds this to eq(owner, null) → pure IS NULL.
    - actions: ["in-null-elem-only"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner in [null]'

    - actions: ["in-null-elem-only-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner in [null])'

    # Relation variant: `null in collection` is true iff the collection holds a null
    # element (tagNames projects tags.name; b5/b6 hold NULL-name tags and the oracle sends
    # those as explicit null list elements) → EXISTS(member IS NULL).
    - actions: ["in-null-elem-rel"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'null in R.attr.tagNames'

    # Negation: rows with no null member — including EMPTY collections (`null in []` is
    # false, so the negation allows them).
    - actions: ["in-null-elem-rel-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(null in R.attr.tagNames)'

    # hasIntersection with a null element behaves like `in` (PDP-verified: allows
    # tagNames=[null]): the null element intersects collections holding a null member,
    # so the shared EXISTS translation gains the same IS NULL disjunct. b5/b6 (NULL-name
    # tags) plus the "public"-tagged rows must come back.
    - actions: ["in-null-elem-hasint"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.tagNames, ["public", null])'

    # ==================== in(variable, variable) ====================
    # Attribute-in-attribute membership: the planner emits in(variable, variable) VERBATIM,
    # member first (PDP-verified). `owner` is the explicit-null scalar convention and
    # `tagNames` projects tags.name with NULL names as explicit null elements, so the seeds
    # exercise every check()-verified branch: match (a9/b4 "same"/"mirror"), no match, empty
    # collection (`x in []` is false — negation allows), null scalar vs null element
    # (e1: `null in [null]` is TRUE), and null scalar without a null element (a4/a8:
    # false — negation allows).
    - actions: ["in-var-var"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner in R.attr.tagNames'

    - actions: ["in-var-var-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner in R.attr.tagNames)'

    # ==================== depth-3 nested collection macros ====================
    # Three macro levels (categories → subCategories → labels). Pins that the single-
    # subquery-per-polarity macro translation preserves tri-state semantics through deep
    # nesting: a1 is the true witness (label "gold"), a6 is the error witness (a label with
    # NO name — the inner lambda errors, no true sibling absorbs it, and the error must
    # propagate up through BOTH outer exists levels → deny), a8 has labels but no "gold"
    # (determined false), c1 is the case witness ("Gold" ≠ "gold": check() denies; a
    # case-insensitive DB collation would over-include it), and rows without categories are
    # exists-over-empty → false.
    - actions: ["macro-depth3-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.categories.exists(c, c.subCategories.exists(s, s.labels.exists(l, l.name == "gold")))'

    # The negation: rows where the depth-3 exists is determined-FALSE must be ALLOWED, while
    # the a6 error stays an error under NOT (deny) — the leak the tri-state machinery exists
    # to prevent (NOT(UNKNOWN) must stay UNKNOWN, never flip to TRUE).
    - actions: ["macro-depth3-not-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.categories.exists(c, c.subCategories.exists(s, s.labels.exists(l, l.name == "gold")))'

    # all at the middle level: a6's erroring label makes the inner exists error, all() has no
    # false witness to absorb it → error → deny; a8's labels hold no "gold", so its inner
    # exists is determined-false → all() false; a1 is the true witness.
    - actions: ["macro-depth3-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.categories.exists(c, c.subCategories.all(s, s.labels.exists(l, l.name == "gold")))'

    # -- collection macros over a KNOWN (principal) collection: the planner unroll cliff --
    #
    # P.attr.* is folded to a known value at plan time, so the planner unrolls exists/all over
    # it into an or/and chain at <= 10 elements and ships the lambda with a literal value-list
    # collection above that (maxItems = 10 in its struct matcher; cerbos/cerbos#2570 for exists,
    # #2817 for all). `manyTeams` holds ELEVEN elements precisely so these two actions exercise
    # the value-list shape — an adapter that only handles the unrolled chain has a
    # data-dependent cliff, working for a principal with 10 teams and failing at 11.
    #
    # The lambda body compares `aOptionalString`, which is NULL for a2/a4/a8/c2/e1: those rows
    # are missing-attribute errors that must deny under BOTH polarities, so the fold cannot be
    # implemented as a plain IN/NOT IN. 'set' matches a1 but 'Set' (c1) must not — the case
    # witness; '' matches a6 (empty string); '%_o' matches b2 as an equality operand, not a
    # LIKE pattern.
    - actions: ["pv-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: P.attr.manyTeams.exists(t, R.attr.aOptionalString == t)

    # The all() dual. Determined-true only for rows whose aOptionalString is present and matches
    # no element; the NULL rows error on the first comparison and stay denied, which is what
    # separates a correct fold from a NOT IN that silently admits NULLs.
    - actions: ["pv-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: P.attr.manyTeams.all(t, R.attr.aOptionalString != t)

    # ==================== root position and bare operand forms ====================
    #
    # Not hazard classes. These are POSITIONS and operand forms the corpus happens never to
    # produce, found by set-differencing wire-fixture node shapes — `operator(child,child)` with
    # immediate child labels in source order — rather than by reasoning about what could go
    # wrong. Every one is expected to translate everywhere, and the value is closing the hole
    # rather than catching a live bug: a shape nothing plans is a shape no adapter is proved
    # against, and "obviously supported" is not evidence.
    #
    # Each is spelled against a LOCAL scalar column on purpose. The relation block above reaches
    # several of these node shapes — `gt(V,K)` via rel-gt-hop, `le(V,K)` via rel-le-hop, a bare
    # root variable via rel-bool-hop, `or(...)` at the root via rel-hop2-or-exists — but only
    # ever through the join machinery, which is a different walk and, for the adapters that
    # refuse a hop, no walk at all.

    # `not` over a BARE ordering. The corpus negates plenty of orderings, but every one of them
    # wraps a size() or a ternary (w1-not-size-chain, ternary-negated, p-not-ternary-null), so
    # the operand a store can actually index is never the thing under the negation. `not(lt)`
    # is absent from the corpus outright; `not(gt)` exists only over those wrapped operands.
    #
    # The pair partitions the 22 seeds exactly — oracle a1/a3/a6/a8/a9/b1/b2/b4/b5/b6/c1/c2/
    # d1/d2/e1/f1/g1 (17) and a2/a4/a5/a7/b3 (5) — because aNumber is never NULL, so there is no
    # third answer and a row missing from both sets is an adapter dropping rows. Dropping the
    # negation is the failure this catches: it swaps the two oracles outright.
    #
    # `not-lt` shares its oracle with `gt-bare` below, since no seed's aNumber falls strictly
    # between 1 and 2 and `>= 2` and `> 1` therefore select the same rows. That is an
    # equivalence, not a blind spot — the two spellings ARE the same predicate on this data, and
    # separating them would need a fractional seed this ticket deliberately does not add.
    - actions: ["not-lt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aNumber < 2)'

    - actions: ["not-gt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aNumber > 1)'

    # Bare `gt` and `le` on a local column. `lt`, `ge`, `eq` and `ne` in this position all exist
    # in the corpus (neg-number, double-threshold, cs-eq, optional-ne); these two do not, purely
    # by accident of construction. The thresholds are chosen so the two oracles are NOT
    # complements — `> 1` gives 16 rows, `<= 2` gives 7, and they overlap on a3/a8 (aNumber 2) —
    # so an adapter that confused the two operators cannot land on the other action's answer.
    - actions: ["gt-bare"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber > 1'

    - actions: ["le-bare"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber <= 2'

    # The ROOT of the condition is a bare boolean column — no comparison to unwrap, no operator
    # to dispatch on. The corpus reaches this only through a hop (rel-bool-hop), and reaches a
    # local `aBool` only as an `and` child (nary-and) or under a negation (double-negation).
    # Root is a position adapters special-case: it is where a filter object is created rather
    # than composed, and where a walker that assumes an operator node has nothing to read — the
    # condition here is a bare `{"variable": ...}` with no `expression` wrapper at all.
    # Oracle is the 14 aBool-TRUE rows.
    - actions: ["root-bare-bool"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBool'

    # The root is a DISJUNCTION. Everything else in the corpus roots at a conjunction, a single
    # comparison, or a negation; the one root-level `or` (rel-hop2-or-exists) is a two-level hop
    # the join-less adapters never translate.
    #
    # The second disjunct is `aNumber < 0` and NOT the `aString != "one"` this action was
    # specified with, because that spelling is TOTAL: `aString` is never NULL and only a1 holds
    # "one", and a1's aBool is true, so every one of the 22 seeds is allowed and the comparison
    # passes vacuously against any filter whatsoever. `< 0` instead admits two aBool-FALSE rows
    # (a2, a5) and denies five others, so dropping either disjunct changes the answer.
    - actions: ["root-or"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          any:
            of:
              - expr: R.attr.aBool
              - expr: R.attr.aNumber < 0

    # A subquery-producing operator DISJOINED with a scalar predicate. The corpus composes
    # exists/in under `and` freely, but for an adapter that builds a correlated subquery,
    # disjoining one is a different composition path from conjoining it — a subquery emitted as
    # a row-restricting inner join is correct under `and` and drops rows under `or`.
    #
    # b6 is the witness that makes both non-trivial: its aBool is FALSE and its tags are
    # [NULL-name, "public"], so the right branch has to absorb the NULL element and answer TRUE
    # on its own. a5 is the plain aBool-FALSE-but-tagged witness. The five denied rows are the
    # other side: a2/b2/c2/d2 carry no tags at all and b4's only tag is "mirror". Oracle
    # a1/a3/a4/a5/a6/a7/a8/a9/b1/b3/b5/b6/c1/d1/e1/f1 (16) — an adapter that collapsed the
    # disjunction to its left operand returns 14 and loses exactly a5 and b6.
    - actions: ["or-eq-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          any:
            of:
              - expr: R.attr.aBool
              - expr: R.attr.tags.exists(t, t.name == "public")

    # The membership spelling of the same composition. `in` over a relation column plans to a
    # different operator than `exists` over a lambda — `in(K,V)`, value-first, against the
    # derived tagNames column — and the two take different paths in every adapter that models
    # collections, so covering one does not cover the other. Same oracle as or-eq-exists by
    # construction: the two predicates select the same rows, and only the wire shape differs.
    - actions: ["or-eq-in"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          any:
            of:
              - expr: R.attr.aBool
              - expr: '"public" in R.attr.tagNames'

    # ==================== hazard classes the corpus missed ====================
    #
    # Unlike the block above, these are not accidental holes in the shapes the corpus happens to
    # plan. Each one pins a HAZARD — a place where CEL and a store's query language are known to
    # disagree, or where this repository has already shipped the same bug to several adapters —
    # that no existing action reaches. They were found the same way (set-differencing the node
    # shapes the wire fixtures produce against the shapes the corpus's policies can reach), but
    # they are kept for the argument, not for the coverage arithmetic (#387).

    # De Morgan: `not` over a CONJUNCTION. The corpus negates eq, ne, in, exists, exists_one,
    # all, gt, lt, hasIntersection and or — never `and`. Its one not-over-or is buried five
    # levels down inside p-deep-nest, where an adapter that mishandles the branch fails for a
    # dozen other reasons first. An adapter lowering this to `NOT (a AND b)` is correct; one
    # distributing it as `NOT a AND NOT b` is not, and nothing here would have caught that.
    #
    # This is also, byte for byte, the shape a DENY rule composes to — the deleted shared
    # suite's `nand` planned to exactly this node — so the corpus covers the DENY composition
    # path without carrying a second policy that is almost entirely EFFECT_ALLOW.
    #
    # a1 is the row that separates the two lowerings: aBool is TRUE and aString IS "one", so it
    # is allowed only because the SECOND conjunct fails. Distributing the negation drops it.
    # Oracle a1/a2/a5/b2/b4/b6/c2/d2 — a1 plus the seven aBool-FALSE rows.
    - actions: ["not-and"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aBool && R.attr.aString != "one")'

    # NEGATED string matching against a COLUMN needle. The corpus matches LIKE patterns in every
    # metacharacter-hostile spelling it has (like-percent, like-underscore, f2f-contains and
    # friends) and negates plenty of other operators, but it never negates a LIKE — and NOT LIKE
    # is exactly where the two hazards meet:
    #
    #   * three-valued logic. `NOT (col LIKE pattern)` is UNKNOWN, not TRUE, when the pattern is
    #     NULL, so a2/a4/a8/c2/e1 must stay excluded. An adapter that renders the negation as
    #     `NOT LIKE` without a null guard leaks all five, which is an over-grant of rows the PDP
    #     denies as missing-attribute errors.
    #   * metacharacter escaping, in the direction that UNDER-grants. An unescaped needle makes
    #     the positive match too permissive, so the negation excludes rows it should return:
    #     b1's needle `one_two` would match `oneXtwo` through an unescaped `_`, and b2's `%_o`
    #     matches `50%_off` through either metacharacter. Both drop out of the oracle if the
    #     escape is missing — a silent under-grant, which no positive LIKE action can see,
    #     because there the same bug shows up as a row wrongly INCLUDED.
    #
    # The needle is a COLUMN, not a constant, on purpose: a constant needle is never NULL, so
    # the first hazard is unreachable with one.
    #
    # not-contains oracle a1/a7/b1/b5/b6/c1/d2/f1; not-startswith is deliberately a different
    # partition (a3/a5/b2/b3 join it, d1 leaves) so a translator that confuses the two operators
    # cannot land on the other's answer.
    - actions: ["not-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.aString.contains(R.attr.aOptionalString)'

    - actions: ["not-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.aString.startsWith(R.attr.aOptionalString)'

    # Modulo. `mod` is one of the three operators that never reach the wire from this corpus
    # (with `list` and, until #391, `string`), so no adapter is proved to translate it at all.
    #
    # The comparison is `== 1`, NOT the `== 0` this action was specified with. `x % 2 == 0` is
    # sign-INVARIANT: truncated modulo (CEL, Go, SQL, JavaScript) and floored modulo (Python)
    # give -1 and 1 respectively for a5's -5, and neither is 0, so the very disagreement the
    # action exists to pin cannot change its answer. `== 1` makes a5 the witness — CEL denies
    # it, a floored lowering allows it — and the failure direction is an OVER-grant.
    #
    # That witness is LATENT today, and worth saying so: every adapter but convex refuses this shape at the
    # int() cast, and convex answers it in JavaScript, whose `%` truncates exactly as
    # CEL does. So what the action pins right now is that `mod` reaches the wire at all — it never
    # had — and that every rejection is the cast's rather than the operator's. The sign witness is
    # what catches the first adapter to lower `%` into a floored language.
    #
    # int() is required: aNumber arrives as a CEL double and `%` has no double overload.
    # Oracle a1/a4/a6/b1/b5/c1/d1/e1, the odd POSITIVES.
    - actions: ["arith-mod"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'int(R.attr.aNumber) % 2 == 1'

    # Indexing a SCALAR list. p-index indexes a relation and then projects a field from the
    # element (`get-field(index(V,K),V)`); this indexes the derived tagNames column directly, so
    # the wire node is a bare `index(V,K)` in an operand position and the walk is a different
    # one. Row order in a SQL relation is not defined, so most adapters must refuse it — and
    # none is currently asked to, because p-index's rejection is reached through the projection.
    #
    # b6 is the row that makes the difference visible: tagNames is [null, "public"], so
    # `[0] == "public"` is not satisfied while "some element equals public" is. An adapter that
    # quietly rewrites an index into an ANY-element predicate returns it. Rows with no tags at
    # all (a2/b1/b2/b3/c2/d1/d2/f1) index out of range, which is an evaluation error and denies.
    # Oracle a1/a3/a5/a6/a8.
    - actions: ["index-scalar-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames[0] == "public"'

    # Negation must preserve out-of-range indexing errors; a valid null element is a value.
    - actions: ["index-scalar-list-not-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.tagNames[0] == "public")'

    # Explicit null in the first position is distinct from an absent first position.
    - actions: ["index-scalar-list-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames[0] == null'

    # List EQUALITY. The corpus feeds map() into hasIntersection or leaves it bare as a
    # non-boolean condition; it never compares the projection to anything. Equality over a list
    # is ordered and exact — a3's two tags project to ["t3a","t3b"] in that order and nothing
    # else in the corpus does — so an adapter treating it as set containment, or as an
    # element-wise IN, agrees on a3 and disagrees nowhere, which is why the single witness is
    # enough only in combination with the rejection most adapters will produce.
    # b5/b6 carry NULL tag NAMES but non-null ids, so the projection itself never errors here.
    - actions: ["map-eq-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.map(t, t.id) == ["t3a", "t3b"]'

    # -- value-first, the three the family was missing --
    #
    # Operand inversion is this repository's canonical bug class (#258, #259): the planner
    # preserves source order, so a constant on the left arrives as `lt(K,V)` and an adapter that
    # reads operands positionally emits the MIRRORED predicate. The existing vf-* actions cover
    # le, ge, ne, null, arithmetic and ternary; lt, size-under-an-ordering and hasIntersection
    # were never spelled value-first.
    #
    # vf-lt shares its oracle with gt-bare and not-lt — all three ARE `aNumber > 1` on this data.
    # That is the point rather than a redundancy: an inversion turns this one into `aNumber < 1`,
    # which selects a2/a4/a5/a7/b3 and overlaps the correct answer nowhere.
    - actions: ["vf-lt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '1 < R.attr.aNumber'

    # size() on the RIGHT of an ordering. The corpus's size actions all put the count on the
    # left, so an adapter that special-cases "count on the left" — several build the subquery
    # from the operand they walk first — has never met the mirrored form. Oracle: the 13 rows
    # with at least one tag.
    - actions: ["vf-size"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '0 < size(R.attr.tags)'

    # hasIntersection with the CONSTANT list first. Unlike the orderings, hasIntersection is
    # commutative, so an inversion here is invisible in the answer — what it breaks is the
    # translation, because the two operands are not interchangeable in the emitted query: one
    # side is a column the store can index and the other is a parameter list. An adapter that
    # assumes the collection is always operand 0 either throws or builds nonsense.
    # "other" is in the list so a7 joins the oracle; c1's "Public" must not match.
    # Oracle a1/a3/a5/a6/a7/a8/b6.
    - actions: ["vf-hasint"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(["public", "other"], R.attr.tagNames)'

    # -- the OTHER side of the planner's unroll cliff --
    #
    # pv-exists/pv-all above use `manyTeams`, whose eleventh element exists precisely to force
    # the value-list wire shape. That means the corpus only ever plans the ABOVE-cliff form, and
    # the unrolled or/and chain the planner emits at <= 10 elements — the shape most real
    # principals actually produce, since a principal with three teams is far commoner than one
    # with eleven — is planned by nothing in this repository.
    #
    # `fewTeams` is the same witness set at three elements: 'set' matches a1, '' matches a6,
    # '%_o' matches b2 as an equality operand rather than a LIKE pattern, and c1's 'Set' is the
    # case trap. a9's 'same' is deliberately NOT in fewTeams, so these two actions do not share
    # an oracle with their manyTeams counterparts and a harness cannot pass one by answering the
    # other. The NULL-aOptionalString rows (a2/a4/a8/c2/e1) are missing-attribute errors that
    # must deny under BOTH polarities, exactly as above — a NOT IN admitting them is the failure.
    # Oracles: exists a1/a6/b2, all everything else with a present aOptionalString.
    - actions: ["pv-exists-unrolled"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: P.attr.fewTeams.exists(t, R.attr.aOptionalString == t)

    - actions: ["pv-all-unrolled"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: P.attr.fewTeams.all(t, R.attr.aOptionalString != t)

    # filter() in a CONJUNCT rather than at the root. filter-as-condition pins the rejection at
    # the root of the condition, which is the position an adapter checks explicitly; an adapter
    # can reject there and still walk a filter() sitting one level down, where the recursion
    # dispatches on the operator and a lambda node reaches whatever the default branch does.
    #
    # The oracle is EMPTY BY CONSTRUCTION, like filter-as-condition: `filter()` returns a list,
    # so check() cannot evaluate the conjunction and denies all 22 seeds. It therefore stays out
    # of both degeneracy-guard lists, and its anti-vacuity assertion has to pin WHY the rejection
    # is required rather than that one happens — see README, "The degeneracy guard".
    #
    # The second conjunct is a bare boolean the adapter certainly CAN express, which is what
    # makes the action discriminate: an adapter that drops the untranslatable conjunct instead of
    # refusing emits `aBool` alone and returns 14 rows the PDP denies.
    - actions: ["filter-as-conjunct"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.tags.filter(t, t.name == "public")
              - expr: R.attr.aBool

    # ==================== shapes an Elasticsearch audit found unguarded ====================
    # Each of these is policy-reachable, translated by more than one adapter, and until now
    # discriminated by nothing in the corpus: an adapter could emit a wrong filter for it and
    # every harness stayed green. They were found by auditing one adapter and are added here
    # rather than pinned there, so every other adapter is asked the same question.

    # size(string) as an EMPTINESS check. string-size and the size-huge-* pair compare a string's
    # length against a threshold; none of them uses the `> 0` spelling, which is exactly the one
    # an adapter's collection-emptiness fast path (`size(x) > 0` → "the array is non-empty")
    # is keyed on. A translator that dispatches on the threshold before looking at the operand
    # emits an exists/non-empty-array query over a STRING field: a8's aString is "" and is the
    # one row check() denies, so an adapter answering "the field exists" returns it, and one
    # answering "the field is a non-empty array" returns nothing. Oracle: every seed but a8.
    - actions: ["string-size-gt0"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.aString) > 0'

    # Membership in a MAP literal. CEL's `in` over a map tests the KEYS, and the planner folds
    # the literal to its key list before it reaches the wire — the fixture carries
    # `in(aString, ["one", "same"])`, indistinguishable from a list literal. That fold is the
    # contract this action pins: a planner that shipped the map verbatim would change the
    # fixture, and an adapter given the struct would have to refuse it rather than compare
    # against its values. The values are chosen not to be strings so a translator that did see
    # them could not match on them by accident. Oracle: a1 ("one") and a9 ("same") — c1's
    # "One" is the case trap.
    - actions: ["in-map-keys"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString in {"one": 1, "same": 2}'

    # A double literal outside the int64 range on a double field. `-10000000000000000000` as an
    # INTEGER literal does not compile (CEL: "invalid int literal"), so `-1e19` is the only
    # spelling a policy can reach, and it arrives on the wire as a plain number. An adapter that
    # narrows a numeric constant through a 64-bit integer — `Number.longValue()`, `int64(v)`,
    # a `parseInt` — saturates it to Long.MIN_VALUE (-9223372036854775808), and no seed used to
    # sit between the two: every existing aDouble is within ±20, on the same side of both
    # thresholds. g1's aDouble is -9.5e18, chosen INSIDE the gap (-1e19 < -9.5e18 < -2^63) and
    # exactly representable as a double. The oracle is EMPTY BY CONSTRUCTION — no seed is below
    # -1e19 — so this action stays out of both degeneracy-guard lists; what it discriminates is
    # the narrowed filter `aDouble < -9223372036854775808`, which returns g1 while check()
    # denies every row. See README, "The degeneracy guard".
    - actions: ["double-huge-lt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aDouble < -1e19'

    # The mirror arm, with a NON-degenerate oracle: every seed with a present aDouble is above
    # -1e19 (a3's is NULL and is a missing-attribute deny), so this one belongs in the guard
    # proper. The same saturation turns it into `aDouble > -9223372036854775808`, which DROPS g1
    # — the under-grant direction of the narrowing double-huge-lt catches as an over-grant.
    - actions: ["double-huge-gt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aDouble > -1e19'

    # An anchored regex with a TOP-LEVEL alternation. RE2 (CEL's dialect) parses `^o|e$` as
    # two alternatives, `^o` OR `e$`, each carrying its own anchor; an adapter that lowers a
    # leading `^` to a prefix query, or that wraps the pattern as `^(...)$` for an engine whose
    # matching is implicitly anchored (Lucene), reads it as `^(o|e)$` and matches only a
    # one-character string — nothing in the corpus. p-matches uses `^h`, which every one of
    # those lowerings gets right. Both alternatives are exercised: `^o` admits a1 ("one") and
    # b1 ("oneXtwo"); `e$` admits a2 ("100%_done"), a3 ("100xdone"), a9 ("same") and c1 ("One"
    # — the case trap, matched by its tail and NOT by its head). Oracle a1/a2/a3/a9/b1/c1.
    - actions: ["matches-alt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^o|e$")'

    # A hierarchy with an EMPTY delimiter, which the PDP accepts: Cerbos splits the path on ""
    # and gets one segment per CHARACTER, so descendentOf becomes a strict STRING-prefix test.
    # Two wrong lowerings are visible from the same constant. An adapter that substitutes its
    # default "." for an empty delimiter emits `scope LIKE 'dept.eng.%'` and drops a5
    # ("dept.engineering" — a string descendant, not a path one). An adapter that concatenates
    # `prefix + delimiter + '%'` emits `scope LIKE 'dept.eng%'`, which also matches a2
    # ("dept.eng" itself, never its own descendant). Oracle a3/a4/a5/b5/c2 — every scope that
    # STARTS WITH "dept.eng" and is longer than it; c1's "Dept.Eng" is the case trap.
    - actions: ["hier-empty-delim"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope, "").descendentOf(hierarchy("dept.eng", ""))'

    # -- Issue #414: migrated corpus gaps and hostile follow-up probes --

    # h1 matches literal wildcard characters; h2/h3 are wildcard near misses.
    - actions: ["wildcard-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.contains("*?b")'

    # h1 matches literal wildcard characters; h2/h3 are wildcard near misses.
    - actions: ["wildcard-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.endsWith("*?b")'

    # Exercise RE2 syntax or matching semantics beyond a literal prefix; h2 carries a newline.
    - actions: ["regex-digit"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("\\d")'

    # Exercise RE2 syntax or matching semantics beyond a literal prefix; h2 carries a newline.
    - actions: ["regex-case"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("(?i)^one$")'

    # Exercise RE2 syntax or matching semantics beyond a literal prefix; h2 carries a newline.
    - actions: ["regex-posix"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("[[:digit:]]")'

    # Exercise RE2 syntax or matching semantics beyond a literal prefix; h2 carries a newline.
    - actions: ["regex-unanchored"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("ne")'

    # Exercise RE2 syntax or matching semantics beyond a literal prefix; h2 carries a newline.
    - actions: ["regex-dot"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^a.*b$")'

    # Exercise RE2 syntax or matching semantics beyond a literal prefix; h2 carries a newline.
    - actions: ["regex-alternation"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^a|b$")'

    # Exercise RE2 syntax or matching semantics beyond a literal prefix; h2 carries a newline.
    - actions: ["regex-grouped"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^(ab|b)$")'

    # Exercise RE2 syntax or matching semantics beyond a literal prefix; h2 carries a newline.
    - actions: ["regex-brace"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^a{q}[*][?]b$")'

    # Exercise RE2 syntax or matching semantics beyond a literal prefix; h2 carries a newline.
    - actions: ["regex-repetition"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^(ab){1,2}$")'

    # Exercise RE2 syntax or matching semantics beyond a literal prefix; h2 carries a newline.
    - actions: ["regex-optional-operators"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^[ab@#&~<>]+$")'

    # Exercise the real two-list function, preserving its arrival position in the planner tree.
    - actions: ["except-root"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames.except(["public"])'

    # Exercise the real two-list function, preserving its arrival position in the planner tree.
    - actions: ["except-size"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.tagNames.except(["public"])) > 0'

    # Exercise the real two-list function, preserving its arrival position in the planner tree.
    - actions: ["except-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames.except(["public"]) == ["private"]'

    # Non-empty collection spelling absent from the previous corpus.
    - actions: ["size-ge-one"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.tags) >= 1'

    # Numeric membership binds exact integral values rather than strings.
    - actions: ["in-numbers"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber in [2, 3, 5]'

    # Pinned empty principal collection proves CEL macro identity and planner folding.
    - actions: ["pv-empty-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(P.attr.emptyTeams.exists(t, t == R.attr.aOptionalString))'

    # Pinned empty principal collection proves CEL macro identity and planner folding.
    - actions: ["pv-empty-not-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(P.attr.emptyTeams.exists(t, t == R.attr.aOptionalString))'

    # Pinned empty principal collection proves CEL macro identity and planner folding.
    - actions: ["pv-empty-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(P.attr.emptyTeams.all(t, t == R.attr.aOptionalString))'

    # Pinned empty principal collection proves CEL macro identity and planner folding.
    - actions: ["pv-empty-not-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(P.attr.emptyTeams.all(t, t == R.attr.aOptionalString))'

    # Eleven principal structs force a value-list lambda; projected members include null or missing variants.
    - actions: ["pv-structs"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.manyStructs.exists(t, t.name == R.attr.aOptionalString)'

    # Eleven principal structs force a value-list lambda; projected members include null or missing variants.
    - actions: ["pv-structs-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.nullableStructs.exists(t, t.name == R.attr.aOptionalString)'

    # Eleven principal structs force a value-list lambda; projected members include null or missing variants.
    - actions: ["pv-structs-missing"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.missingStructs.exists(t, t.name == R.attr.aOptionalString)'

    # Inner lambda rebinds t and must shadow the outer principal-list substitution.
    - actions: ["pv-shadow"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.manyTeams.exists(t, R.attr.tags.exists(t, t.name == "public"))'

    # Negated principal-value macro must retain omitted optional-attribute errors.
    - actions: ["pv-not-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(P.attr.manyTeams.exists(t, t == R.attr.aOptionalString))'

    # Negated principal-value macro must retain omitted optional-attribute errors.
    - actions: ["pv-not-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(P.attr.manyTeams.all(t, t == R.attr.aOptionalString))'

    # Unfoldable principal-list macro must translate correctly or refuse its real wire shape.
    - actions: ["pv-exists-one"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.manyTeams.exists_one(t, t == R.attr.aOptionalString)'

    # Unfoldable principal-list macro must translate correctly or refuse its real wire shape.
    - actions: ["pv-filter"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(P.attr.manyTeams.filter(t, t == R.attr.aOptionalString)) > 0'

    # Two-list difference with a principal-list receiver retains the resource-dependent list.
    # a1 ("set") and b2 ("%_o") shrink it; c1 ("Set") does not, and a2
    # omits the attribute so evaluation denies rather than treating it as an empty list.
    - actions: ["pv-except"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(P.attr.manyTeams.except([R.attr.aOptionalString])) < size(P.attr.manyTeams)'

    # Unfoldable principal-list macro must translate correctly or refuse its real wire shape.
    - actions: ["pv-map"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aOptionalString in P.attr.manyTeams.map(t, t + R.attr.aString)'

    # Negation at root preserves a bare resource boolean.
    - actions: ["root-not-bool"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.aBool'

    # Literal value-list fold inside a resource lambda must preserve lambda scope.
    - actions: ["lambda-in-literal"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.tagNames.exists(tagName, tagName in ["public", "other"]))'

    # Literal value-list fold inside a resource lambda must preserve lambda scope.
    - actions: ["lambda-in-literal-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.tagNames.exists(tagName, tagName in ["public", "other"]))'

    # Ternary is the lambda body rather than a comparison operand.
    - actions: ["lambda-ternary"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, t.name == "public" ? R.attr.aBool : !R.attr.aBool)'

    # Heterogeneous operands deny in CEL; SQL implicit coercion must not over-grant.
    - actions: ["type-string-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == P.attr.zero'

    # Heterogeneous operands deny in CEL; SQL implicit coercion must not over-grant.
    - actions: ["type-number-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber == P.attr.context'

    # Heterogeneous operands deny in CEL; SQL implicit coercion must not over-grant.
    - actions: ["type-columns"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == R.attr.aNumber'

    # Heterogeneous operands deny in CEL; SQL implicit coercion must not over-grant.
    - actions: ["type-size-bool"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.aBool) > 0'

    # Heterogeneous operands deny in CEL; SQL implicit coercion must not over-grant.
    - actions: ["type-size-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.aNumber) > 0'

    # Heterogeneous operands deny in CEL; SQL implicit coercion must not over-grant.
    - actions: ["type-hierarchy-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.aNumber).descendentOf(hierarchy("1.2"))'

    # Non-string receiver must not be coerced to text by the datastore.
    - actions: ["type-number-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber.contains("2")'

    # Non-string needle must not be coerced to text by the datastore.
    - actions: ["type-needle-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.contains(R.attr.aNumber)'

    # Non-string receiver must not be coerced to text by the datastore.
    - actions: ["type-number-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber.startsWith("2")'

    # Non-string needle must not be coerced to text by the datastore.
    - actions: ["type-needle-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.startsWith(R.attr.aNumber)'

    # Non-string receiver must not be coerced to text by the datastore.
    - actions: ["type-number-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber.endsWith("2")'

    # Non-string needle must not be coerced to text by the datastore.
    - actions: ["type-needle-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.endsWith(R.attr.aNumber)'

    # Omitted optional scalar differs from explicitly-null owner under variable membership.
    - actions: ["in-var-var-omitted"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aOptionalString in R.attr.tagNames)'

    # Omitted optional scalar differs from explicitly-null owner under variable membership.
    - actions: ["in-var-var-omitted-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aOptionalString in R.attr.tagNames)'

    # Issue #414 follow-up: preserve runtime type, missing-attribute or unordered-number semantics through composition.
    - actions: ["not-concat-unsolvable"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aOptionalString + "!") == "nope")'

    # Issue #414 follow-up: preserve runtime type, missing-attribute or unordered-number semantics through composition.
    - actions: ["not-concat-unsolvable-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aOptionalString + "!") != "nope"'

    # Issue #414 follow-up: preserve runtime type, missing-attribute or unordered-number semantics through composition.
    - actions: ["hier-overlaps-list-prefix"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy("dept", ".").overlaps(hierarchy(["dept", R.attr.scope]))'

    # Issue #414 follow-up: preserve runtime type, missing-attribute or unordered-number semantics through composition.
    - actions: ["not-hasint-empty-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!hasIntersection(R.attr.mainCategory.subNames, P.attr.emptyTeams)'

    # Issue #414 follow-up: preserve runtime type, missing-attribute or unordered-number semantics through composition.
    - actions: ["div-by-division"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / (R.attr.aDouble / R.attr.aNumber) > 0'

    # Issue #414 follow-up: preserve runtime type, missing-attribute or unordered-number semantics through composition.
    - actions: ["temporal-raw-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.createdAt == R.attr.updatedAt'

    # CEL 0.30 makes unordered comparisons false rather than errors. Under negation
    # the NaN arm allows; the finite arm (1 <= 2) denies, keeping this probe non-total.
    # now() == now() preserves the arithmetic subtree as explained above.
    - actions: ["not-nan-ord-le"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aBool ? 1.0/1.0 : 1.0/2.0) <= (R.attr.aBool ? 2.0 : 0.0/0.0)) && now() == now()'

    # In CEL 0.30, NaN ordering is false even against a present string, whereas the
    # finite-number/string arm remains a type error. Negation allows only the NaN arm.
    - actions: ["not-nan-order-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aBool ? 1.0 : 0.0/0.0) < R.attr.aString) && now() == now()'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["hasint-null-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(["public", null], R.attr.tagNames)'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["hasint-map-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(["public", "other"], R.attr.tags.map(t, t.name))'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["hasint-map-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.tags.map(t, t.name), ["public", null])'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["hasint-map-null-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(["public", null], R.attr.tags.map(t, t.name))'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["eq-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames == ["public"]'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["ne-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames != ["public"]'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["eq-map"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == {"a": 1}'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["ne-map"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString != {"a": 1}'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["eq-map-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == {"a": null}'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["in-nested-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString in [["one"], ["same"]]'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["in-list-element"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '["public"] in R.attr.tagNames'

    # Port real non-scalar literal and symmetric intersection arrival shapes from Java gap tests.
    - actions: ["hasint-map-element"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.tagNames, [{"a": 1}])'

    # #411: direct principal-list membership must preserve the omitted resource needle.
    # Eleven values retain a single list operand; three values exercise the small-list plan.
    - actions: ["pv-in"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aOptionalString in P.attr.manyTeams

    - actions: ["pv-in-unrolled"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aOptionalString in P.attr.fewTeams

    # #430: projection lambda bodies and negated scalar leaves through a to-one hop.
    - actions: ["projection-exists-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames.exists(tagName, tagName == "public")'

    - actions: ["projection-exists-not-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames.exists(tagName, !(tagName == "public"))'

    - actions: ["rel-not-eq-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.parent.aString == "One")'

    - actions: ["rel-not-contains-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.parent.aString.contains("done")'

    - actions: ["rel-not-hierarchy-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!hierarchy(R.attr.parent.aString).overlaps(hierarchy("one"))'

    # Remaining hostile mechanisms from issue #396.

    # h3 (ab) is allowed; h5 (ab followed by newline) is denied. A dollar anchor that
    # matches before a final newline over-grants h5.
    - actions: ["regex-final-newline"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^ab$")'

    # The pinned planner retains eq(matches(...), true), unlike a bare matches condition.
    # a6 is the positive witness.
    - actions: ["regex-eq-true"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^h") == true'

    # A literal invalid regex is rejected at compile time in 0.55. Selecting it from
    # known principal context defers validation and preserves the original matches plan.
    # RE2 evaluation still errors; the literal rejection is pinned separately. The independent
    # a1 branch keeps the oracle live; accepting lookahead over-grants h3/h5.
    - actions: ["regex-lookahead"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches(P.attr.context == "projects:f1" ? "a(?=b)" : "^h") || R.attr.aNumber == 5'

    # The pinned PDP preserves -1; CEL indexing errors. The a1 branch keeps the oracle
    # live; treating -1 as the last element over-grants public-tag rows.
    - actions: ["index-negative"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames[-1] == "public" || R.attr.aNumber == 5'

    # The pinned PDP preserves 0.5; CEL indexing errors. The a1 branch keeps the oracle
    # live; truncating to zero over-grants public-tag rows.
    - actions: ["index-fractional"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames[0.5] == "public" || R.attr.aNumber == 5'

    # Only a6 has a second tag different from public. Missing second elements must deny
    # even under negation, not compare unequal.
    - actions: ["index-not-oob"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.tagNames[1] == "public")'

    # h4 (0) is allowed; malformed numeric strings must still deny under negation.
    - actions: ["cast-not-int"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(int(R.attr.aString) > 50)'

    # Missing aOptionalString raises under string() and must deny under negation; a3 is a
    # positive witness and a1 a negative witness.
    - actions: ["cast-not-string-missing"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(string(R.attr.aOptionalString) == "set")'

    # owner aliases the same column as an explicit null. string(null) raises, so the null
    # rows must deny under negation too.
    - actions: ["cast-not-string-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(string(R.attr.owner) == "set")'

    # h5 carries not-a-timestamp: a conversion error must deny under negation. a2 is
    # allowed; a1 is denied.
    - actions: ["cast-not-timestamp"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(timestamp(R.attr.createdBy) < timestamp("2025-01-01T00:00:00Z"))'

    # The double-cast dual: h4 is allowed; permissive prefix conversion under negation
    # over-grants malformed strings.
    - actions: ["cast-not-double"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(double(R.attr.aString) > 50.0)'

    # ==================== Indexed elements of number and boolean lists ====================
    # `index-scalar-list` and its companions read a list of STRINGS, so they never ask whether an
    # adapter keeps an element's JSON type when the literal is a number or a boolean. These read
    # `aNumberList` and `aBoolList`, the two homogeneous scalar lists the seeds carry for exactly
    # this. Every seed has both; most hold `[]`, where any position is an index error and the
    # PDP denies under both polarities.
    #
    # a1 [2] and a3 [2, 3] are the rows whose first element is 2. a4 [3, 2] holds 2 at the wrong
    # position, a5 [-2] the wrong sign, a7 [20] the value a text comparison would confuse with a
    # prefix, c1 [0] the zero a NULL would be mistaken for, and a6 [null, 2] a null first element,
    # which is a VALUE: `null == 2` is false and its negation true, while an absent element stays
    # an error.
    - actions: ["index-number-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumberList[0] == 2'

    # Oracle a4/a5/a6/a7/b4/c1: every row with a first element other than 2, including the null
    # one, and none of the empty lists.
    - actions: ["index-number-list-not-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aNumberList[0] == 2)'

    # a1 [true], b4 [true] and c1 [true, false] lead with true; a3 [false] and a5 [false, true]
    # with false, a4 [null, true] with a null element.
    - actions: ["index-bool-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBoolList[0] == true'

    # Oracle a3/a4/a5: false, and the null element, which is not true.
    - actions: ["index-bool-list-not-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aBoolList[0] == true)'

    # A boolean element against a NUMBER. CEL's equality is heterogeneous and false here, but SQLite
    # and MySQL store a JSON true as 1, so an element read back as SQL and compared to 1 returns
    # b4 and c1 as well — an over-grant. The a1 branch keeps the oracle live: a1 is aNumber 5.
    - actions: ["index-bool-list-vs-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBoolList[0] == 1 || R.attr.aNumber == 5'

    # The mirror: a number element against a boolean. b4 [1] is the row a 1-for-true reading
    # would admit. Oracle a1, from the aNumber branch alone.
    - actions: ["index-number-list-vs-bool"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumberList[0] == true || R.attr.aNumber == 5'

    # -- rule composition (#487) --
    # Every action above is one EFFECT_ALLOW rule for one role, so the root of every plan was the
    # root of one condition. Real policies compose: a conditional DENY beside a conditional ALLOW
    # plans to `and(X, not(Y))`, several conditional ALLOWs to `or(...)`, a derived role with a
    # resource condition to a conjunction with the rule's own condition, and a variable to whatever
    # it expands to. These actions make the PLANNER build those roots from separate rules rather
    # than spelling them in one expression, so an adapter's special-case handling of the root
    # (convex's filter/post-filter split, a root-only guard) meets the composed shape.
    #
    # Every DENY here reads a column no seed holds NULL, deliberately: a DENY over a NULL-bearing
    # column plans identically in both evaluation modes but check() does not agree with itself
    # across them — see conformance/README.md, "Rule composition".

    # and(not(gt), eq): conditional ALLOW + conditional DENY. Oracle: aBool true and aNumber <= 10.
    # c1/d1/e1/f1/h1.. witness the DENY (aBool true, aNumber > 10); a2/a5/b2.. the ALLOW.
    - actions: ["compose-allow-deny"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aBool == true

    - actions: ["compose-allow-deny"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber > 10

    # or(and, and): two conditional ALLOWs, each an `all`. Oracle a2/a5/b2 from the second branch,
    # f1/h1..h7 from the first. a1 (true, 5) and b4 (false, 8) each satisfy one conjunct of each.
    - actions: ["compose-multi-allow"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.aBool == true
              - expr: R.attr.aNumber > 15

    - actions: ["compose-multi-allow"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.aBool == false
              - expr: R.attr.aNumber < 7

    # and(not(gt), or(and, and)): the two ALLOWs above plus a DENY, which the planner hoists over
    # the disjunction. h5/h6/h7 (aNumber 21..23) are allowed by compose-multi-allow and denied here.
    - actions: ["compose-multi-allow-deny"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.aBool == true
              - expr: R.attr.aNumber > 15

    - actions: ["compose-multi-allow-deny"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.aBool == false
              - expr: R.attr.aNumber < 7

    - actions: ["compose-multi-allow-deny"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber > 20

    # or(gt, not(eq)): two ALLOWs, one of them a `none`. Oracle: every aBool false row, plus
    # h5/h6/h7 (aBool true, aNumber > 20).
    - actions: ["compose-or-not"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber > 20

    - actions: ["compose-or-not"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          none:
            of:
              - expr: R.attr.aBool == true

    # not(lt): an UNCONDITIONAL ALLOW with a conditional DENY — the most common real policy
    # ("everyone may, except ...") — so the root is a bare negation the planner produced. The DENY
    # is a plain comparison on purpose: a LIKE needle would test metacharacter escaping, which the
    # like-* actions already own, and every adapter refusing it would never reach the composition.
    # a2/a5/b3 (negative aNumber) are denied.
    - actions: ["compose-deny-only"]
      effect: EFFECT_ALLOW
      roles: ["USER"]

    - actions: ["compose-deny-only"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber < 0

    # and(not(or(eq, gt)), ge): two DENYs, which the planner joins under ONE negation. Oracle:
    # aNumber >= 0 and aBool true and aNumber <= 18. b4/b6/g1 witness the first DENY, h2/h3 the
    # second, a5/b3 the ALLOW.
    - actions: ["compose-two-deny"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber >= 0

    - actions: ["compose-two-deny"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aBool == false

    - actions: ["compose-two-deny"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber > 18

    # and(lt, eq): a derived role whose condition reads the RESOURCE (compose_flagged, aBool true)
    # composed with the rule's own condition. evaluation-probe's derived role reads only the
    # principal, so it always folds; this one reaches the plan. a2/a5 witness the role.
    - actions: ["compose-derived-role"]
      effect: EFFECT_ALLOW
      derivedRoles: ["compose_flagged"]
      condition:
        match:
          expr: R.attr.aNumber < 5

    # and(not(eq), lt): an unconditional DENY scoped to that derived role, so the role's resource
    # condition is what gets negated. Oracle: aBool false and aNumber < 12.
    - actions: ["compose-derived-deny"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber < 12

    - actions: ["compose-derived-deny"]
      effect: EFFECT_DENY
      derivedRoles: ["compose_flagged"]

    # and(not(gt), in): an ALLOW and a DENY each spelled through a variable, one of which mixes a
    # principal list into a resource comparison. Oracle a1/a6/b2/h4: h1/h2/h3/h5 hold "set" and are
    # denied by compose_large; rows whose aOptionalString is NULL stay denied through the ALLOW.
    - actions: ["compose-variable"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: V.compose_teamed

    - actions: ["compose-variable"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: V.compose_large

    # ==================== Membership in number and boolean lists ====================
    # The index-*-list actions above read ONE position; these ask the position-blind questions a
    # list is usually asked — `x in list` (value-first `in`) and `hasIntersection(list, [...])` —
    # of the same two homogeneous scalar lists. A store that compares an element with the literal
    # after coercing one onto the other's type answers them differently from CEL, whose equality is
    # heterogeneous: `"2" == 2` and `"true" == true` are false. Elasticsearch coerces a query term
    # onto the field's mapped type, so a `terms` query for "2" matches a double 2.0; SQLite and
    # MySQL read a JSON true as 1 (cerbos/query-plan-adapters#496 is the scalar-field half).

    # The matching-type baseline, so the cross-type probes below cannot pass by an adapter refusing
    # every membership in these lists. Oracle a1 [2], a3 [2, 3], a4 [3, 2] and a6 [null, 2]: the
    # position does not matter, and a5 [-2], a7 [20] and c1 [0] must not match.
    - actions: ["in-number-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '2 in R.attr.aNumberList'

    # A STRING that spells an element of a number list. CEL: false for every row. A coercing store
    # returns a1/a3/a4/a6 — the in-number-list rows. The aNumber == 5 branch keeps the oracle live
    # at a1 alone, as index-bool-list-vs-number does.
    - actions: ["in-number-list-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"2" in R.attr.aNumberList || R.attr.aNumber == 5'

    # The boolean mirror: "true" is not true. A coercing store returns every list holding true —
    # a1, a4 [null, true], a5 [false, true], b4, c1 [true, false]. Oracle a1, from the aNumber branch.
    - actions: ["in-bool-list-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"true" in R.attr.aBoolList || R.attr.aNumber == 5'

    # An intersection whose literal list holds one element of each type: "2" can never equal a
    # number element and 3 can. Oracle a3 [2, 3] and a4 [3, 2], the rows holding 3. A coercing store
    # adds a1 [2] and a6 [null, 2] for the "2"; an adapter that refuses a mixed list refuses a
    # shape CEL answers definitely.
    - actions: ["hasint-number-list-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.aNumberList, ["2", 3])'

    # The boolean intersection with nothing of the right type: false for every row in CEL, where a
    # coercing store returns every list holding true. Oracle a1, from the aNumber branch.
    - actions: ["hasint-bool-list-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.aBoolList, ["true"]) || R.attr.aNumber == 5'

    # ==================== Cross-type comparisons on scalar attributes ====================
    # The membership block above asks the cross-type question of a LIST; these ask it of single
    # scalar attributes and of a nested collection's sub-field. CEL's equality is heterogeneous:
    # `5 == "5"`, `true == "true"` and `"0" == 0` are all false, and `!=` is true. A store that
    # converts one side onto the other's type answers differently: Elasticsearch coerces a term onto
    # the mapped type, Mongoose casts a literal to the schema type, SQLite/H2/MySQL compare '5' = 5
    # as true, and MySQL reads a non-numeric string as 0 (cerbos/query-plan-adapters#496).

    # A string spelling a number, against the number attribute. Oracle a3 and a8 (aNumber 2), from
    # the matching branch; a converting store adds a1, whose aNumber is 5.
    - actions: ["eq-number-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber == "5" || R.attr.aNumber == 2'

    # The negation, where coercion UNDER-grants: `5 != "5"` is true, so a1 belongs to the oracle
    # (every row with aNumber > 3), and a store that reads "5" as 5 drops it.
    - actions: ["ne-number-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber != "5" && R.attr.aNumber > 3'

    # "true" is not true. A converting store returns every row whose aBool is true; oracle a1, from
    # the aNumber branch.
    - actions: ["eq-bool-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBool == "true" || R.attr.aNumber == 5'

    # The other direction: a NUMBER against the string attribute. h4's aString is "0", which a store
    # that converts the literal to text matches; MySQL goes further and reads every non-numeric
    # string as 0, so `aString = 0` holds for most rows. Oracle a1, from the aNumber branch.
    - actions: ["eq-string-vs-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == 0 || R.attr.aNumber == 5'

    # A mixed literal list against the number attribute: 2 can match and "5" cannot. Oracle a3/a8;
    # a converting store adds a1.
    - actions: ["in-scalar-number-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber in ["5", 2]'

    # A number against a nested collection's STRING sub-field. No tag name spells 0, so CEL is false
    # for every row, but MySQL reads each non-numeric name as 0 and matches. Oracle a1, from the
    # aNumber branch.
    - actions: ["exists-tag-name-vs-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, t.name == 0) || R.attr.aNumber == 5'

    # The map() projection form of the same comparison, with one member of each type: "public" can
    # match a tag name and 0 cannot. Oracle: the rows holding a "public" tag. A store that compares
    # names with 0 numerically adds every other named tag (MySQL), or fails to execute (H2).
    - actions: ["hasint-map-vs-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.tags.map(t, t.name), ["public", 0])'

    # A null ELEMENT of a number list is a value: `null in [null, 2]` is true (a6), and `null in []`
    # is false. MySQL's JSON_TABLE reads a JSON null element back as SQL NULL, where `= NULL` is
    # never true. Oracle a6.
    - actions: ["null-in-number-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'null in R.attr.aNumberList'

    # The negation: every row but a6, empty lists included, because `null in []` is a definite false.
    - actions: ["not-null-in-number-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(null in R.attr.aNumberList)'
