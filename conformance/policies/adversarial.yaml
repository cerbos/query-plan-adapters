# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
#
# Hostile policy shapes. Each action is planned by a real PDP, translated by the adapter, and
# compared against per-row check() decisions.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: adversarial
  # Used only by the compose-* actions at the end of this file (#487).
  importDerivedRoles: ["adversarial_compose"]
  variables:
    local:
      compose_teamed: R.attr.aOptionalString in P.attr.fewTeams
      compose_large: R.attr.aNumber > 10
  rules:
    # -- value-first comparisons (planner preserves source order) --
    - actions: ["vf-le"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 3 <= R.attr.aNumber

    - actions: ["vf-ge"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 2 >= R.attr.aNumber

    - actions: ["vf-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"one" != R.attr.aString'

    # -- in normalization (single element -> eq; empty -> always-denied) --
    - actions: ["in-single"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString in ["one"]

    - actions: ["in-empty"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString in []

    # -- LIKE metacharacters must be escaped, not interpreted --
    - actions: ["like-percent"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.startsWith("100%")

    - actions: ["like-underscore"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.contains("a_b")

    - actions: ["like-backslash"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.endsWith("\\")

    # '[' must be escaped: T-SQL LIKE treats '[...]' as a character class even with ESCAPE.
    # d1 ("[SEC]ret") must match and d2 ("Secret") must not.
    - actions: ["like-bracket"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.startsWith("[SEC]")

    # -- case sensitivity: CEL equality is byte-exact. c1 ("One") and h6 ("o\u00ADne", soft
    # hyphen) must be denied; a case-insensitive or non-byte-exact collation matches them (#474).
    - actions: ["cs-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString == "one"

    # -- case sensitivity through string matching, which collation does not govern --
    # SQLite's LIKE is ASCII-case-insensitive whatever the collation, so passing cs-eq is not
    # enough. One action per operator, since each lowers differently. c1 ("One") is the only
    # case witness. Needles carry no LIKE metacharacter; the like-* actions own that hazard.

    - actions: ["cs-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.contains("one")

    - actions: ["cs-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.startsWith("one")

    - actions: ["cs-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.endsWith("one")

    # -- string edge values --
    - actions: ["unicode-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString == "héllo🚀"

    - actions: ["empty-string-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString == ""

    # -- numeric edges --
    - actions: ["neg-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber < -1

    - actions: ["double-threshold"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber >= 1.5

    # -- collection macro semantics on empty/multi collections --
    - actions: ["all-on-empty"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.tags.all(t, t.name == "public")

    - actions: ["exists-on-empty"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.tags.exists(t, t.name == "public")

    - actions: ["exists-one-multi"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.tags.exists_one(t, t.name == "public")

    - actions: ["not-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.tags.exists(t, t.name == "private")'

    # -- outer resource attribute at TWO lambda depths (correlation-rebase probe) --
    - actions: ["outer-attr-depth2"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.categories.exists(c, c.subCategories.exists(s, s.name == "finance" && R.attr.aBool))

    # -- principal list folded into a lambda-scoped in --
    - actions: ["lambda-in-principal"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.tags.exists(t, t.name in P.attr.allowedTags)

    # -- logical shapes --
    - actions: ["nary-and"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.aBool
              - expr: R.attr.aNumber >= 0
              - expr: R.attr.aString != "one"

    - actions: ["double-negation"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(!R.attr.aBool)'

    - actions: ["triple-negation"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(!(!R.attr.aBool))'

    # not over NOT EXISTS (size==0) — negation composing over a negated subquery predicate
    - actions: ["not-empty"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(size(R.attr.tags) == 0)'

    # -- null-attribute alignment: CEL missing-attr error (deny) vs SQL NULL (excluded) --
    - actions: ["optional-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aOptionalString != "x"

    # -- field-to-field comparison inside a lambda (join column vs correlated outer column) --
    - actions: ["lambda-field-to-field"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.tags.exists(t, t.name == R.attr.aString)

    # -- size(coll) compared with a non-zero threshold → correlated COUNT subquery --
    - actions: ["size-threshold"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: size(R.attr.tags) > 1

    # -- size over a filtered collection → COUNT subquery with the lambda as WHERE --
    - actions: ["size-filter-count"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: size(R.attr.tags.filter(t, t.name == "public")) == 1

    # -- size(string) → LENGTH(column). The threshold keeps the astral-char seed ("héllo🚀": 6
    # code points in CEL, 7 UTF-16 units in some stores) on the same side either way.
    - actions: ["string-size"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: size(R.attr.aString) > 4

    # -- top-level field-to-field: column compared to column, incl. NULL exclusion semantics --
    - actions: ["field-to-field"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString == R.attr.aOptionalString

    # -- CEL ternary (planner emits if(cond, then, else)) --
    # Canonical form: cmp(if(c,a,b), v) rewritten into guarded branches.
    - actions: ["ternary-cmp"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aBool ? R.attr.aNumber : 0) > 1'

    # Ternary whose condition is itself an expression (startsWith), not a bare bool column.
    - actions: ["ternary-expr-cond"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aString.startsWith("100") ? R.attr.aNumber : -1) >= 0'

    # Nested ternary: the then-branch is another ternary; empty-string seed lands in the inner else.
    - actions: ["ternary-nested"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aBool ? (R.attr.aString == "" ? 0 : R.attr.aNumber) : -1) >= 2'

    # Negation must look only at the selected ternary arm. A selected missing parent or optional
    # string is an error and denies; an unselected one must not matter.
    - actions: ["not-ternary-parent"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aBool ? "one" : R.attr.parent.aOptionalString) == "set")'

    # Ternary under !(...): NOT over the OR-of-guarded-branches rewrite.
    - actions: ["ternary-negated"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aBool ? R.attr.aNumber : 0) > 1)'

    # Bare boolean-result ternary: both branches are predicates, no wrapping comparison.
    - actions: ["ternary-bare"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBool ? R.attr.aString == "one" : R.attr.aNumber < 0'

    # Value-first form: constant on the left of the comparison wrapping the ternary.
    - actions: ["ternary-value-first"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '0 < (R.attr.aBool ? R.attr.aNumber : -1)'

    # NULL condition column (a2/a4/a8): the CEL error must exclude the row from both branches.
    - actions: ["ternary-null-cond"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aOptionalString != "x" ? R.attr.aNumber : 0) > 1'

    # -- field-to-field string matching: the needle is a COLUMN, so its LIKE metacharacters
    # (b1/b2/b3) must be escaped at query time. NULL needles (a2/a4/a8) deny.
    - actions: ["f2f-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.contains(R.attr.aOptionalString)

    - actions: ["f2f-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.startsWith(R.attr.aOptionalString)

    - actions: ["f2f-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aString.endsWith(R.attr.aOptionalString)

    # -- arithmetic in comparisons. Literals are doubles because attribute numbers are CEL
    # doubles; int-literal arithmetic is a no-overload error that denies every row.
    - actions: ["arith-add"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber + 1.0 > 2.0'

    # Value-first: constant on the left, arithmetic on the right.
    - actions: ["arith-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '2.0 < R.attr.aNumber + 1.0'

    - actions: ["arith-sub"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber - 3.0 <= 0.0'

    # Negative multiplier: must not flip the inequality. Negative seeds (a2, a5, b3) are excluded.
    - actions: ["arith-mult-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber * -2.0 < 3.0'

    # 3/2.0 == 1.0 must be false: integer division would wrongly include a6 (aNumber 3).
    - actions: ["arith-div"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / 2.0 == 1.0'

    # Fractional threshold over division (double-space comparison end to end).
    - actions: ["arith-div-frac"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / 2.0 >= 1.5'

    # Arithmetic on both sides: n + 1 > n * 2 ⇔ n < 1.
    - actions: ["arith-both"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber + 1.0 > R.attr.aNumber * 2.0'

    # -- IEEE add-solve: eq/ne over field + fractional constant. -0.6 + 0.7 != 0.1 in IEEE, so
    # solving algebraically to `a_double = -0.6` is wrong for a1. Evaluate the sum in the store.
    - actions: ["arith-add-eq-frac"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aDouble + 0.7 == 0.1'

    - actions: ["arith-add-ne-frac"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aDouble + 0.7 != 0.1'

    # Exact control: 0.25 + 0.5 == 0.75 exactly, so a2 must be included.
    - actions: ["arith-add-eq-frac-exact"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aDouble + 0.5 == 0.75'

    # `+` over two columns: nothing in the plan says it is string concatenation (#391).
    # PostgreSQL errors, SQLite returns 0 rows, and MySQL coerces both sides to 0 and over-grants
    # 16 rows. Oracle {a1} ("one" + "set"); c1 ("One" + "Set") is the case trap.
    - actions: ["concat-f2f"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString + R.attr.aOptionalString == "oneset"'

    # ==================== clean-room probes (coverage gap hunt) ====================

    # -- GROUP A: compositions claimed to be supported but unproven end to end --

    # A1: ternary inside an exists() lambda body.
    - actions: ["p-ternary-in-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, (R.attr.aBool ? t.name : "zz") == "public")'

    # A2: arithmetic inside a lambda body (over the outer numeric attr).
    - actions: ["p-arith-in-lambda"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, t.name == "public" && R.attr.aNumber + 1.0 > 2.0)'

    # A3: field-to-field where BOTH fields are lambda-element columns (b4 is the witness).
    - actions: ["p-lambda-inner-f2f"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, t.id == t.name)'

    # A4: field-to-field LIKE inside a lambda with an outer-column needle (a8's "" matches every tag).
    - actions: ["p-lambda-f2f-like"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, t.name.contains(R.attr.aString))'

    # A5: size() of a NESTED relation path (relation reached through another relation).
    - actions: ["p-size-nested"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.categories.exists(c, size(c.subCategories) == 1)'

    # A6a: ternary whose BOTH branches are themselves ternaries.
    - actions: ["p-ternary-of-ternaries"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aBool ? (R.attr.aString == "" ? 0.0 : R.attr.aNumber) : (R.attr.aNumber < 0.0 ? -1.0 : 5.0)) > 1.0'

    # A6b: ternaries on BOTH sides of the comparison.
    - actions: ["p-ternary-vs-ternary"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aBool ? R.attr.aNumber : 0.0) > (R.attr.aString == "" ? 1.0 : 2.0)'

    # A6c: ternary under all().
    - actions: ["p-ternary-under-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.all(t, (R.attr.aBool ? t.name : "zz") != "private")'

    # A7: hasIntersection over a map(...) projection with unicode + LIKE metachars in the list.
    - actions: ["p-hasintersection-map"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.tags.map(t, t.name), ["public", "héllo🚀", "100%_x"])'

    # A8: deep and/or/not nesting (5+ levels) mixing arith, LIKE, exists, f2f.
    - actions: ["p-deep-nest"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aBool && (R.attr.aNumber + 1.0 > 2.0 || R.attr.aString.startsWith("100%"))) || (!R.attr.aBool && R.attr.tags.exists(t, t.name == "public" || t.name == R.attr.aString)))'

    # A9a: single-element in against a NULLABLE column.
    - actions: ["p-in-null-single"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aOptionalString in ["x"]'

    # A9b: multi-element in against a NULLABLE column.
    - actions: ["p-in-null-multi"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aOptionalString in ["x", "one_two"]'

    # A10: startsWith with a constant-folded concat needle.
    - actions: ["p-startswith-concat"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.startsWith("100" + "%")'

    # -- GROUP B: probably unsupported; records whether an adapter throws or answers wrongly --

    # B11: timestamp comparison over a string column (h5 is malformed).
    - actions: ["p-timestamp"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'timestamp(R.attr.createdBy) < timestamp("2025-01-01T00:00:00Z")'

    # B12: has() macro over an optional attribute.
    - actions: ["p-has"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'has(R.attr.aOptionalString)'

    # B13: map/struct member access (obj.inner mirrors aString on the check side).
    - actions: ["p-struct"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.obj.inner == "one"'

    # B14: matches() regex.
    - actions: ["p-matches"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^h")'

    # B15: list indexing.
    - actions: ["p-index"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags[0].name == "public"'

    # B16: negation of a NULL-condition ternary (three-valued logic under NOT).
    - actions: ["p-not-ternary-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aOptionalString != "x" ? R.attr.aNumber : 0.0) > 1.0)'

    # B17: negated exists over rows with ZERO tags (a2/b1/b2/b3).
    - actions: ["p-not-exists-empty"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.tags.exists(t, t.name == "public")'

    # B18: non-representable fraction: 3 * 0.1 != 0.3 in IEEE double.
    - actions: ["p-double-frac"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber * 0.1 == 0.3'

    # B19-B21: int()/double() casts (#311). CEL rejects a partly numeric string; SQL casts
    # read the leading digits. Every seed's aString raises, so the oracle is empty by design;
    # a direct cast wrongly returns a2, a3 and b2.
    - actions: ["cast-int-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'int(R.attr.aString) > 50'

    - actions: ["cast-double-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'double(R.attr.aString) > 50.0'

    # Cast rounding: CEL's int() truncates toward zero; PostgreSQL and MySQL round. a1
    # (aDouble -0.6) is the witness: int(-0.6) is 0 and the row is allowed.
    - actions: ["cast-int-double"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'int(R.attr.aDouble) == 0'

    # string(), the outbound cast (#376). For this corpus's values every store renders -0.6 as
    # CEL does, so a lowering can be correct. a1 is the only witness. Adapters that reimplement
    # the conversion must bound the range they can reproduce.
    - actions: ["cast-string-double"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'string(R.attr.aDouble) == "-0.6"'

    # The diverging half: CEL renders a bool as "true", but SQLite and MySQL store 1/0, so a
    # bare CAST matches nothing there while PostgreSQL is correct. 14 of 22 seeds are true.
    - actions: ["cast-string-bool"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'string(R.attr.aBool) == "true"'

    # B22-B23: filter()/map() as the whole condition (#313). They return lists, so check()
    # denies every row. Every adapter must reject: there is no stated boolean meaning.
    - actions: ["filter-as-condition"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.filter(t, t.name == "public")'

    - actions: ["map-as-condition"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.map(t, t.name)'

    # ==================== NULL element columns under collection macros ====================
    # b5 has only a NULL-name tag; b6 has a NULL-name tag and a "public" one. A missing element
    # attribute is a CEL error: exists/all absorb it only through a witness, exists_one never
    # does. SQL must keep these rows UNKNOWN, never FALSE — NOT(FALSE) leaks.

    # exists_one errors on any erroring element, even alongside a true one (b6).
    - actions: ["n-not-exists-one-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.tags.exists_one(t, t.name == "public")'

    # all() with a true sibling and a NULL element (b6): no false witness, so the error surfaces.
    - actions: ["n-all-mixed-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.all(t, t.name != "x")'

    # NOT over an erroring all(): !error is still an error → deny.
    - actions: ["n-not-all-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.tags.all(t, t.name == "public")'

    # Absorption control: b6 has a false witness, so all() is false (not an error) and the
    # negation allows.
    - actions: ["n-not-all-absorb"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.tags.all(t, t.name != "public")'

    # ==================== constant-receiver string matches ====================
    # The constant is the haystack and the column the needle. Do not swap the operands. The
    # metacharacter seeds (a2 "100%_done", a4 "xa_by", a7 "tail\") catch unescaped needles.

    # Matches a1, a7 and a8 (""); a2 is the escaping witness.
    - actions: ["cr-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"s100Xdone-tail\\one-end".contains(R.attr.aString)'

    # True for a5 ("xaXby" prefix) and a8 (""); a4 "xa_by" is the escaping discriminator.
    - actions: ["cr-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"xaXby-tail".startsWith(R.attr.aString)'

    # True for a5 ("xaXby" suffix) and a8 (""); a4 "xa_by" is the escaping discriminator.
    - actions: ["cr-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"prefix-xaXby".endsWith(R.attr.aString)'

    # Concatenated receiver: folded or not, the result is the haystack, never a column LIKE.
    - actions: ["cr-startswith-concat"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '("xaX" + "by-tail").startsWith(R.attr.aString)'

    # ==================== arithmetic edge probes ====================

    # Column divided by itself with a zero row (a7): 0/0 is NaN, so the ordering is false. A
    # NULLIF guard also excludes a7, so this cannot tell the two apart; cr-div-zero-ne can.
    - actions: ["cr-div-zero"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / R.attr.aNumber > 0.5'

    # NaN != 1.0 is true in CEL, so a7 is allowed. A NULLIF guard gives NULL and wrongly
    # excludes it. Every other seed divides to exactly 1.0.
    - actions: ["cr-div-zero-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / R.attr.aNumber != 1.0'

    # Same NaN witness through negated equality, so special-casing `ne` is not enough. A NULL
    # lowering keeps a7 UNKNOWN under both polarities.
    - actions: ["cr-div-zero-eq-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aNumber / R.attr.aNumber == 1.0)'

    # Signed zero: 2.0 / -0.0 is -Infinity. The planner keeps the sign on the wire. Oracle is
    # the negative-aNumber seeds a2/a5/b3; a7 is 0/-0.0 = NaN. (A column holding -0.0 is not
    # probed: SQL cannot read the sign of a zero.)
    - actions: ["cr-div-neg-zero"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / -0.0 > 0.0'

    # Denominator is a different column: covers a NULL denominator (a3) and a negative one
    # (a1, must not flip the comparison). Excluded: a1, a2, a3, a7.
    - actions: ["cr-div-other-column"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / R.attr.aDouble > 0.0'

    # Arithmetic on a division that can be NaN (a7). This ordering form is the control: CEL and
    # a NULL lowering both exclude a7.
    - actions: ["cr-div-then-add"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / R.attr.aNumber + 1.0 > 1.0'

    # The discriminator: NaN + 1.0 != 2.0 is true, so a7 is the only allowed row. A NULLIF guard
    # returns nothing.
    - actions: ["cr-div-then-add-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / R.attr.aNumber + 1.0 != 2.0'

    # ==================== multi-hop relation chains (W1) ====================
    # mainCategory is one nested object on the check side but two collection hops in the store.
    # The subquery must join through the intermediate hop, never off the root. Rows without it
    # deny in CEL and have an empty chain in SQL.

    - actions: ["w1-exists-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.mainCategory.subCategories.exists(s, s.name == "finance")'

    # size() over the chain = JOIN-through COUNT of the flattened tail elements.
    - actions: ["w1-size-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.mainCategory.subCategories) > 0'

    # Plain membership over the chained string list (adapter: defaultMemberField name).
    - actions: ["w1-in-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"finance" in R.attr.mainCategory.subNames'

    # -- the ABSENT to-one parent (#309) --
    # The positive chain probes above cannot see this: an absent parent and a non-matching one both
    # exclude the row. all(), a negated exists and a zero count can. CEL denies a missing path,
    # while an unguarded join makes all() vacuously true and the count 0, which over-grants.
    # The chain must require the intermediate hop to exist. Only a1/a6 ("finance"), a8 ("tech")
    # and c1 ("Finance") have a mainCategory.

    # all() over the chain: oracle a1/a6. An unguarded chain adds the parentless rows.
    - actions: ["w1-all-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.mainCategory.subCategories.all(s, s.name == "finance")'

    # Negated exists over the chain: oracle a8/c1.
    - actions: ["w1-not-exists-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.mainCategory.subCategories.exists(s, s.name == "finance")'

    # Zero count over the chain. Empty oracle by design: no parent has zero children, and the
    # parentless rows must not come back. Relation filters reach this through `none:`, not COUNT.
    - actions: ["w1-size-zero-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.mainCategory.subCategories) == 0'

    # `>= 0` is true exactly for rows that have the parent: oracle a1/a6/a8/c1. A chain that
    # folds the threshold to always-true returns all 22.
    - actions: ["w1-size-nonneg-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.mainCategory.subCategories) >= 0'

    # -- the same hazard through MEMBERSHIP (#315) --
    # The guard belongs in the shared relation-scope construction, not in each macro. Both
    # oracles are a8 and c1; an unguarded NOT EXISTS adds the parentless rows.

    # Negated membership over the chained string list.
    - actions: ["w1-not-in-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!("finance" in R.attr.mainCategory.subNames)'

    # hasIntersection reaches the chain through a different branch, so it is probed separately.
    - actions: ["w1-not-hasint-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!hasIntersection(R.attr.mainCategory.subNames, ["finance"])'

    # -- the same hazard through the negated count (#316) --
    # The planner emits `!(size(...) > 0)` verbatim, not as `== 0`. Guard the count expression
    # itself so every spelling inherits it. Empty oracle by design, like w1-size-zero-chain.
    - actions: ["w1-not-size-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(size(R.attr.mainCategory.subCategories) > 0)'

    # -- the same hazard through a ternary condition (#334) --
    # A bare NOT over the chain is true for an absent parent and wrongly selects the else branch.
    # Oracle a1/a6 (then branch); a8/c1 take the else branch and deny. An unguarded rewrite adds
    # the parentless rows whose aBool is false.
    - actions: ["w1-ternary-chain-cond"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '("finance" in R.attr.mainCategory.subNames) ? R.attr.aBool : !R.attr.aBool'

    # ==================== the real to-one join (G1) ====================
    # `parent` is the corpus's one real to-one relation and `parent.inner` is one hop further. See
    # README.md, "The real to-one relation", and ADR 0005. Seeds split by depth:
    #   no parent at all  (8): a5 a6 a8 b3 b4 b5 c2 d2
    #   parent, no inner  (6): a3 a7 a9 b2 c1 d1
    #   parent and inner  (7): a1 a2 a4 b1 b6 e1 f1
    # A missing level is a CEL error and denies. A LEFT JOIN that does not require the hop
    # over-grants under negation or null comparisons. Wrong join multiplicity only shows up in
    # executed rows.

    # String equality through one hop. Oracle b1 (parent "One"). e1's parent holds "one", so a
    # case-insensitive collation on the joined table wrongly adds e1.
    - actions: ["rel-eq-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aString == "One"'

    # Numeric equality through one hop. Oracle a1/a7 (parents a3 and a8, both aNumber 2).
    - actions: ["rel-eq-num-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber == 2'

    # The four orderings through one hop. Thresholds sit on boundary values, so `<` and `<=`
    # differ (a1/a7). Reading the root's aNumber instead of the parent's disagrees everywhere.
    - actions: ["rel-lt-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber < 2'

    - actions: ["rel-le-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber <= 2'

    - actions: ["rel-gt-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber > 2'

    - actions: ["rel-ge-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber >= 2'

    # Two comparisons on the same hop must share one join; a second join shows up once the
    # two predicates disagree. Oracle a2/a3/a9/b1/e1/f1.
    - actions: ["rel-range-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aNumber > 2 && R.attr.parent.aNumber < 12'

    # Bare boolean through one hop and its negation. Together they split the 13 parented
    # rows; the 8 parentless rows must appear in neither. Only the negation can see the hazard.
    - actions: ["rel-bool-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aBool'

    - actions: ["rel-not-bool-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.parent.aBool'

    # Substring through one hop. The needle has no metacharacter or case variant, so the
    # action tests only the join. Oracle a1/a4; reading the root's aString gives a2/a3.
    - actions: ["rel-contains-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aString.contains("done")'

    # `!= null` through one hop: a missing parent (8 rows) and a NULL parent column (a4/a7/c1)
    # must both deny. Oracle is the other 10.
    - actions: ["rel-ne-null-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.aOptionalString != null'

    # -- two levels out: where alias scoping and correlated-subquery nesting break --
    # 14 rows have no inner level, for two different reasons (no parent, or a parent without one).

    # Boolean two levels out. Oracle a1/a2/e1. a4/b1/b6/f1 have a false inner.
    - actions: ["rel-bool-hop2"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.inner.aBool == true'

    # String prefix two levels out. The correct level (e1), one level short (a1, a4) and the root
    # (a2, a3) give disjoint answers, so the wrong depth cannot pass by accident.
    - actions: ["rel-startswith-hop2"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.inner.aString.startsWith("100")'

    # -- the hop composed with something else --

    # Root predicate AND hop predicate. The hop alone matches b6 and d1; b6's aBool is false,
    # so the oracle is d1 and a filter that drops the root conjunct returns b6.
    - actions: ["rel-hop-and-root"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBool == true && R.attr.parent.aString.contains("re")'

    # Two-level hop OR collection subquery. Neither may become a row-restricting inner join.
    # a6/a8/c1 have no inner level but a matching category: CEL's OR absorbs the error, so
    # they are allowed. Treating the absent hop as excluding the row under-grants.
    - actions: ["rel-hop2-or-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.parent.inner.aBool == true || R.attr.categories.exists(c, c.name == "business")'

    # ==================== root relation inside a lambda body (W2) ====================
    # The inner tags.exists(...) must correlate to the ROOT entity, not the category the lambda
    # is iterating over.
    - actions: ["w2-outer-relation"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.categories.exists(c, size(c.subCategories) == 1 && R.attr.tags.exists(t, t.name == "public"))'

    # ==================== fractional size() thresholds ====================
    # COUNT is integral: >= 1.5 must round up to >= 2. CEL rejects ==/!= between int and double,
    # so only the ordering operators can be planned.
    - actions: ["cr-size-frac-ge"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.tags) >= 1.5'

    # -- fractional threshold over a CHAIN (#333) --
    # Rounding meets the absent-parent guard. eq/ne cannot be planned (int vs double is a type
    # error), so that collapse is unit-tested only. See README.md, "The absent to-one parent".

    # `>= 1.5` rounds up to `>= 2`. Empty oracle by design: it tests rounding, not the guard.
    # Truncating to `>= 1` returns a1/a6/a8/c1.
    - actions: ["w1-size-frac-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.mainCategory.subCategories) >= 1.5'

    # `<= 1.5` rounds down to `<= 1`, which a zero count also satisfies, so this tests the hop
    # guard as well. Oracle a1/a6/a8/c1; an unguarded chain returns all 22.
    - actions: ["w1-size-frac-le-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.mainCategory.subCategories) <= 1.5'

    # ==================== size(string) thresholds outside int range ====================
    # The planner sends huge integers verbatim. A narrowing (int) cast turned 4294967296 into 0.
    # `size > huge` is always false and must fold that way.
    - actions: ["size-huge-gt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.aString) > 4294967296'

    # The mirror: `size < huge` is true for every present string, including a8's "".
    - actions: ["size-huge-lt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.aString) < 4294967296'

    # ==================== constant NaN / ±Infinity ordering ====================
    # CEL 0.30 (Cerbos 0.55) returns false for any ordering involving NaN. `now() == now()`
    # stops Cerbos folding the non-finite arithmetic before planning. Double.compare ranks NaN
    # above every number and would make the else arm always true.
    - actions: ["nan-ord-ternary"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '((R.attr.aBool ? 1.0 : 0.0/0.0) > 0.5) && now() == now()'

    # Value-first: the mirrored comparison puts NaN on the normalized left.
    - actions: ["nan-ord-ternary-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(0.5 < (R.attr.aBool ? 1.0 : 0.0/0.0)) && now() == now()'

    # NaN on the right (both sides are expressions, so nothing mirrors): le(0.5, NaN) is false.
    - actions: ["nan-ord-le"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '((R.attr.aBool ? 1.0/1.0 : 1.0/2.0) <= (R.attr.aBool ? 0.5 : 0.0/0.0)) && now() == now()'

    # ±Infinity is ordered normally and must not be treated like NaN.
    - actions: ["nan-ord-inf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '((R.attr.aBool ? 1.0/0.0 : -1.0/0.0) > 0.5) && now() == now()'

    # ==================== hierarchy operators (hier-*) ====================
    # Both operand orders per operator. ancestorOf and descendentOf are strict (a3/b4 hold equal
    # paths); overlaps is inclusive. Seeds include string prefixes that are not path prefixes
    # ("dept.engineering") and LIKE-wildcard traps (b2/b3).

    # field-first ancestorOf → scope IN ('dept', 'dept.eng').
    - actions: ["hier-ancestor-ff"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope).ancestorOf(hierarchy("dept.eng.platform"))'

    # constant-first ancestorOf → scope LIKE 'dept.eng.%' (strict descendants only).
    - actions: ["hier-ancestor-cf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy("dept.eng").ancestorOf(hierarchy(R.attr.scope))'

    # field-first descendentOf → scope LIKE 'dept.eng.%'.
    - actions: ["hier-descendent-ff"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope).descendentOf(hierarchy("dept.eng"))'

    # constant-first descendentOf → the FIELD is the ancestor → strict-prefix IN list.
    - actions: ["hier-descendent-cf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy("dept.eng.platform").descendentOf(hierarchy(R.attr.scope))'

    # field-first overlaps → IN ('dept') OR = 'dept.eng' OR LIKE 'dept.eng.%'.
    - actions: ["hier-overlaps-ff"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope).overlaps(hierarchy("dept.eng"))'

    # constant-first overlaps → the same union with the operands mirrored.
    - actions: ["hier-overlaps-cf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy("dept.eng").overlaps(hierarchy(R.attr.scope))'

    # Escaped prefix LIKE on '50%:a_b:'. Traps: b2 (unescaped %), b3 (unescaped _), b4 (equal path).
    - actions: ["hier-meta-like"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope, ":").descendentOf(hierarchy("50%:a_b", ":"))'

    # Strict prefixes compared by equality: a9/b6 match; no pattern matching.
    - actions: ["hier-meta-in"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope).ancestorOf(hierarchy("50%.a_b.x"))'

    # overlaps over a metacharacter path emits the IN list, the equality and the escaped LIKE
    # at once. It is the only route to the LIKE branch through the union. Same traps as
    # hier-meta-like; b6 ("50%.a_b") is one segment under ':' and must not match.
    - actions: ["hier-overlaps-meta"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope, ":").overlaps(hierarchy("50%:a_b", ":"))'

    # '[' in a path must be escaped (SQL Server character classes). d1 is the literal-bracket
    # descendant; d2 is what an unescaped class would match.
    - actions: ["hier-bracket"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope, ":").descendentOf(hierarchy("[env]:prod", ":"))'

    # ==================== the primary key as a filterable attribute (id-*) ====================
    # These filter on `request.resource.id`, which the planner leaves as a variable. Its mapping
    # differs structurally per adapter (primary key, ObjectId, document id), and an adapter that
    # only strips `request.resource.attr.` misses it. f1's aString equals its id and its
    # aOptionalString is the id with a prefix. See README.md, "The primary key as a filterable
    # attribute".

    # Key against a constant. Oracle {f1}. The only id-* form ChromaDB and Elasticsearch translate.
    - actions: ["id-eq-const"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.id == "f1"'

    # Key against a column, both polarities. The negation's oracle is 21 of 22, so resolving the
    # key to the wrong column shows up in the row count.
    - actions: ["id-f2f"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == R.id'

    - actions: ["id-f2f-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString != R.id'

    # String concatenation with the key. `add` over strings must not become SQL `+`.
    # Field-first: f1's aOptionalString is "prefix:f1"; NULL aOptionalString rows deny.
    - actions: ["id-concat"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aOptionalString == "prefix:" + R.id'

    # Value-first: the principal side folds to "projects:f1", so the adapter compares a constant
    # with a concatenation built from the key.
    - actions: ["id-concat-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.context == "projects:" + R.id'

    # The key inside a hierarchy path built by `list()`: the path is constructed, not read from a
    # column. Oracle {f1}.
    - actions: ["hier-list-id"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(P.attr.context, ":").overlaps(hierarchy(["projects", R.id]))'

    # -- timestamp(field) vs constant-instant comparisons (ts-*) --
    # The planner folds now()-duration to a constant timestamp("<RFC-3339>") and keeps source
    # order in both spellings.

    # Rows older than 24h. Seeds sit well before 2026 or after 2036. a3 has no createdAt and
    # denies on both sides.
    - actions: ["ts-window"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'timestamp(R.attr.createdAt) < now() - duration("24h")'

    # Value-first: an operand inversion flips the whole included set.
    - actions: ["ts-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'now() - duration("24h") > timestamp(R.attr.createdAt)'

    # Instant equality against a literal (a4 is the exact-match witness).
    - actions: ["ts-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'timestamp(R.attr.createdAt) == timestamp("2024-06-01T00:00:00Z")'

    # Same instant at a non-UTC offset: CEL compares instants, so a4 still matches.
    - actions: ["ts-eq-offset"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'timestamp(R.attr.createdAt) == timestamp("2024-06-01T02:00:00+02:00")'

    # ne: every row except a4, and except a3 (NULL createdAt), which errors in CEL.
    - actions: ["ts-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'timestamp(R.attr.createdAt) != timestamp("2024-06-01T00:00:00Z")'

    # ==================== direct null comparisons ====================
    # There is no existence operator on the wire: `x != null` arrives as `ne` with a null operand
    # and has() is folded at plan time (#261). `owner` is the explicit-null alias, so check()
    # receives null rather than a missing attribute. NULL owners: a2/a4/a8/c2/e1.

    - actions: ["null-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner == null'

    - actions: ["null-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner != null'

    # Value-first: the null is operand 0. Reading operands positionally inverts them (#258/#259).
    - actions: ["vf-null-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'null != R.attr.owner'

    # NOT (col IS NULL) is never UNKNOWN, so this returns every non-null row.
    - actions: ["null-not-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner == null)'

    # ==================== explicit null against a NON-null constant ====================
    # CEL: `null != "x"` is true. SQL: `NULL != 'x'` is UNKNOWN. A naive lowering under-grants
    # (#308). The NULL owners are the witnesses; a3's owner is "x".
    - actions: ["null-value-ne-const"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner != "x"'

    # The planner emits not(eq(...)) verbatim, so fixing only `ne` still under-grants here.
    - actions: ["null-value-not-eq-const"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner == "x")'

    # Negated membership with no null element: CEL gives true for a null owner, SQL gives
    # UNKNOWN. Oracle 20 of 22; the naive translation returns 15. eq, ne and in are definite
    # over null in CEL; orderings and string operators error and must stay UNKNOWN.
    - actions: ["null-value-not-in-const"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner in ["x", "one_two"])'

    # Two explicit-null columns: CEL says null == null, SQL says UNKNOWN. `coOwner` is the
    # explicit-null alias of `scope`. Oracle {e1}, the only row where both are NULL.
    - actions: ["null-value-f2f"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner == R.attr.coOwner'

    # Mixed conventions: `scope` is omitted when NULL, so those rows deny under both
    # polarities. Making the comparison definite because one side is explicit over-grants.
    # Oracle: 18 rows (a7, e1, f1 denied); the over-eager rendering returns 20.
    - actions: ["null-value-f2f-mixed"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner != R.attr.scope'

    # The same divergence through the value-list fold (#295/#301), negated. `manyTeams` has 11
    # elements, so the planner sends a value list. The null guard must sit in the shared
    # comparison code. Oracle 18 of 22; the naive fold returns 13.
    - actions: ["null-value-pv-not-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!P.attr.manyTeams.exists(t, R.attr.owner == t)'

    # Same wire node as null-eq, but on `aOptionalString`, which is omitted when NULL, so check()
    # denies every row. IS NULL would return five denied rows (#302). Listed in
    # `nullRepresentationOmitted`: harnesses run it with that option and assert a throw.
    - actions: ["null-eq-missing"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aOptionalString == null'

    # ==================== in-lists containing null ====================
    # The null element arrives verbatim and `null in [..., null]` is true. It must become an
    # IS NULL disjunct; a raw `IN (..., NULL)` drops null rows and makes the negation UNKNOWN.

    # Matches a3 ("x") and b1 ("one_two"), plus the NULL owners.
    - actions: ["in-null-elem-mixed"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner in ["x", "one_two", null]'

    # Negation: `NOT IN (..., NULL)` returns nothing.
    - actions: ["in-null-elem-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner in ["x", "one_two", null])'

    # All-null list: folded to eq(owner, null) → IS NULL.
    - actions: ["in-null-elem-only"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner in [null]'

    - actions: ["in-null-elem-only-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner in [null])'

    # `null in tagNames` is true when a tag has a NULL name (b5/b6) → EXISTS(name IS NULL).
    - actions: ["in-null-elem-rel"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'null in R.attr.tagNames'

    # Negation: rows with no null member, including empty collections.
    - actions: ["in-null-elem-rel-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(null in R.attr.tagNames)'

    # hasIntersection with a null element behaves like `in`: b5/b6 plus the "public" rows.
    - actions: ["in-null-elem-hasint"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.tagNames, ["public", null])'

    # ==================== in(variable, variable) ====================
    # Attribute-in-attribute membership, member first. Seeds cover a match (a9/b4), no match, an
    # empty collection, null in [null] (e1, true) and a null owner without a null element (a4/a8).
    - actions: ["in-var-var"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.owner in R.attr.tagNames'

    - actions: ["in-var-var-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.owner in R.attr.tagNames)'

    # ==================== depth-3 nested collection macros ====================
    # categories → subCategories → labels. a1 is true ("gold"), a6 errors (unnamed label, must
    # deny through both levels), a8 is false, c1 is the case trap ("Gold").
    - actions: ["macro-depth3-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.categories.exists(c, c.subCategories.exists(s, s.labels.exists(l, l.name == "gold")))'

    # Negation: determined-false rows are allowed; a6 stays an error and denies.
    - actions: ["macro-depth3-not-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.categories.exists(c, c.subCategories.exists(s, s.labels.exists(l, l.name == "gold")))'

    # all() at the middle level: a6 errors, a8 is false, a1 is true.
    - actions: ["macro-depth3-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.categories.exists(c, c.subCategories.all(s, s.labels.exists(l, l.name == "gold")))'

    # -- collection macros over a principal list: the planner's unroll cliff --
    # Up to 10 elements the planner unrolls exists/all into an or/and chain; above that it sends
    # a value list (cerbos/cerbos#2570, #2817). `manyTeams` has 11 to force the value list. NULL
    # aOptionalString rows (a2/a4/a8/c2/e1) must deny under both polarities, so this is not a
    # plain IN/NOT IN. Witnesses: 'set' (a1; c1's 'Set' must not match), '' (a6), '%_o' (b2).
    - actions: ["pv-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: P.attr.manyTeams.exists(t, R.attr.aOptionalString == t)

    # all(): true only for a present aOptionalString matching no element. A NOT IN admits NULLs.
    - actions: ["pv-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: P.attr.manyTeams.all(t, R.attr.aOptionalString != t)

    # ==================== root position and bare operand forms ====================
    # Positions and operand forms the corpus never produced, found by diffing wire-fixture node
    # shapes. All are expected to translate everywhere. Each uses a local scalar column so it
    # avoids the join code.

    # `not` over a bare ordering. The two actions split all 22 seeds (aNumber is never NULL):
    # 17 and 5. Dropping the negation swaps them. not-lt shares its oracle with gt-bare.
    - actions: ["not-lt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aNumber < 2)'

    - actions: ["not-gt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aNumber > 1)'

    # Bare `gt` and `le` on a local column. The oracles are not complements (they overlap on
    # a3/a8), so confusing the two operators cannot pass.
    - actions: ["gt-bare"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber > 1'

    - actions: ["le-bare"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber <= 2'

    # The whole condition is a bare boolean variable with no operator wrapper. Oracle: the 14
    # aBool-true rows.
    - actions: ["root-bare-bool"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBool'

    # The root is a disjunction. The second disjunct is `aNumber < 0` so dropping either side
    # changes the answer (a2 and a5 come only from it).
    - actions: ["root-or"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          any:
            of:
              - expr: R.attr.aBool
              - expr: R.attr.aNumber < 0

    # A subquery OR a scalar predicate. A subquery emitted as an inner join is fine under `and`
    # but drops rows under `or`. Witnesses: b6 (NULL-name and "public" tags, aBool false) and
    # a5. Oracle 16 rows; collapsing to the left side returns 14.
    - actions: ["or-eq-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          any:
            of:
              - expr: R.attr.aBool
              - expr: R.attr.tags.exists(t, t.name == "public")

    # The membership spelling: `in` over tagNames. Same oracle as or-eq-exists; only the wire
    # shape differs.
    - actions: ["or-eq-in"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          any:
            of:
              - expr: R.attr.aBool
              - expr: '"public" in R.attr.tagNames'

    # ==================== hazard classes the corpus missed ====================
    # Each pins a known disagreement between CEL and a store, or a bug already shipped to
    # several adapters, that no other action reaches (#387).

    # De Morgan: `not` over `and`. This is also the shape a DENY rule produces. a1 is allowed
    # only because the second conjunct fails, so distributing the negation drops it.
    # Oracle a1/a2/a5/b2/b4/b6/c2/d2.
    - actions: ["not-and"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aBool && R.attr.aString != "one")'

    # Negated LIKE with a column needle. Two hazards:
    #   * NULL needles (a2/a4/a8/c2/e1) must stay excluded; bare NOT LIKE leaks them.
    #   * Unescaped needles under-grant: b1 (`one_two`) and b2 (`%_o`) drop out.
    # not-startswith has a different oracle so the two operators cannot be confused.
    - actions: ["not-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.aString.contains(R.attr.aOptionalString)'

    - actions: ["not-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.aString.startsWith(R.attr.aOptionalString)'

    # Modulo. Compared with `== 1` because `% 2 == 0` gives the same answer for truncated and
    # floored modulo. a5 (-5) is the witness: CEL denies, a floored lowering allows. int() is
    # required because `%` has no double overload. Oracle: the odd positives.
    - actions: ["arith-mod"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'int(R.attr.aNumber) % 2 == 1'

    # Indexing a scalar list directly (a bare `index(V,K)`). Most SQL adapters must refuse:
    # row order is undefined. b6 ([null, "public"]) catches an index rewritten as "any element".
    # Rows without tags are out of range and deny. Oracle a1/a3/a5/a6/a8.
    - actions: ["index-scalar-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames[0] == "public"'

    # Negation keeps out-of-range errors; a null element is a value.
    - actions: ["index-scalar-list-not-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.tagNames[0] == "public")'

    # An explicit null at position 0 differs from an absent position 0.
    - actions: ["index-scalar-list-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames[0] == null'

    # List equality over map() is ordered and exact. a3 (["t3a","t3b"]) is the only witness.
    # b5/b6 have NULL names but non-null ids, so the projection never errors.
    - actions: ["map-eq-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.map(t, t.id) == ["t3a", "t3b"]'

    # -- value-first: lt, size and hasIntersection --
    # Operand inversion is this repository's canonical bug (#258, #259). vf-lt has the same
    # oracle as gt-bare; an inversion gives a disjoint set.
    - actions: ["vf-lt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '1 < R.attr.aNumber'

    # size() on the right of an ordering. Oracle: the 13 rows with at least one tag.
    - actions: ["vf-size"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '0 < size(R.attr.tags)'

    # hasIntersection with the constant list first. The answer is symmetric but the query is
    # not: one side is a column, the other a parameter list. c1's "Public" must not match.
    # Oracle a1/a3/a5/a6/a7/a8/b6.
    - actions: ["vf-hasint"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(["public", "other"], R.attr.tagNames)'

    # -- the other side of the unroll cliff --
    # `fewTeams` has 3 elements, so the planner unrolls into an or/and chain (the common case).
    # Same witnesses as pv-exists minus a9's 'same', so the oracles differ. NULL rows must deny
    # under both polarities. Oracles: exists a1/a6/b2; all is every other present row.
    - actions: ["pv-exists-unrolled"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: P.attr.fewTeams.exists(t, R.attr.aOptionalString == t)

    - actions: ["pv-all-unrolled"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: P.attr.fewTeams.all(t, R.attr.aOptionalString != t)

    # filter() one level down, in a conjunct. check() denies every row, so the oracle is empty
    # by design. Dropping the untranslatable conjunct returns the 14 aBool rows. See README,
    # "The degeneracy guard".
    - actions: ["filter-as-conjunct"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.tags.filter(t, t.name == "public")
              - expr: R.attr.aBool

    # ==================== shapes an Elasticsearch audit found unguarded ====================
    # Found by auditing one adapter and added here so every adapter is asked.

    # size(string) > 0 must not hit the collection-emptiness fast path. a8 ("") is the only
    # denied row.
    - actions: ["string-size-gt0"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.aString) > 0'

    # `in` over a map literal tests the keys; the planner folds it to a key list. The values are
    # not strings, so matching on them cannot pass by accident. Oracle a1/a9; c1 is the case trap.
    - actions: ["in-map-keys"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString in {"one": 1, "same": 2}'

    # -1e19 on a double field. Narrowing through int64 saturates to Long.MIN_VALUE. g1
    # (-9.5e18) sits in the gap. Empty oracle by design; the narrowed filter returns g1.
    - actions: ["double-huge-lt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aDouble < -1e19'

    # Mirror with a real oracle: every present aDouble. Saturation drops g1 (an under-grant).
    - actions: ["double-huge-gt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aDouble > -1e19'

    # RE2 parses `^o|e$` as `^o` OR `e$`. Wrapping as `^(...)$` or lowering `^` to a prefix
    # query gets it wrong. Oracle a1/a2/a3/a9/b1/c1 (c1 "One" matches by its tail).
    - actions: ["matches-alt"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^o|e$")'

    # Empty hierarchy delimiter: one segment per character, so descendentOf is a strict string
    # prefix. Defaulting to "." drops a5; `prefix + '%'` adds a2. Oracle a3/a4/a5/b5/c2.
    - actions: ["hier-empty-delim"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.scope, "").descendentOf(hierarchy("dept.eng", ""))'

    # -- #414: migrated corpus gaps and follow-up probes --

    # wildcard-*: h1 matches literal wildcard characters; h2/h3 are near misses.
    - actions: ["wildcard-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.contains("*?b")'

    - actions: ["wildcard-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.endsWith("*?b")'

    # regex-*: RE2 syntax beyond a literal prefix; h2 contains a newline.
    - actions: ["regex-digit"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("\\d")'

    - actions: ["regex-case"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("(?i)^one$")'

    - actions: ["regex-posix"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("[[:digit:]]")'

    - actions: ["regex-unanchored"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("ne")'

    - actions: ["regex-dot"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^a.*b$")'

    - actions: ["regex-alternation"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^a|b$")'

    - actions: ["regex-grouped"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^(ab|b)$")'

    - actions: ["regex-brace"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^a{q}[*][?]b$")'

    - actions: ["regex-repetition"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^(ab){1,2}$")'

    - actions: ["regex-optional-operators"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^[ab@#&~<>]+$")'

    # except-*: the two-list function, in each position the planner delivers it.
    - actions: ["except-root"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames.except(["public"])'

    - actions: ["except-size"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.tagNames.except(["public"])) > 0'

    - actions: ["except-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames.except(["public"]) == ["private"]'

    # Non-empty collection spelled `size >= 1`.
    - actions: ["size-ge-one"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.tags) >= 1'

    # Numeric membership binds numbers, not strings.
    - actions: ["in-numbers"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber in [2, 3, 5]'

    # pv-empty-*: an empty principal collection; checks macro identities and planner folding.
    - actions: ["pv-empty-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(P.attr.emptyTeams.exists(t, t == R.attr.aOptionalString))'

    - actions: ["pv-empty-not-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(P.attr.emptyTeams.exists(t, t == R.attr.aOptionalString))'

    - actions: ["pv-empty-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(P.attr.emptyTeams.all(t, t == R.attr.aOptionalString))'

    - actions: ["pv-empty-not-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(P.attr.emptyTeams.all(t, t == R.attr.aOptionalString))'

    # pv-structs*: 11 principal structs force a value-list lambda; members may be null or missing.
    - actions: ["pv-structs"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.manyStructs.exists(t, t.name == R.attr.aOptionalString)'

    - actions: ["pv-structs-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.nullableStructs.exists(t, t.name == R.attr.aOptionalString)'

    - actions: ["pv-structs-missing"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.missingStructs.exists(t, t.name == R.attr.aOptionalString)'

    # The inner lambda rebinds t and must shadow the outer principal-list substitution.
    - actions: ["pv-shadow"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.manyTeams.exists(t, R.attr.tags.exists(t, t.name == "public"))'

    # Negated principal-value macro must keep omitted-attribute errors.
    - actions: ["pv-not-exists"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(P.attr.manyTeams.exists(t, t == R.attr.aOptionalString))'

    - actions: ["pv-not-all"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(P.attr.manyTeams.all(t, t == R.attr.aOptionalString))'

    # Principal-list macros the planner cannot fold: translate correctly or refuse.
    - actions: ["pv-exists-one"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'P.attr.manyTeams.exists_one(t, t == R.attr.aOptionalString)'

    - actions: ["pv-filter"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(P.attr.manyTeams.filter(t, t == R.attr.aOptionalString)) > 0'

    # Two-list difference with a principal-list receiver. a1 ("set") and b2 ("%_o") shrink it;
    # c1 ("Set") does not; a2 omits the attribute and denies.
    - actions: ["pv-except"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(P.attr.manyTeams.except([R.attr.aOptionalString])) < size(P.attr.manyTeams)'

    # Principal-list macro the planner cannot fold (see pv-exists-one).
    - actions: ["pv-map"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aOptionalString in P.attr.manyTeams.map(t, t + R.attr.aString)'

    # Negation at root preserves a bare resource boolean.
    - actions: ["root-not-bool"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.aBool'

    # Literal value-list fold inside a resource lambda must keep lambda scope.
    - actions: ["lambda-in-literal"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.tagNames.exists(tagName, tagName in ["public", "other"]))'

    - actions: ["lambda-in-literal-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.tagNames.exists(tagName, tagName in ["public", "other"]))'

    # Ternary is the lambda body rather than a comparison operand.
    - actions: ["lambda-ternary"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, t.name == "public" ? R.attr.aBool : !R.attr.aBool)'

    # type-*: mixed-type operands deny in CEL; implicit store coercion must not over-grant.
    - actions: ["type-string-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == P.attr.zero'

    - actions: ["type-number-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber == P.attr.context'

    - actions: ["type-columns"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == R.attr.aNumber'

    - actions: ["type-size-bool"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.aBool) > 0'

    - actions: ["type-size-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'size(R.attr.aNumber) > 0'

    - actions: ["type-hierarchy-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy(R.attr.aNumber).descendentOf(hierarchy("1.2"))'

    # Non-string receiver or needle must not be coerced to text by the store.
    - actions: ["type-number-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber.contains("2")'

    - actions: ["type-needle-contains"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.contains(R.attr.aNumber)'

    - actions: ["type-number-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber.startsWith("2")'

    - actions: ["type-needle-startswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.startsWith(R.attr.aNumber)'

    - actions: ["type-number-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber.endsWith("2")'

    - actions: ["type-needle-endswith"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.endsWith(R.attr.aNumber)'

    # An omitted optional scalar differs from an explicitly null owner under membership.
    - actions: ["in-var-var-omitted"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aOptionalString in R.attr.tagNames)'

    - actions: ["in-var-var-omitted-neg"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aOptionalString in R.attr.tagNames)'

    # #414 follow-ups: keep runtime type, missing-attribute and NaN semantics through composition.
    - actions: ["not-concat-unsolvable"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aOptionalString + "!") == "nope")'

    - actions: ["not-concat-unsolvable-ne"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '(R.attr.aOptionalString + "!") != "nope"'

    - actions: ["hier-overlaps-list-prefix"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hierarchy("dept", ".").overlaps(hierarchy(["dept", R.attr.scope]))'

    - actions: ["not-hasint-empty-chain"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!hasIntersection(R.attr.mainCategory.subNames, P.attr.emptyTeams)'

    - actions: ["div-by-division"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber / (R.attr.aDouble / R.attr.aNumber) > 0'

    - actions: ["temporal-raw-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.createdAt == R.attr.updatedAt'

    # NaN ordering is false in CEL 0.30, so the negation allows the NaN arm; the finite arm
    # (1 <= 2) denies. now() == now() keeps the arithmetic unfolded.
    - actions: ["not-nan-ord-le"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aBool ? 1.0/1.0 : 1.0/2.0) <= (R.attr.aBool ? 2.0 : 0.0/0.0)) && now() == now()'

    # NaN ordering is false even against a string, while number-vs-string is a type error.
    # The negation allows only the NaN arm.
    - actions: ["not-nan-order-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!((R.attr.aBool ? 1.0 : 0.0/0.0) < R.attr.aString) && now() == now()'

    # Non-scalar literals and symmetric intersection shapes, ported from the Java gap tests.
    - actions: ["hasint-null-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(["public", null], R.attr.tagNames)'

    - actions: ["hasint-map-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(["public", "other"], R.attr.tags.map(t, t.name))'

    - actions: ["hasint-map-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.tags.map(t, t.name), ["public", null])'

    - actions: ["hasint-map-null-vf"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(["public", null], R.attr.tags.map(t, t.name))'

    - actions: ["eq-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames == ["public"]'

    - actions: ["ne-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames != ["public"]'

    - actions: ["eq-map"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == {"a": 1}'

    - actions: ["ne-map"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString != {"a": 1}'

    - actions: ["eq-map-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == {"a": null}'

    - actions: ["in-nested-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString in [["one"], ["same"]]'

    - actions: ["in-list-element"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '["public"] in R.attr.tagNames'

    - actions: ["hasint-map-element"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.tagNames, [{"a": 1}])'

    # #411: direct principal-list membership must keep the omitted resource needle. 11 values
    # send one list operand; 3 values use the small-list plan.
    - actions: ["pv-in"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aOptionalString in P.attr.manyTeams

    - actions: ["pv-in-unrolled"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aOptionalString in P.attr.fewTeams

    # #430: projection lambda bodies and negated scalar leaves through a to-one hop.
    - actions: ["projection-exists-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames.exists(tagName, tagName == "public")'

    - actions: ["projection-exists-not-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames.exists(tagName, !(tagName == "public"))'

    - actions: ["rel-not-eq-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.parent.aString == "One")'

    - actions: ["rel-not-contains-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!R.attr.parent.aString.contains("done")'

    - actions: ["rel-not-hierarchy-hop"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!hierarchy(R.attr.parent.aString).overlaps(hierarchy("one"))'

    # -- remaining mechanisms from #396 --

    # h3 ("ab") is allowed; h5 ("ab\n") is not. A `$` that matches before a final newline over-grants h5.
    - actions: ["regex-final-newline"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^ab$")'

    # The planner keeps eq(matches(...), true). a6 is the positive witness.
    - actions: ["regex-eq-true"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches("^h") == true'

    # An invalid literal regex fails to compile, so the pattern comes from principal context.
    # RE2 still errors at evaluation; accepting lookahead over-grants h3/h5. a1 keeps the oracle live.
    - actions: ["regex-lookahead"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString.matches(P.attr.context == "projects:f1" ? "a(?=b)" : "^h") || R.attr.aNumber == 5'

    # Index -1 errors in CEL. Treating it as the last element over-grants. a1 keeps the oracle live.
    - actions: ["index-negative"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames[-1] == "public" || R.attr.aNumber == 5'

    # Index 0.5 errors in CEL. Truncating to 0 over-grants. a1 keeps the oracle live.
    - actions: ["index-fractional"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tagNames[0.5] == "public" || R.attr.aNumber == 5'

    # Only a6 has a second tag other than "public". A missing element denies even under negation.
    - actions: ["index-not-oob"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.tagNames[1] == "public")'

    # h4 ("0") is allowed; malformed numeric strings deny under negation.
    - actions: ["cast-not-int"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(int(R.attr.aString) > 50)'

    # string() on a missing attribute errors and denies under negation. a3 allowed, a1 denied.
    - actions: ["cast-not-string-missing"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(string(R.attr.aOptionalString) == "set")'

    # Same column through `owner` (explicit null): string(null) errors, so null rows deny too.
    - actions: ["cast-not-string-null"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(string(R.attr.owner) == "set")'

    # h5 is not a timestamp: the conversion error denies under negation. a2 allowed, a1 denied.
    - actions: ["cast-not-timestamp"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(timestamp(R.attr.createdBy) < timestamp("2025-01-01T00:00:00Z"))'

    # The double() version: h4 allowed; prefix parsing would over-grant malformed strings.
    - actions: ["cast-not-double"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(double(R.attr.aString) > 50.0)'

    # ==================== indexed elements of number and boolean lists ====================
    # Does an adapter keep a number or boolean element's type? Most seeds hold [], where any
    # index errors. a1 [2] and a3 [2, 3] lead with 2. Traps: a4 [3, 2], a5 [-2], a7 [20],
    # c1 [0], and a6 [null, 2], whose null element is a value (null == 2 is false).
    - actions: ["index-number-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumberList[0] == 2'

    # Oracle a4/a5/a6/a7/b4/c1: a first element other than 2, including null; no empty lists.
    - actions: ["index-number-list-not-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aNumberList[0] == 2)'

    # a1, b4 and c1 lead with true; a3 and a5 with false; a4 with null.
    - actions: ["index-bool-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBoolList[0] == true'

    # Oracle a3/a4/a5.
    - actions: ["index-bool-list-not-eq"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(R.attr.aBoolList[0] == true)'

    # Boolean element vs a number: false in CEL, but SQLite and MySQL store true as 1 and would
    # return b4 and c1. The a1 branch (aNumber 5) keeps the oracle live.
    - actions: ["index-bool-list-vs-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBoolList[0] == 1 || R.attr.aNumber == 5'

    # Mirror: number element vs boolean. b4 [1] catches a 1-for-true reading. Oracle a1.
    - actions: ["index-number-list-vs-bool"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumberList[0] == true || R.attr.aNumber == 5'

    # -- rule composition (#487) --
    # These let the PLANNER build composed roots from separate rules: ALLOW + DENY becomes
    # and(X, not(Y)), several ALLOWs become or(...), and derived roles and variables are
    # expanded. Every DENY reads a column that is never NULL; see conformance/README.md,
    # "Rule composition".

    # and(not(gt), eq): conditional ALLOW + conditional DENY. Oracle: aBool true and aNumber <= 10.
    - actions: ["compose-allow-deny"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aBool == true

    - actions: ["compose-allow-deny"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber > 10

    # or(and, and): two conditional ALLOWs. a1 and b4 each satisfy half of each branch.
    - actions: ["compose-multi-allow"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.aBool == true
              - expr: R.attr.aNumber > 15

    - actions: ["compose-multi-allow"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.aBool == false
              - expr: R.attr.aNumber < 7

    # and(not(gt), or(and, and)): the DENY is hoisted over the disjunction. h5/h6/h7 are denied here.
    - actions: ["compose-multi-allow-deny"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.aBool == true
              - expr: R.attr.aNumber > 15

    - actions: ["compose-multi-allow-deny"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          all:
            of:
              - expr: R.attr.aBool == false
              - expr: R.attr.aNumber < 7

    - actions: ["compose-multi-allow-deny"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber > 20

    # or(gt, not(eq)): every aBool-false row plus h5/h6/h7.
    - actions: ["compose-or-not"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber > 20

    - actions: ["compose-or-not"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          none:
            of:
              - expr: R.attr.aBool == true

    # not(lt): unconditional ALLOW + conditional DENY, the most common real policy. a2/a5/b3
    # are denied.
    - actions: ["compose-deny-only"]
      effect: EFFECT_ALLOW
      roles: ["USER"]

    - actions: ["compose-deny-only"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber < 0

    # and(not(or(eq, gt)), ge): two DENYs under one negation. Oracle: aNumber in [0, 18] and
    # aBool true.
    - actions: ["compose-two-deny"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber >= 0

    - actions: ["compose-two-deny"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aBool == false

    - actions: ["compose-two-deny"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber > 18

    # and(lt, eq): a derived role whose condition reads the resource (aBool true). a2/a5 witness it.
    - actions: ["compose-derived-role"]
      effect: EFFECT_ALLOW
      derivedRoles: ["compose_flagged"]
      condition:
        match:
          expr: R.attr.aNumber < 5

    # and(not(eq), lt): an unconditional DENY for that role. Oracle: aBool false and aNumber < 12.
    - actions: ["compose-derived-deny"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: R.attr.aNumber < 12

    - actions: ["compose-derived-deny"]
      effect: EFFECT_DENY
      derivedRoles: ["compose_flagged"]

    # and(not(gt), in): ALLOW and DENY through variables. Oracle a1/a6/b2/h4; h1/h2/h3/h5 are
    # denied by compose_large.
    - actions: ["compose-variable"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: V.compose_teamed

    - actions: ["compose-variable"]
      effect: EFFECT_DENY
      roles: ["USER"]
      condition:
        match:
          expr: V.compose_large

    # ==================== membership in number and boolean lists ====================
    # CEL equality is heterogeneous: "2" == 2 and "true" == true are false. Stores that coerce
    # types disagree: Elasticsearch coerces terms, and SQLite/MySQL read JSON true as 1 (#496).

    # Same-type baseline, so the cross-type probes cannot pass by refusing everything.
    # Oracle a1/a3/a4/a6; a5 [-2], a7 [20] and c1 [0] must not match.
    - actions: ["in-number-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '2 in R.attr.aNumberList'

    # A string spelling a number element: false in CEL. A coercing store returns a1/a3/a4/a6.
    # Oracle a1, from the aNumber branch.
    - actions: ["in-number-list-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"2" in R.attr.aNumberList || R.attr.aNumber == 5'

    # "true" is not true. A coercing store returns every list holding true. Oracle a1.
    - actions: ["in-bool-list-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '"true" in R.attr.aBoolList || R.attr.aNumber == 5'

    # Mixed-type literal list: "2" never matches, 3 can. Oracle a3/a4; coercion adds a1/a6.
    - actions: ["hasint-number-list-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.aNumberList, ["2", 3])'

    # No element of the right type: false in CEL. Oracle a1, from the aNumber branch.
    - actions: ["hasint-bool-list-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.aBoolList, ["true"]) || R.attr.aNumber == 5'

    # ==================== cross-type comparisons on scalar attributes ====================
    # The same question for single attributes and a nested sub-field. `5 == "5"` is false in
    # CEL; Elasticsearch, Mongoose, SQLite, H2 and MySQL may coerce, and MySQL reads a
    # non-numeric string as 0 (#496).

    # Oracle a3/a8 (aNumber 2); a coercing store adds a1 (aNumber 5).
    - actions: ["eq-number-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber == "5" || R.attr.aNumber == 2'

    # The negation under-grants: `5 != "5"` is true, so a coercing store drops a1.
    - actions: ["ne-number-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber != "5" && R.attr.aNumber > 3'

    # A coercing store returns every aBool-true row. Oracle a1.
    - actions: ["eq-bool-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aBool == "true" || R.attr.aNumber == 5'

    # Number vs string attribute: h4 ("0") matches under text conversion; MySQL matches most rows. Oracle a1.
    - actions: ["eq-string-vs-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aString == 0 || R.attr.aNumber == 5'

    # Mixed list against aNumber: 2 can match, "5" cannot. Oracle a3/a8; coercion adds a1.
    - actions: ["in-scalar-number-vs-string"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.aNumber in ["5", 2]'

    # Number vs a tag-name string: false in CEL, but MySQL reads names as 0. Oracle a1.
    - actions: ["exists-tag-name-vs-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'R.attr.tags.exists(t, t.name == 0) || R.attr.aNumber == 5'

    # map() form: "public" matches, 0 cannot. MySQL adds every other tag; H2 fails to execute.
    - actions: ["hasint-map-vs-number"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'hasIntersection(R.attr.tags.map(t, t.name), ["public", 0])'

    # `null in [null, 2]` is true (a6). MySQL's JSON_TABLE turns the null into SQL NULL. Oracle a6.
    - actions: ["null-in-number-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: 'null in R.attr.aNumberList'

    # Negation: every row but a6, empty lists included.
    - actions: ["not-null-in-number-list"]
      effect: EFFECT_ALLOW
      roles: ["USER"]
      condition:
        match:
          expr: '!(null in R.attr.aNumberList)'
