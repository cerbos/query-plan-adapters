spring:
  datasource:
    url: jdbc:h2:mem:photos;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.format_sql: true
    open-in-view: false

# The Cerbos PDP's gRPC address, as host:port. Set by scripts/smoke.sh and
# scripts/smoke-edge-cases.sh for the photo-sharing app, and by demo/scripts/run-example.sh for
# the demo-domain program next to it.
#
# There is deliberately NO DEFAULT. The obvious one — Cerbos's own 3593 — is the port every
# adapter's `cerbos run` test sidecar binds, so an unset CERBOS_HOST would not fail: it would
# quietly plan against the conformance corpus that sidecar serves and produce a wrong row set that
# reads as an adapter bug.
# The live demo runner injects a non-default CERBOS_HOST and executes every canonical case, so a
# hardcoded default cannot pass by inspection alone.
#
# Note that CERBOS_HOST here is a host:port pair, matching what the shared runner sets. The
# ADAPTER's own test suite reads a CERBOS_HOST/CERBOS_PORT pair instead (see ../../README.md);
# they are different processes and never share an environment.
cerbos:
  address: ${CERBOS_HOST}

logging:
  level:
    # LOCAL DEBUGGING ONLY — uncomment to see the SQL each authorization plan produces.
    # `org.hibernate.orm.jdbc.bind: TRACE` prints every JDBC bind parameter verbatim,
    # and the Cerbos planner constant-folds PRINCIPAL attributes (emails, departments,
    # owner ids — potentially PII) into the plan constants the adapter binds. Never
    # enable these loggers in production; see "SQL logging" in the README.
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
    dev.cerbos.example: INFO
