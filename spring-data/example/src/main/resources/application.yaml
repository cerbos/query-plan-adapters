spring:
  datasource:
    url: jdbc:h2:mem:photos;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.format_sql: true
    open-in-view: false

# The PDP's gRPC address as host:port, set by the smoke scripts and demo/scripts/run-example.sh.
# There is no default: Cerbos's default port may belong to another local PDP with other policies,
# and the wrong rows would look like an adapter bug. demo/scripts/validate-demo.sh rejects a
# hardcoded address.
cerbos:
  address: ${CERBOS_HOST}

logging:
  level:
    # Local debugging only: uncomment to see the SQL each plan produces. The bind logger prints
    # parameter values, which include principal attributes the planner folds into the plan and
    # may be personal data. Never enable these in production.
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
    dev.cerbos.example: INFO
