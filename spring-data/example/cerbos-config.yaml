server:
  httpListenAddr: ":3592"
  grpcListenAddr: ":3593"

storage:
  driver: "disk"
  disk:
    directory: /policies
    watchForChanges: true

telemetry:
  disabled: true

schema:
  enforcement: reject

# Audit logs on stdout, so `docker compose logs cerbos` shows each PlanResources call.
audit:
  enabled: true
  accessLogsEnabled: true
  decisionLogsEnabled: true
  backend: file
  file:
    path: stdout
