# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
#
# Photo-sharing example policy. What each user action exercises:
#
#   view, comment        : public and not archived, or owned (comment also allows a "friends" tag)
#   edit, delete         : owned
#   discover             : numeric comparison on a column and an embedded field
#   located              : null check on a nullable column
#   similar              : intersection with a principal list attribute
#   needs-moderation     : exists() over label entities
#   fully-reviewed       : all() over labels, including no labels
#   unlabelled           : size() over a relation
#   exactly-one-reviewed : exists_one() over a relation
#   percent/underscore-title : LIKE metacharacters matched literally
#   delegated-view, *group-grant : grant relation with nullable child fields
#
# The admin role is allowed every action except the edge-* ones.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: photo
  version: default
  rules:
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          any:
            of:
              - all:
                  of:
                    - expr: request.resource.attr.public == true
                    - expr: request.resource.attr.archived == false
              - expr: request.resource.attr.ownerId == request.principal.id

    - actions: ["edit", "delete"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: request.resource.attr.ownerId == request.principal.id

    - actions: ["comment"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          any:
            of:
              - all:
                  of:
                    - expr: request.resource.attr.public == true
                    - expr: request.resource.attr.archived == false
              - expr: '"friends" in request.resource.attr.tags'
              - expr: request.resource.attr.ownerId == request.principal.id

    - actions: ["discover"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.rating >= 4
              - expr: request.resource.attr.metadata.width >= 3000

    - actions: ["located"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: request.resource.attr.location != null

    - actions: ["similar"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: hasIntersection(request.resource.attr.tags, request.principal.attr.interests)

    - actions: ["needs-moderation"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: >
            request.resource.attr.labels.exists(label,
              label.name == "safety" && label.confidence >= 0.8)

    - actions: ["fully-reviewed"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: request.resource.attr.labels.all(label, label.reviewed == true)

    - actions: ["unlabelled"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: size(request.resource.attr.labels) == 0

    - actions: ["exactly-one-reviewed"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: request.resource.attr.labels.exists_one(label, label.reviewed == true)

    - actions: ["percent-title"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: 'request.resource.attr.title.contains("%")'

    - actions: ["underscore-title"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: 'request.resource.attr.title.contains("_")'

    # The application's tenant Specification is the outer boundary. The policy also checks the
    # tenant, and requires each grant's tenant to match its photo's.
    - actions: ["delegated-view"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: >
            request.resource.attr.tenantId == request.principal.attr.tenantId &&
            request.resource.attr.grants.exists(grant,
              grant.tenantId == request.resource.attr.tenantId &&
              grant.permission == "view" &&
              (grant.userId == request.principal.id ||
               grant.groupId in request.principal.attr.groups))

    # These three actions check that a null groupId is treated as unknown, not false. A photo
    # whose grants all have a null groupId matches neither group-grant nor no-group-grant; the
    # explicit null guard in no-group-grant-safe makes it match.
    - actions: ["group-grant"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: >
            request.resource.attr.tenantId == request.principal.attr.tenantId &&
            request.resource.attr.grants.exists(grant,
              grant.groupId in request.principal.attr.groups)

    - actions: ["no-group-grant"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: >
            request.resource.attr.tenantId == request.principal.attr.tenantId &&
            !request.resource.attr.grants.exists(grant,
              grant.groupId in request.principal.attr.groups)

    - actions: ["no-group-grant-safe"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: >
            request.resource.attr.tenantId == request.principal.attr.tenantId &&
            !request.resource.attr.grants.exists(grant,
              grant.groupId != null &&
              grant.groupId in request.principal.attr.groups)

    - actions:
        - "view"
        - "edit"
        - "delete"
        - "comment"
        - "discover"
        - "located"
        - "similar"
        - "needs-moderation"
        - "fully-reviewed"
        - "unlabelled"
        - "exactly-one-reviewed"
        - "percent-title"
        - "underscore-title"
        - "delegated-view"
        - "group-grant"
        - "no-group-grant"
        - "no-group-grant-safe"
      effect: EFFECT_ALLOW
      roles: ["admin"]

    # ------------------------------------------------------------------------
    # Edge-case regression scenarios
    #
    # Each edge-* action is a regression probe run against the "edge"-tenant
    # rows in SeedData.java by scripts/smoke-edge-cases.sh. Some expressions
    # are intentionally odd; they are not examples of how to write policy.
    # ------------------------------------------------------------------------

    # The adapter must not solve this as `score = -0.6`: in IEEE doubles
    # -0.6 + 0.7 is 0.09999999999999998. No seeded score satisfies it, so the
    # result is empty.
    - actions: ["edge-ieee-eq"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: request.resource.attr.score + 0.7 == 0.1

    # The negated form: the score = -0.6 row must be included.
    - actions: ["edge-ieee-ne"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: request.resource.attr.score + 0.7 != 0.1

    # 0.0 / 0.0 is NaN, and every comparison with NaN is false, so non-public
    # rows must not match.
    - actions: ["edge-nan-ordering"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: '(request.resource.attr.public ? 1.0 : 0.0 / 0.0) > 0.5'

    # A retention window. The planner folds `now() - duration(...)` to a
    # constant timestamp, and rows older than 24h match.
    - actions: ["edge-retention"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: timestamp(request.resource.attr.createdAt) < now() - duration("24h")

    # LIKE escaping must cover SQL Server's `[...]` character class: match a
    # literal "[SEC]" prefix, not the "Secret..." row.
    - actions: ["edge-bracket-title"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: request.resource.attr.title.startsWith("[SEC]")

    # A size() threshold above the int range must not be truncated (2^32
    # would become 0). No title is that long, so the result is empty.
    - actions: ["edge-size-huge"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: size(request.resource.attr.title) > 4294967296
