# Cerbos PDP for the photo-sharing app, serving ./policies. The demo-domain program uses
# demo/docker-compose.yml instead.
#
#   docker compose up -d                                   # start the PDP
#   CERBOS_HOST=localhost:23593 ../gradlew bootRun         # the Spring Boot app on :8080
#   docker compose logs cerbos                             # PlanResources decision logs
#   docker compose down
services:
  cerbos:
    # Must match `current` in conformance/pdp-versions.json (tag and digest); validate-corpus.sh
    # checks both.
    image: ghcr.io/cerbos/cerbos:0.55.0@sha256:4b9d3b58c4f11c1b8953bc798d8d086e64f276882253ab169625fddc7f432515
    container_name: cerbos-photos-example
    command:
      - "server"
      - "--config=/config/cerbos-config.yaml"
    environment:
      CERBOS_NO_TELEMETRY: "1"
      CERBOS_CONFIG: "/config/cerbos-config.yaml"
    # Host ports differ from the Cerbos defaults and from demo/docker-compose.yml, so a client
    # cannot reach another local PDP by mistake.
    ports:
      - "23592:3592"
      - "23593:3593"
    volumes:
      - ./cerbos-config.yaml:/config/cerbos-config.yaml:ro
      - ./policies:/policies:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
