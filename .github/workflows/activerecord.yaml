name: ActiveRecord Test

# No `policies/**` trigger: conformance/policies/ is the only policy suite (ADR 0008).
on:
  pull_request:
    paths:
      - "activerecord/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/activerecord.yaml"
      - ".github/workflows/activerecord-publish.yaml"
  push:
    tags:
      - activerecord/v*

# A newer push to the same pull request makes this run's result moot, so cancel it rather than
# let it finish. Only pull_request runs are ever cancelled; every other trigger runs to the end.
concurrency:
  group: activerecord-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: activerecord

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]
        activerecord-version: ["8.0"]
        include:
          # Low end of the gemspec's ActiveRecord range. The Gemfile pins each leg's minor.
          - ruby-version: "3.3"
            activerecord-version: "7.1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      # Suites run in Docker; scripts/test.sh reads the PDP pin from conformance/. Don't
      # hardcode it here.
      #
      # Both suites are offline (no PDP). They carry the ActiveRecord dimension because the
      # golden SQL depends on the ActiveRecord version (see RENDERING_DIFFERS_ON_ACTIVERECORD_71
      # in spec/translator_spec.rb).
      - name: Run the translator unit test and the adapter contract suite
        env:
          RUBY_VERSION: ${{ matrix.ruby-version }}
          ACTIVERECORD_VERSION: ${{ matrix.activerecord-version }}
        run: ./scripts/test.sh spec/translator_spec.rb spec/adapter_contract_spec.rb

      # Keep this in the same job as the tests. Baseline leg only: the corpus tests the
      # translator and store, not the Ruby version.
      - name: Run the adversarial differential suite
        if: matrix.ruby-version == '4.0' && matrix.activerecord-version == '8.0'
        env:
          RUBY_VERSION: ${{ matrix.ruby-version }}
          ACTIVERECORD_VERSION: ${{ matrix.activerecord-version }}
        run: |
          for strict in false true; do
            ADAPTER_TEST_STRICT_EVALUATION="$strict" ./scripts/test.sh spec/adversarial_conformance_spec.rb
          done

      - name: Lint
        if: matrix.ruby-version == '4.0' && matrix.activerecord-version == '8.0'
        run: ./scripts/lint.sh

      - name: Docs
        if: matrix.ruby-version == '4.0' && matrix.activerecord-version == '8.0'
        run: ./scripts/docs.sh

  # Keep this job in this workflow. Renovate automerges non-major bumps, and this job is the
  # PR check that blocks an ActiveRecord bump that breaks real usage.
  # One Ruby version only: the demo tests the gem and the ORM, not the Ruby version.
  example:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      # No `bundler-cache`: the example has no Gemfile.lock on purpose. The gem run.sh builds
      # has no stable checksum, and fresh resolution picks up new ActiveRecord releases.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"

      # run-example.sh starts the pinned PDP from demo/docker-compose.yml. No
      # cerbos-setup-action: the example reaches the PDP the way a deployed app does.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh activerecord
