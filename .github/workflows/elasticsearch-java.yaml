name: Elasticsearch Java Test

on:
  pull_request:
    paths:
      - "elasticsearch-java/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/elasticsearch-java.yaml"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"
  push:
    tags:
      - elasticsearch-java/v*

# A newer push to the same pull request makes this run's result moot, so cancel it rather than
# let it finish. Only pull_request runs are ever cancelled; every other trigger runs to the end.
concurrency:
  group: elasticsearch-java-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: elasticsearch-java

permissions: {}

jobs:
  # All suites run here, including the conformance harness (CLAUDE.md, "CI").
  test:
    permissions:
      contents: read
    strategy:
      # A failed next-major leg should not cancel the baseline leg.
      fail-fast: false
      matrix:
        java-version: ["17", "21"]
        # Files under elasticsearch-java/ holding the pinned image, so no image is restated here.
        # The `_IMAGE` suffix is what validate-corpus.sh scans.
        elasticsearch-image-file:
          - ELASTICSEARCH_IMAGE
          - ELASTICSEARCH_NEXT_IMAGE
        # The server leg only needs the baseline JDK.
        exclude:
          - elasticsearch-image-file: ELASTICSEARCH_NEXT_IMAGE
            java-version: "21"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          # Must match the key warm-caches.yaml writes on main.
          cache: gradle
          cache-dependency-path: |
            elasticsearch-java/**/*.gradle*
            elasticsearch-java/**/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # build.gradle.kts forwards ELASTICSEARCH_IMAGE_FILE to the suites and declares it as an input.
      # `build` runs the conformance harness too: it replays the recorded goldens against
      # Elasticsearch, with no PDP.
      - name: Build and test (${{ matrix.elasticsearch-image-file }})
        run: ./gradlew build --no-daemon
        env:
          ELASTICSEARCH_IMAGE_FILE: ${{ matrix.elasticsearch-image-file }}

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "Reports for Java ${{ matrix.java-version }} (${{ matrix.elasticsearch-image-file }})"
          path: |-
            **/build/reports/
            **/build/test-results/

  # The example installs the published artifact and drives it with the Elasticsearch Java client,
  # which no suite in `test` does. See docs/adr/0002-examples-install-the-packed-artifact.md.
  # Keep this job in this workflow: it is what blocks Renovate's automerge of a breaking bump.
  example:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Check the PDP and Elasticsearch pins before running against them.
      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # The adapter's floor.
          java-version: "17"
          # Must match the key warm-caches.yaml writes on main.
          cache: gradle
          cache-dependency-path: |
            elasticsearch-java/**/*.gradle*
            elasticsearch-java/**/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # run.sh publishes the adapter to mavenLocal and starts Elasticsearch itself.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh elasticsearch-java

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "Reports for the example"
          path: |-
            **/build/reports/
            **/build/test-results/
