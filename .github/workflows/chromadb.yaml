name: ChromaDB Test

on:
  pull_request:
    # `policies/**` is deliberately absent: nothing under langchain-chromadb/ reads the shared
    # policy suite any more. The translator unit test reads conformance/wire-fixtures/ and this
    # adapter's own golden/expectations.json, and the adversarial suite loads
    # conformance/policies/.
    paths:
      - "langchain-chromadb/**"
      - "conformance/**"
      - ".github/workflows/chromadb.yaml"
      - ".github/workflows/chromadb-publish.yaml"
  push:
    tags:
      - langchain-chromadb/v*

defaults:
  run:
    working-directory: langchain-chromadb

jobs:
  test:
    strategy:
      # The adversarial suite now shares this matrix, so the default fail-fast would let an
      # unrelated Node leg cancel the baseline leg mid-corpus and report it as "cancelled" —
      # neither a pass nor a failure for the repo's load-bearing signal.
      fail-fast: false
      matrix:
        node-version: ["22", "24", "25"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      # Only the adversarial suite needs a PDP and a vector store: `npm test` is the translator
      # unit test, which reads its plans from conformance/wire-fixtures/ — replanned and diffed
      # against this same pinned version by the `Conformance Corpus` workflow — and its expected
      # filters from golden/expectations.json. Both setup steps are therefore gated to the
      # baseline Node leg, the one the adversarial step below runs on.
      - name: Read pinned Cerbos version
        if: matrix.node-version == '22'
        id: cerbos
        run: echo "version=$(tr -d '[:space:]' < ../conformance/CERBOS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Cerbos
        if: matrix.node-version == '22'
        uses: cerbos/cerbos-setup-action@f772482c8504a05c49018a0bf2d84012a607733c # v1
        with:
          version: v${{ steps.cerbos.outputs.version }}

      # The image is read from langchain-chromadb/CHROMA_IMAGE rather than restated here: the
      # `npm run chroma` helper developers use locally reads the same file, and a matrix entry
      # that drifted from it would prove the adapter against a different server than anyone
      # reproducing a failure locally.
      - name: Start ChromaDB
        if: matrix.node-version == '22'
        run: |
          docker run -d --name chromadb -p 8000:8000 "$(cat CHROMA_IMAGE)"
          for _ in {1..30}; do
            if curl -sf http://127.0.0.1:8000/api/v2/heartbeat > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "ChromaDB failed to start" >&2
          exit 1

      - name: Test using Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm run typecheck
      - run: npm test

      # The adversarial corpus is a property of the translator, not of the Node runtime, so it
      # runs on the baseline leg only — the same single execution the standalone `adversarial`
      # job used to perform, minus the duplicated checkout, Cerbos install, ChromaDB start and
      # `npm install`.
      - name: Run adversarial differential suite
        if: matrix.node-version == '22'
        run: npm run test:adversarial:cerbos
        env:
          CHROMA_URL: http://127.0.0.1:8000

      - name: Stop ChromaDB
        if: always() && matrix.node-version == '22'
        run: docker rm -f chromadb
