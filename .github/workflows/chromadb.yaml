name: ChromaDB Test

on:
  pull_request:
    paths:
      - "langchain-chromadb/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/chromadb.yaml"
      - ".github/workflows/chromadb-publish.yaml"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"
  # Release tags invoke these same checks through the publish workflow.
  workflow_call:

# A newer push to the same pull request makes this run's result moot, so cancel it rather than
# let it finish. Only pull_request runs are ever cancelled; every other trigger runs to the end.
concurrency:
  group: chromadb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: langchain-chromadb

jobs:
  test:
    strategy:
      # The conformance harness shares this matrix, so the default fail-fast would let an
      # unrelated Node leg cancel the baseline leg mid-corpus and report it as "cancelled" —
      # neither a pass nor a failure for the repo's load-bearing signal.
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      # Only the conformance harness needs a server: it replays the recorded goldens
      # (conformance/golden/) against ChromaDB and needs no PDP. `npm test` is the offline unit
      # suite. The server is therefore gated to the baseline Node leg, the one the conformance step
      # below runs on.
      #
      # The image is read from langchain-chromadb/CHROMA_IMAGE rather than restated here: the
      # `npm run chroma` helper developers use locally reads the same file, and a matrix entry
      # that drifted from it would prove the adapter against a different server than anyone
      # reproducing a failure locally.
      - name: Start ChromaDB
        if: matrix.node-version == '22'
        run: |
          docker run -d --name chromadb -p 8000:8000 "$(cat CHROMA_IMAGE)"
          for _ in {1..30}; do
            if curl -sf http://127.0.0.1:8000/api/v2/heartbeat > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "ChromaDB failed to start" >&2
          exit 1

      - name: Test using Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          # Keyed on both lockfiles so every job in this workflow shares one entry, which the
          # `Warm Caches` workflow writes on main — the only scope every pull request can read.
          cache: npm
          cache-dependency-path: |
            langchain-chromadb/package-lock.json
            langchain-chromadb/example/package-lock.json

      - run: npm install
      - run: npm run typecheck
      - run: npm test

      # The conformance corpus discriminates the translator and the store, not the Node runtime, so
      # it runs on the baseline Node leg only.
      - name: Run conformance harness
        if: matrix.node-version == '22'
        run: npm run test:adversarial
        env:
          CHROMA_URL: http://127.0.0.1:8000

      - name: Stop ChromaDB
        if: always() && matrix.node-version == '22'
        run: docker rm -f chromadb

  # The example application: the published package, installed from `npm pack`'s tarball and used
  # the way a consumer uses it, against the shared demo domain. It covers the two things the job
  # above structurally cannot — the packaging surface (`exports`, `types`, the `files` allowlist,
  # the `@cerbos/core` peer range), which both suites bypass by importing from `"."`, and the usage
  # shapes past a single flat query (a limit walked to the end of the result set, and composing the
  # adapter's filter with the application's own). See cerbos/query-plan-adapters#349 and
  # docs/adr/0002-examples-install-the-packed-artifact.md.
  #
  # THIS JOB MUST STAY IN THIS WORKFLOW. `renovate.json` sets `automerge: true` for every
  # non-major bump, and that is the path a ChromaDB client regression takes into `main` today.
  # Because the example's lockfile is committed and Renovate manages it, a `chromadb` bump arrives
  # as ONE PR touching both langchain-chromadb/package.json and
  # langchain-chromadb/example/package.json — and this job, being a check on that PR, is what
  # blocks the automerge when the new client breaks real usage. Moving it to a nightly run or a
  # workflow of its own silently restores that gap.
  #
  # One Node leg only: the demo domain discriminates the package and the client, not the runtime —
  # the same reasoning that gates the conformance step above to Node 22.
  #
  # No ChromaDB is started here, unlike the job above: the example's own run.sh starts one, on
  # 18234 rather than 8234, because bringing the store up is part of what a consumer does.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # Keyed on both lockfiles so every job in this workflow shares one entry, which the
          # `Warm Caches` workflow writes on main — the only scope every pull request can read.
          cache: npm
          cache-dependency-path: |
            langchain-chromadb/package-lock.json
            langchain-chromadb/example/package-lock.json

      - run: npm install

      # The PDP is a container started by the runner from demo/docker-compose.yml, pinned to
      # `current` in conformance/pdp-versions.json (tag and digest) — no cerbos-setup-action
      # here, because an example must reach the PDP the way a deployed application does.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh langchain-chromadb
