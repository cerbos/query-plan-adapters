name: ActiveRecord Publish

on:
  push:
    tags:
      - activerecord/v*

defaults:
  run:
    working-directory: activerecord

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      # Trusted publishing to RubyGems, so no API key is stored in secrets.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `defaults.run.working-directory` only affects `run` steps, so these actions need
      # their own `working-directory` to find the Gemfile.
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: activerecord

      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          await-release: false
          working-directory: activerecord
