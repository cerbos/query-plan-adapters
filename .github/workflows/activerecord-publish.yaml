name: ActiveRecord Publish

on:
  push:
    tags:
      - activerecord/v*

defaults:
  run:
    working-directory: activerecord

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      # Trusted publishing to RubyGems. Thus the repository secrets hold no permanent API
      # key.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@bb6434c747fa7022e12fa1cae9c0542717d0dc2a # v1.253.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: rubygems/release-gem@612653d273a73bdae1df8453e090060bb4db5019 # v1.0.0
        with:
          await-release: false
