name: ActiveRecord Publish

on:
  push:
    tags:
      - activerecord/v*

defaults:
  run:
    working-directory: activerecord

permissions: {}

jobs:
  # A local call runs the full adapter matrix and example at this release's commit.
  test:
    uses: ./.github/workflows/activerecord.yaml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      # Trusted publishing to RubyGems, so no API key is stored in secrets.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `defaults.run.working-directory` only affects `run` steps, so these actions need
      # their own `working-directory` to find the Gemfile.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: activerecord

      # The tag names the version; the gem must agree, or the gem pushed is not the one tagged.
      - name: Check the tag against the gem version
        run: |
          version="$(ruby -e 'print Gem::Specification.load(ARGV[0]).version' cerbos-activerecord.gemspec)"
          [[ "activerecord/v${version}" == "${GITHUB_REF_NAME}" ]] \
            || { echo "tag ${GITHUB_REF_NAME} does not match gem version ${version}" >&2; exit 1; }

      - uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1.4.0
        with:
          await-release: false
          working-directory: activerecord
