name: Mongoose Test

on:
  pull_request:
    paths:
      - "mongoose/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/mongoose.yaml"
      - ".github/workflows/mongoose-publish.yaml"
  push:
    tags:
      - mongoose/v*

defaults:
  run:
    working-directory: mongoose

jobs:
  certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/validate-adapterctl
        with:
          adapter: mongoose

  test:
    strategy:
      # The adversarial suite now shares this matrix, so the default fail-fast would let an
      # unrelated Node leg cancel a baseline leg mid-corpus and report it as "cancelled" —
      # neither a pass nor a failure for the repo's load-bearing signal.
      fail-fast: false
      matrix:
        # Pinned by tag AND digest. `supercharge/mongodb-github-action` took a bare version
        # string and resolved `mongo:<version>` at run time, so the server a green run proved
        # the adapter against was whatever the tag pointed at that morning — and the corpus
        # discriminates server behaviour, which is the whole reason this dimension exists.
        # Starting the container directly is what makes the digest expressible.
        #
        # The references themselves live in mongoose/MONGO_IMAGE and mongoose/MONGO_NEXT_IMAGE,
        # so this dimension is a list of FILENAMES and no image is restated here. `npm run mongo`
        # and mongoose/example/run.sh read MONGO_IMAGE too, and a matrix entry that drifted from
        # it would prove the adapter against a different server than anyone reproducing a failure
        # locally — the same argument as langchain-chromadb/CHROMA_IMAGE, which is the precedent
        # this follows. A matrix value cannot be a `$(cat …)`, so the alternative was to restate
        # the baseline here and leave the two copies free to name different TAGS:
        # conformance/scripts/validate-corpus.sh holds every reference to one digest per tag, but
        # nothing holds two tags equal.
        #
        # MONGO_IMAGE is the baseline: the server the adapter is developed against, and the only
        # one the example runs. MONGO_NEXT_IMAGE is the forward-compatibility leg, deliberately a
        # different major and read by nothing else. Both names end in `_IMAGE` because that suffix
        # is what validate-corpus.sh's `--include='*_IMAGE'` scans; a `MONGO_IMAGE_NEXT` would be
        # a pin nothing checks.
        mongodb-image-file:
          - MONGO_IMAGE
          - MONGO_NEXT_IMAGE
        node-version: ["22", "24", "25"]
        # The server dimension only discriminates the adversarial suite, which is gated to the
        # baseline Node leg — so off that leg the two server legs would run byte-identical work
        # (a typecheck and an offline unit test that never opens a connection). Excluding them
        # keeps the coverage and drops two runners.
        exclude:
          - mongodb-image-file: MONGO_NEXT_IMAGE
            node-version: "24"
          - mongodb-image-file: MONGO_NEXT_IMAGE
            node-version: "25"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      # Only the adversarial suite needs a PDP and a server: the translator unit test reads its
      # plans from conformance/wire-fixtures/, which the `Conformance Corpus` workflow replans and
      # diffs against this same pinned version. The native profile command below owns the server;
      # the Cerbos binary remains workflow setup because the low-level npm suite launches it.
      - name: Read pinned Cerbos version
        if: matrix.node-version == '22'
        id: cerbos
        run: echo "version=$(tr -d '[:space:]' < ../conformance/CERBOS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Cerbos
        if: matrix.node-version == '22'
        uses: cerbos/cerbos-setup-action@30ad92b0242d792bd156985682426577fcfcc589 # v1
        with:
          version: v${{ steps.cerbos.outputs.version }}

      - name: Test using Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm run typecheck
      - run: npm run test

      # The adversarial corpus discriminates MongoDB server behaviour, not the Node runtime, so
      # it runs once per server version on the baseline Node leg — the same two executions the
      # standalone `adversarial` job used to perform, minus the duplicated checkout, Cerbos
      # install, MongoDB start and `npm install`.
      # These are deliberately two exact native commands rather than one interpolated command:
      # each label remains mechanically tied to the pinned image file it claims, and adapterctl
      # validates the same command markers the workflow actually executes.
      - name: Run adversarial differential suite (MongoDB 7.0)
        if: matrix.node-version == '22' && matrix.mongodb-image-file == 'MONGO_IMAGE'
        run: bash scripts/test-adversarial.sh MONGO_IMAGE

      - name: Run adversarial differential suite (MongoDB 8.0)
        if: matrix.node-version == '22' && matrix.mongodb-image-file == 'MONGO_NEXT_IMAGE'
        run: bash scripts/test-adversarial.sh MONGO_NEXT_IMAGE

  # The example application: the published package, installed from `npm pack`'s tarball and used
  # the way a consumer uses it, against the shared demo domain. It covers the two things the
  # suites above structurally cannot — the packaging surface (`exports`, `types`, the `files`
  # allowlist), which every harness bypasses by importing from `"."`, and the
  # usage shapes past a single flat query (pagination, and composing the adapter's filter with
  # the application's own). See cerbos/query-plan-adapters#349 and
  # docs/adr/0002-examples-install-the-packed-artifact.md.
  #
  # THIS JOB MUST STAY IN THIS WORKFLOW. `renovate.json` sets `automerge: true` for every
  # non-major bump, and that is the path an ORM regression takes into `main` today. Because the
  # example's lockfile is committed and Renovate manages it, a Mongoose bump arrives as ONE PR
  # touching both mongoose/package.json and mongoose/example/package.json — and this job, being a
  # check on that PR, is what blocks the automerge when the new ORM breaks real usage. Moving it
  # to a nightly run or a workflow of its own silently restores that gap.
  #
  # One Node leg and one MongoDB server: the demo domain discriminates the package and the ORM
  # client, not the runtime and not the server. The server dimension in `test` above exists
  # because the corpus discriminates server BEHAVIOUR — three-valued logic, BSON ordering, regex
  # handling — which is semantics, and already covered there. This proves plumbing. No `services:`
  # block or MongoDB step here either: `mongoose/example/run.sh` starts its own server, reading
  # mongoose/MONGO_IMAGE — the same file the baseline leg of `test` reads — so the example is one
  # command on a laptop as well as in CI, and bumping the baseline moves both at once.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm install

      # The PDP is a container started by the runner from demo/docker-compose.yml, pinned to
      # conformance/CERBOS_VERSION and conformance/CERBOS_IMAGE_DIGEST — no cerbos-setup-action
      # here, because an example must reach the PDP the way a deployed application does.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh mongoose
