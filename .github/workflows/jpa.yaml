name: JPA Test

on:
  pull_request:
    paths:
      - "jpa/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/jpa.yaml"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"
  push:
    tags:
      - jpa/v*

# A newer push to the same pull request makes this run's result moot, so cancel it rather than
# let it finish. Only pull_request runs are ever cancelled; every other trigger runs to the end.
concurrency:
  group: jpa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: jpa

permissions: {}

jobs:
  # All suites run here on H2, including the conformance suite, which replays the recorded golden
  # plans of both pinned PDPs (conformance/golden/) and needs no PDP (docs/ci.md).
  test:
    permissions:
      contents: read
    strategy:
      # A failed `next` leg should not cancel the baseline leg.
      fail-fast: false
      matrix:
        java-version: ["17", "21"]
        # ORM version sets declared in build.gradle.kts. `next` is Hibernate 7.
        orm: [baseline, next]
        # The ORM leg only needs the baseline JDK.
        exclude:
          - orm: next
            java-version: "21"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          # Must match the key warm-caches.yaml writes on main.
          cache: gradle
          cache-dependency-path: |
            jpa/**/*.gradle*
            jpa/**/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # build.gradle.kts forwards ADAPTER_TEST_ORM to the suites and declares it as an input.
      - name: Build and test (${{ matrix.orm }})
        run: ./gradlew build --no-daemon
        env:
          ADAPTER_TEST_ORM: ${{ matrix.orm }}

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "Reports for Java ${{ matrix.java-version }} (${{ matrix.orm }})"
          path: |-
            **/build/reports/
            **/build/test-results/

  # AdversarialConformanceTest on a real database, for dialect behaviour H2
  # cannot show, such as MySQL collation (README.md "Database collation requirements"). MySQL runs
  # with client-side and with server-side prepared statements (README.md "MySQL: keeping arithmetic
  # IEEE-faithful"). Every store leg runs under both ORM sets: Hibernate renders the SQL each store
  # executes, so a leg one ORM set skips is a store that ORM set does not cover.
  test-database:
    permissions:
      contents: read
    strategy:
      # Each store leg is a separate finding.
      fail-fast: false
      matrix:
        # ORM version sets declared in build.gradle.kts. `next` is Hibernate 7.
        orm: [baseline, next]
        database: [postgres, mysql]
        server-prep-stmts: [""]
        # Each entry changes server-prep-stmts, so it adds a MySQL leg rather than altering one:
        # six legs in all.
        include:
          - orm: baseline
            database: mysql
            server-prep-stmts: "true"
          - orm: next
            database: mysql
            server-prep-stmts: "true"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          # Must match the key warm-caches.yaml writes on main.
          cache: gradle
          cache-dependency-path: |
            jpa/**/*.gradle*
            jpa/**/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Only AdversarialConformanceTest reads ADAPTER_TEST_DB; the `test` job runs the other suites.
      - name: Conformance suite (${{ matrix.database }}, ${{ matrix.orm }})
        run: ./gradlew test --tests '*AdversarialConformanceTest' --no-daemon
        env:
          ADAPTER_TEST_ORM: ${{ matrix.orm }}
          ADAPTER_TEST_DB: ${{ matrix.database }}
          ADAPTER_TEST_MYSQL_SERVER_PREP_STMTS: ${{ matrix.server-prep-stmts || '' }}

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "Reports for ${{ matrix.database }} (${{ matrix.orm }})${{ matrix.server-prep-stmts && ' (server prepared statements)' || '' }}"
          path: |-
            **/build/reports/
            **/build/test-results/

  # The example installs the published artifact and runs the demo domain with plain Hibernate,
  # paged and composed, which no suite above does. See
  # docs/adr/0002-examples-install-the-packed-artifact.md.
  # Keep this job in this workflow: it is what blocks Renovate's automerge of a breaking bump.
  example:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Check the PDP pins in both compose files before running against them.
      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          # Must match the key warm-caches.yaml writes on main.
          cache: gradle
          cache-dependency-path: |
            jpa/**/*.gradle*
            jpa/**/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # run.sh publishes the adapter to mavenLocal and resolves it from there.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh jpa

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "Reports for the example"
          path: |-
            **/build/reports/
            **/build/test-results/
