name: Conformance Corpus

# No branch filter on pull_request: like the adapter workflows, this must also run on PRs
# targeting non-main bases (e.g. stacked PRs).
on:
  pull_request:
    paths:
      - "conformance/**"
      - ".github/workflows/conformance.yaml"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - "conformance/**"
      - ".github/workflows/conformance.yaml"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"

# A newer push to the same pull request makes this run's result moot, so cancel it rather than
# let it finish. Only pull_request runs are ever cancelled; every other trigger runs to the end.
concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Capture both evaluation modes independently. Offline translator tests consume the
  # default fixtures; live adapter harnesses plan against their own same-mode PDP.
  # Replanning here detects planner drift before adapter expectations are refreshed.
  fixtures:
    name: Corpus validity and wire-fixture drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: conformance/scripts/validate-corpus.sh

      # validate-corpus.sh proves every restatement in the repository agrees with CERBOS_VERSION
      # and CERBOS_IMAGE_DIGEST; it cannot prove the PAIR is right, because that needs a registry.
      # This is the job that owns the pinned-PDP contract, and it already has network and Docker,
      # so the tag/digest correspondence is asserted here — once, rather than in every adapter
      # workflow, which runs validate-corpus.sh offline.
      - name: Verify the pinned Cerbos digest matches its tag
        run: conformance/scripts/verify-cerbos-digest.sh

      # Mutates conformance/wire-fixtures/ in place, replanning every action in actions.json
      # against the PDP version pinned in conformance/CERBOS_VERSION.
      - name: Verify evaluation modes and planner limitations
        run: conformance/scripts/check-evaluation-modes.sh

      - name: Regenerate golden wire fixtures (default and strict)
        run: conformance/scripts/regenerate-wire-fixtures.sh

      - name: Check golden wire fixtures are up to date
        run: |
          # --intent-to-add stages any *new* fixture as an empty blob so `git diff` reports it;
          # plain `git diff` ignores untracked files and would miss an added action. Deleted
          # fixtures already show up in `git diff` because they are tracked.
          git add --intent-to-add conformance/wire-fixtures conformance/wire-fixtures-strict
          if git diff --exit-code -- conformance/wire-fixtures conformance/wire-fixtures-strict; then
            exit 0
          fi
          echo
          echo "::error::Golden wire fixtures are out of date with the pinned Cerbos PDP."
          echo "The PDP at the version in conformance/CERBOS_VERSION returns different wire"
          echo "output than conformance/wire-fixtures/ records. If this is an intentional PDP"
          echo "upgrade, run:"
          echo
          echo "    ./conformance/scripts/regenerate-wire-fixtures.sh"
          echo
          echo "locally and commit the resulting diff alongside the CERBOS_VERSION bump, so"
          echo "reviewers can see exactly what the planner's wire contract changed."
          exit 1
