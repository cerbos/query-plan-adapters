name: Conformance Corpus

# No branch filter on pull_request: like the adapter workflows, this must also run on PRs
# targeting non-main bases (e.g. stacked PRs).
on:
  pull_request:
    paths:
      - "conformance/**"
      - ".github/workflows/conformance.yaml"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - "conformance/**"
      - ".github/workflows/conformance.yaml"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"

# A newer push to the same pull request makes this run's result moot, so cancel it rather than
# let it finish. Only pull_request runs are ever cancelled; every other trigger runs to the end.
concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corpus:
    name: Corpus validity and golden drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: conformance/scripts/validate-corpus.sh

      # validate-corpus.sh proves every restatement in the repository agrees with
      # conformance/pdp-versions.json; it cannot prove each tag/digest PAIR is right, because that
      # needs a registry. This is the job that owns the pinned-PDP contract, and it already has
      # network and Docker, so the correspondence is asserted here — once, rather than in every
      # adapter workflow, which runs validate-corpus.sh offline.
      - name: Verify the pinned Cerbos digests match their tags
        run: conformance/scripts/verify-cerbos-digest.sh

      # Must match the key warm-caches.yaml writes on main.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conformance/generator/go.mod
          cache-dependency-path: conformance/generator/go.sum

      - name: Vet and format-check the generator
        run: |
          go -C conformance/generator vet ./...
          unformatted="$(gofmt -l conformance/generator)"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::gofmt would reformat these files:"
            echo "${unformatted}"
            exit 1
          fi

      # Starts both pinned PDPs, replans every case and replays check() for every seed, then fails
      # if the policy, resources.json, any golden or golden/CHANGES.md differs from what is
      # committed. A drift here means a case, the dataset or a pin changed without re-running
      # `go -C conformance/generator run .` and committing the result.
      - name: Check the recorded goldens are up to date
        run: go -C conformance/generator run . -check
