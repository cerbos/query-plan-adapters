name: SQLAlchemy Pull Request

# No branch filter: like the other adapter workflows, tests must also run on PRs
# targeting non-main bases (e.g. stacked PRs).
on:
  pull_request:
    paths:
      - "sqlalchemy/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/sqlalchemy_pr.yaml"
      - ".github/workflows/sqlalchemy_release.yaml"

defaults:
  run:
    working-directory: sqlalchemy

jobs:
  test-sqla:
    name: SQLA ${{ matrix.sqlalchemy.name }} test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `pyproject.toml` declares `sqlalchemy>=1.4`, and the two major lines
        # differ where this adapter reaches — `DeclarativeBase` exists only on
        # 2.0 — so a single-version job leaves half the supported range unproven.
        sqlalchemy:
          - name: "1.4"
            command: "bash scripts/test-sqlalchemy-version.sh 1.4"
          - name: "2.x"
            command: "bash scripts/test-sqlalchemy-version.sh 2.x"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./__pypackages__
          key: ${{ runner.os }}-python-${{ matrix.sqlalchemy.name }}-${{ hashFiles('**/pdm.lock') }}

      - uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        name: Setup PDM
        with:
          python-version: "3.10" # Version range or exact version of a Python version to use, the same as actions/setup-python
          prerelease: true # Allow prerelease versions to be installed
          enable-pep582: true # Enable PEP 582 package loading globally

      # The native profile command owns version selection, the temporary 1.4 lockfile, the
      # installed-version assertion, and the runtime suite. Keeping that seam shared with
      # adapterctl prevents the environment called 1.4 from quietly running the committed 2.x
      # lockfile when it is invoked outside this workflow.
      - name: Install and test SQLAlchemy ${{ matrix.sqlalchemy.name }}
        run: ${{ matrix.sqlalchemy.command }}

      # `get_query`'s overloads are a static contract the runtime suite cannot
      # reach, so pyright checks them separately. 2.x only: 1.4's stubs declare
      # neither `DeclarativeBase` nor `__table__`, so none of the inferences the
      # fixture pins exist there.
      - name: Type-check the public signature
        if: matrix.sqlalchemy.name == '2.x'
        run: npx -y pyright@1.1.411

  # The example application: the published distribution, installed from the wheel `pdm build`
  # produced and used the way a consumer uses it, against the shared demo domain. It covers the
  # two things the suite above structurally cannot — the packaging surface (which modules the
  # distribution carries, and its `Requires-Dist` resolved against a consumer's pinned tree),
  # which every suite bypasses by importing from `../src`, and the usage shapes past a single flat
  # query (pagination, and composing the adapter's `Select` with the application's own predicate).
  # See cerbos/query-plan-adapters#349 and
  # docs/adr/0002-examples-install-the-packed-artifact.md.
  #
  # THIS JOB MUST STAY IN THIS WORKFLOW. `renovate.json` sets `automerge: true` for every
  # non-major bump, and that is the path an ORM regression takes into `main` today. Because the
  # example's lockfile is committed and Renovate manages it, a SQLAlchemy bump arrives as ONE PR
  # touching both sqlalchemy/pyproject.toml and sqlalchemy/example/ — and this job, being a check
  # on that PR, is what blocks the automerge when the new version breaks real usage. Moving it to
  # a nightly run or a workflow of its own silently restores that gap.
  #
  # One Python leg only, and one SQLAlchemy major: the demo domain discriminates the distribution
  # and the ORM's real query methods, not the interpreter — and the 1.4/2.x split is a semantics
  # dimension, already run twice above by the job this one sits beside.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        name: Setup PDM
        with:
          python-version: "3.10"

      # No `pdm install` here: the example builds the adapter and installs its own pinned tree
      # from sqlalchemy/example/pdm.lock, in its own environment. The PDP is a container started
      # by the runner from demo/docker-compose.yml, pinned to conformance/CERBOS_VERSION and
      # conformance/CERBOS_IMAGE_DIGEST — no cerbos-setup-action here, because an example must
      # reach the PDP the way a deployed application does.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh sqlalchemy
