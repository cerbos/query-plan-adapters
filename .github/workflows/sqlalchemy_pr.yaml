name: SQLAlchemy Pull Request

# No branch filter, so stacked PRs are tested too.
on:
  pull_request:
    paths:
      - "sqlalchemy/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/sqlalchemy_pr.yaml"
      - ".github/workflows/sqlalchemy_release.yaml"

permissions: {}

defaults:
  run:
    working-directory: sqlalchemy

jobs:
  test-sqla:
    name: SQLA ${{ matrix.sqlalchemy.name }} test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Both supported majors: they differ where the adapter reaches.
        sqlalchemy:
          - name: "1.4"
            constraint: "sqlalchemy<2"
          - name: "2.x"
            constraint: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./__pypackages__
          key: ${{ runner.os }}-python-${{ matrix.sqlalchemy.name }}-${{ hashFiles('**/pdm.lock') }}

      - uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        name: Setup PDM
        with:
          python-version: "3.10"
          prerelease: true
          enable-pep582: true

      # 2.x uses pdm.lock. 1.4 re-resolves into a throwaway lockfile.
      # -G selects only the named dev groups, so `test` is listed explicitly.
      - if: matrix.sqlalchemy.constraint == ''
        run: pdm install -G testcontainers -G test -G lint

      - if: matrix.sqlalchemy.constraint != ''
        run: |
          echo "${{ matrix.sqlalchemy.constraint }}" > /tmp/sqlalchemy-constraint.txt
          pdm install -G testcontainers -G test \
            --override /tmp/sqlalchemy-constraint.txt \
            --lockfile /tmp/sqlalchemy-${{ matrix.sqlalchemy.name }}.lock

      # Run once. Both rewrite files, and check-repo-status fails on any diff.
      - name: Format
        if: matrix.sqlalchemy.constraint == ''
        run: pdm run format

      - name: Lint
        if: matrix.sqlalchemy.constraint == ''
        run: pdm run lint

      - name: Check repo status
        if: matrix.sqlalchemy.constraint == ''
        uses: cerbos/actions/check-repo-status@c19f023116079958e91290ea4af73e25296d7614 # main

      # Fail if the constraint did not take effect.
      - name: Assert SQLAlchemy version
        run: |
          pdm run python - <<'PY'
          import sqlalchemy
          installed = sqlalchemy.__version__
          expected = "${{ matrix.sqlalchemy.name }}".rstrip("x")
          assert installed.startswith(expected), f"expected {expected}*, got {installed}"
          print(f"SQLAlchemy {installed}")
          PY

      # Checks `get_query`'s overloads. 2.x only: 1.4's stubs lack
      # `DeclarativeBase` and `__table__`.
      - name: Type-check the public signature
        if: matrix.sqlalchemy.constraint == ''
        run: npx -y pyright@1.1.411

      - run: pdm run test
        env:
          ADAPTER_TEST_STRICT_EVALUATION: "false"

      - name: Run strict evaluation conformance
        run: pdm run pytest tests/test_adversarial_conformance.py
        env:
          ADAPTER_TEST_STRICT_EVALUATION: "true"

  # Runs the example against the built wheel, testing packaging and usage shapes.
  # See docs/adr/0002-examples-install-the-packed-artifact.md.
  # Keep this job in this workflow: it is the check that blocks Renovate's automerge
  # of a SQLAlchemy bump that breaks real usage.
  example:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        name: Setup PDM
        with:
          python-version: "3.10"

      # No `pdm install`: the example installs its own pinned tree. The runner starts the PDP
      # from demo/docker-compose.yml, as a deployed app would reach it.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh sqlalchemy
