name: Spring Data Test

on:
  pull_request:
    paths:
      - "spring-data/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/spring-data.yaml"
  push:
    tags:
      - spring-data/v*

# A newer push to the same pull request makes this run's result moot, so cancel it rather than
# let it finish. Only pull_request runs are ever cancelled; every other trigger runs to the end.
concurrency:
  group: spring-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: spring-data

permissions: {}

jobs:
  # All suites run here on H2, including the adversarial suite (CLAUDE.md, "CI").
  test:
    permissions:
      contents: read
    strategy:
      # A failed `next` leg should not cancel the baseline leg.
      fail-fast: false
      matrix:
        java-version: ["17", "21"]
        # ORM version sets declared in build.gradle.kts. `next` is Hibernate 7 / Spring Data JPA 4.
        orm: [baseline, next]
        # The ORM leg only needs the baseline JDK.
        exclude:
          - orm: next
            java-version: "21"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          # Must match the key warm-caches.yaml writes on main.
          cache: gradle
          cache-dependency-path: |
            spring-data/**/*.gradle*
            spring-data/**/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # build.gradle.kts forwards ADAPTER_TEST_ORM to the suites and declares it as an input.
      - name: Build and test (${{ matrix.orm }})
        run: |
          ADAPTER_TEST_STRICT_EVALUATION=false ./gradlew build --no-daemon
          ADAPTER_TEST_STRICT_EVALUATION=true ./gradlew test --tests '*AdversarialConformanceTest' --no-daemon
        env:
          ADAPTER_TEST_ORM: ${{ matrix.orm }}

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "Reports for Java ${{ matrix.java-version }} (${{ matrix.orm }})"
          path: |-
            **/build/reports/
            **/build/test-results/

  # The same suites with AdversarialConformanceTest on a real database, for dialect behaviour H2
  # cannot show, such as MySQL collation (README.md "Database collation requirements"). MySQL runs
  # with client-side and with server-side prepared statements (README.md "MySQL: keeping arithmetic
  # IEEE-faithful").
  test-database:
    permissions:
      contents: read
    strategy:
      # Each store leg is a separate finding.
      fail-fast: false
      matrix:
        include:
          - database: postgres
          - database: mysql
          - database: mysql
            server-prep-stmts: "true"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          # Must match the key warm-caches.yaml writes on main.
          cache: gradle
          cache-dependency-path: |
            spring-data/**/*.gradle*
            spring-data/**/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Only AdversarialConformanceTest reads ADAPTER_TEST_DB; the `test` job runs the other suites.
      - name: Adversarial suite (${{ matrix.database }})
        run: |
          ADAPTER_TEST_STRICT_EVALUATION=false ./gradlew test --tests '*AdversarialConformanceTest' --no-daemon
          ADAPTER_TEST_STRICT_EVALUATION=true ./gradlew test --tests '*AdversarialConformanceTest' --no-daemon
        env:
          ADAPTER_TEST_DB: ${{ matrix.database }}
          ADAPTER_TEST_MYSQL_SERVER_PREP_STMTS: ${{ matrix.server-prep-stmts || '' }}

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "Reports for ${{ matrix.database }}${{ matrix.server-prep-stmts && ' (server prepared statements)' || '' }}"
          path: |-
            **/build/reports/
            **/build/test-results/

  # The example installs the published artifact and exercises pagination and Specification
  # composition, which no suite above does. See docs/adr/0002-examples-install-the-packed-artifact.md.
  # It runs two programs: the demo-domain one and the photo-sharing app with its smoke scripts.
  # Keep this job in this workflow: it is what blocks Renovate's automerge of a breaking bump.
  example:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Check the PDP pins in both compose files before running against them.
      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          # Must match the key warm-caches.yaml writes on main.
          cache: gradle
          cache-dependency-path: |
            spring-data/**/*.gradle*
            spring-data/**/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The example resolves the adapter from mavenLocal.
      - name: Publish the adapter to mavenLocal
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Build example
        run: ./gradlew -p example build --no-daemon

      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh spring-data

      - name: Run smoke test
        run: ./example/scripts/smoke.sh

      # Each scenario pins a fixed adapter bug; see "Edge-case regression scenarios" in
      # example/README.md.
      - name: Run edge-case regression smoke test
        run: ./example/scripts/smoke-edge-cases.sh

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "Reports for the example"
          path: |-
            **/build/reports/
            **/build/test-results/
