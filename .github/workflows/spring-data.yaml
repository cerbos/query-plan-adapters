name: Spring Data Test

on:
  pull_request:
    paths:
      - "spring-data/**"
      - "conformance/**"
      - "demo/**"
      - "policies/**"
      - ".github/workflows/spring-data.yaml"
  push:
    tags:
      - spring-data/v*

defaults:
  run:
    working-directory: spring-data

jobs:
  test:
    strategy:
      matrix:
        java-version: ["17", "21"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Setup JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build and test
        run: gradle build --no-daemon

  # Runs the full suite with AdversarialConformanceTest (the differential check()-oracle)
  # backed by a real database via Testcontainers instead of in-memory H2. Guards against
  # dialect divergences H2 cannot surface — most importantly the collation over-grant
  # documented in spring-data/README.md "Database collation requirements": the MySQL leg
  # creates its schema with utf8mb4_0900_as_cs; the suite's mixed-case seeds fail the
  # oracle comparison on MySQL's default case-insensitive collation.
  #
  # The MySQL leg runs TWICE: once with Connector/J's default client-side prepared
  # statements (pins the adapter's `cast(... as double)` rendering — under the
  # MySQLDialect decimal(53,20) cast, interpolated DECIMAL literals would evaluate the
  # adapter's IEEE double arithmetic exactly and p-double-frac would fail; see the README
  # "MySQL: keeping arithmetic IEEE-faithful" gotcha) and once with
  # useServerPrepStmts=true (typed binds — the mode customers may opt into).
  test-database:
    strategy:
      matrix:
        include:
          - database: postgres
          - database: mysql
          - database: mysql
            server-prep-stmts: "true"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job runs AdversarialConformanceTest against a real database, so it consumes the
      # shared corpus exactly as the `test` job does — a corrupt corpus must fail here as a
      # corpus error, not as an unexplained oracle mismatch on Postgres or MySQL.
      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Setup JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build and test (${{ matrix.database }})
        run: gradle build --no-daemon
        env:
          ADAPTER_TEST_DB: ${{ matrix.database }}
          ADAPTER_TEST_MYSQL_SERVER_PREP_STMTS: ${{ matrix.server-prep-stmts || '' }}

  # The example application. What it covers that nothing above does is exactly two things:
  #
  #   1. The PUBLISHED package surface. Every test in `test` and `test-database` compiles against
  #      the adapter's own source set, so its POM and Gradle module metadata — dependency scopes
  #      included — are executed nowhere. The example resolves `dev.cerbos:cerbos-spring-data`
  #      from mavenLocal as a real Maven coordinate instead (it used to be a Gradle composite
  #      build, which substitutes the source tree and hides that entirely). See
  #      docs/adr/0002-examples-install-the-packed-artifact.md; cerbos-sdk-java declaring
  #      protobuf at runtime-only scope is the shape of bug this exists for.
  #   2. ORM usage shapes past a single flat filtered query — pagination through
  #      `findAll(Specification, Pageable)` and its separate COUNT query, and the adapter's
  #      Specification composed with the application's own.
  #
  # It is NOT the repository's only end-to-end live-PDP row-set verification, which this comment
  # claimed until cerbos/query-plan-adapters#359. All ten conformance harnesses plan against a
  # live PDP over gRPC, translate, execute against a real store, and compare the returned ids
  # against per-row check() — including this adapter's, on H2, PostgreSQL and MySQL.
  #
  # THIS JOB MUST STAY IN THIS WORKFLOW. `renovate.json` sets `automerge: true` for every
  # non-major bump, and that is the path a Spring Boot or Spring Data JPA regression takes into
  # `main` today: the bump arrives as one PR touching this adapter's manifest and the example's,
  # and this job, being a check on that PR, is what blocks the automerge when the new ORM breaks
  # real usage. Moving it to a nightly run or a workflow of its own silently restores that gap.
  #
  # Two example programs share one Gradle build here, and both run below: the demo-domain program
  # against the shared corpus in demo/, and the photo-sharing application that predates it, whose
  # smoke scripts assert row sets and PDP audit records across three resource kinds. The demo
  # domain is a floor, not a ceiling — ADR 0001 — so the second one stays.
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both example programs reach a pinned PDP — the photo-sharing app through this adapter's
      # own example/docker-compose.yml, the demo-domain one through demo/docker-compose.yml — and
      # these two scripts are what assert those pins still equal conformance/CERBOS_VERSION and
      # conformance/CERBOS_IMAGE_DIGEST. Without them the run below would happily execute the
      # whole end-to-end flow against a drifted PDP.
      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - name: Setup JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # The example's Spring Boot 3.5.x Gradle plugin is validated against Gradle 8.x
          # (smoke.sh's documented prerequisite), not the runner's floating preinstall.
          gradle-version: "8.12"

      # The example resolves the adapter as a coordinate, so it has to exist in mavenLocal before
      # anything under example/ compiles. Each of the three scripts below publishes it for itself
      # — they have to, to be one command on a laptop — but `Build example` is a bare `gradle`
      # invocation and this is its half of that prerequisite.
      - name: Publish the adapter to mavenLocal
        run: gradle publishToMavenLocal --no-daemon

      - name: Build example
        run: gradle -p example build --no-daemon

      # The PDP here is a container the runner starts from demo/docker-compose.yml, pinned to
      # conformance/CERBOS_VERSION and conformance/CERBOS_IMAGE_DIGEST — an example must reach
      # the PDP the way a deployed application does.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh spring-data

      - name: Run smoke test
        run: ./example/scripts/smoke.sh

      # Full-stack regression tripwire: every scenario pins a historical adapter bug
      # (PRs #273, #274, #275, #279, #285, #286) that would have returned a different
      # row set — or an HTTP 500 — before its fix. See "Edge-case regression
      # scenarios" in example/README.md.
      - name: Run edge-case regression smoke test
        run: ./example/scripts/smoke-edge-cases.sh
