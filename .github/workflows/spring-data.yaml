name: Spring Data Test

on:
  pull_request:
    paths:
      - "spring-data/**"
      # The build includes ../jpa (ADR 0013), so a change to the core runs these suites too.
      - "jpa/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/spring-data.yaml"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"
  push:
    tags:
      - spring-data/v*

# A newer push to the same pull request makes this run's result moot, so cancel it rather than
# let it finish. Only pull_request runs are ever cancelled; every other trigger runs to the end.
concurrency:
  group: spring-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: spring-data

permissions: {}

jobs:
  # All suites run here on H2, including the conformance suite, which replays the recorded golden
  # plans of both pinned PDPs (conformance/golden/) and needs no PDP (docs/ci.md). The store legs
  # run in jpa.yaml: the SQL is the jpa core's (ADR 0013).
  test:
    permissions:
      contents: read
    strategy:
      # A failed `next` leg should not cancel the baseline leg.
      fail-fast: false
      matrix:
        java-version: ["17", "21"]
        # ORM version sets declared in build.gradle.kts. `next` is Hibernate 7 / Spring Data JPA 4.
        orm: [baseline, next]
        # The ORM leg only needs the baseline JDK.
        exclude:
          - orm: next
            java-version: "21"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          # Must match the key warm-caches.yaml writes on main.
          cache: gradle
          cache-dependency-path: |
            spring-data/**/*.gradle*
            spring-data/**/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # build.gradle.kts forwards ADAPTER_TEST_ORM to the suites and declares it as an input.
      - name: Build and test (${{ matrix.orm }})
        run: ./gradlew build --no-daemon
        env:
          ADAPTER_TEST_ORM: ${{ matrix.orm }}

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "Reports for Java ${{ matrix.java-version }} (${{ matrix.orm }})"
          path: |-
            **/build/reports/
            **/build/test-results/

  # The example installs the published artifact and exercises pagination and Specification
  # composition, which no suite above does. See docs/adr/0002-examples-install-the-packed-artifact.md.
  # It runs two programs: the demo-domain one and the photo-sharing app with its smoke scripts.
  # Keep this job in this workflow: it is what blocks Renovate's automerge of a breaking bump.
  example:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Check the PDP pins in both compose files before running against them.
      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          # Must match the key warm-caches.yaml writes on main.
          cache: gradle
          cache-dependency-path: |
            spring-data/**/*.gradle*
            spring-data/**/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The example resolves the adapter, and the jpa core its POM names, from mavenLocal.
      - name: Publish the jpa core and the adapter to mavenLocal
        run: |
          ../jpa/gradlew -p ../jpa publishToMavenLocal --no-daemon
          ./gradlew publishToMavenLocal --no-daemon

      - name: Build example
        run: ./gradlew -p example build --no-daemon

      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh spring-data

      - name: Run smoke test
        run: ./example/scripts/smoke.sh

      # Each scenario pins a fixed adapter bug; see "Edge-case regression scenarios" in
      # example/README.md.
      - name: Run edge-case regression smoke test
        run: ./example/scripts/smoke-edge-cases.sh

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "Reports for the example"
          path: |-
            **/build/reports/
            **/build/test-results/
