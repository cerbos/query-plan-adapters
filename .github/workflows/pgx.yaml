name: pgx Test

on:
  pull_request:
    paths:
      - "pgx/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/pgx.yaml"
  push:
    tags:
      - pgx/v*

defaults:
  run:
    working-directory: pgx

jobs:
  # Lint and the adversarial suite share one job: they need the identical checkout and Go
  # toolchain, and the lint steps run first so a formatting break still fails in about a minute
  # rather than after the container-backed suite.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      # cache-dependency-path is not optional here: every Go module in this repository lives in a
      # subdirectory, and setup-go resolves the default dependency file against the repository root
      # rather than `defaults.run.working-directory`, which applies to `run` steps alone. Left off,
      # it finds no go.sum, warns, and silently disables the module cache for the whole job.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pgx/go.mod
          cache-dependency-path: pgx/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          working-directory: pgx
          args: --config=.golangci.yaml

      - name: Check formatting
        run: |
          golangci-lint fmt ./...
          git diff --exit-code

      # The unit suite covers the translator and the renderer over hand-built plans — the malformed
      # and hostile shapes no planner emits. It is run on its own first for two reasons: it fails in
      # seconds where the container-backed suite takes minutes, and running it with the adversarial
      # test skipped is what keeps "these tests need no Docker" a checked claim. Under `./...` a unit
      # test that grew a container dependency would be invisible, because the suite that follows
      # starts Docker anyway.
      - name: Unit suite (no Docker)
        run: go test -race -skip TestAdversarialConformance ./...

      # The harness starts its own Cerbos PDP with testcontainers, reading the pinned version from
      # conformance/CERBOS_VERSION — there is no separate sidecar to set up, and the version is
      # never hardcoded here. It also seeds a PostgreSQL testcontainer, from pgx/POSTGRES_IMAGE.
      - name: Adversarial conformance suite
        run: go test -race -timeout 20m ./...

  # The example application, against the shared demo domain in demo/. It proves what the job above
  # structurally cannot: the usage shapes — this adapter returns SQL text, so the load-bearing one is
  # composing that fragment into a statement the application owns without breaking PostgreSQL's
  # ordinal parameter numbering. See pgx/example/README.md.
  #
  # THIS JOB MUST STAY IN THIS WORKFLOW. renovate.json automerges every non-major bump, so a pgx bump
  # arrives as one PR touching both pgx/go.mod and pgx/example/go.mod — the example's committed
  # lockfile — and this job, being a check on that PR, is what blocks the automerge when the new
  # version breaks real usage. Moved to a nightly run or a workflow of its own it would still pass or
  # fail eventually, but not before the merge, which silently restores the gap it exists to close.
  #
  # One language-version leg on purpose: the demo domain discriminates the adapter's usage shapes, not
  # the Go toolchain, so a second leg would re-run identical work.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      # The example is its own module, so it caches against its own go.sum — see the note on the
      # test job's Setup Go for why the path has to be spelled out at all.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pgx/example/go.mod
          cache-dependency-path: pgx/example/go.sum

      # The example is a nested module, so `./...` in the job above stops at its directory and
      # nothing there is linted by it. Held to the adapter's own configuration rather than a
      # weaker one of its own: an example a consumer reads is the code most likely to be copied.
      - name: Lint the example
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          working-directory: pgx/example
          args: --config=../.golangci.yaml

      - name: Check the example's formatting
        working-directory: pgx/example
        run: |
          golangci-lint fmt --config=../.golangci.yaml ./...
          git diff --exit-code

      # The PDP is a container the runner starts from demo/docker-compose.yml, pinned to
      # conformance/CERBOS_VERSION and conformance/CERBOS_IMAGE_DIGEST — no cerbos-setup-action
      # here, because an example must reach the PDP the way a deployed application does. The
      # PostgreSQL server is pgx/example/run.sh's own, from pgx/POSTGRES_IMAGE.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh pgx
