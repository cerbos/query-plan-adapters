name: Drizzle Test

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "conformance/**"
      - "policies/**"
      - ".github/workflows/drizzle.yaml"
      - ".github/workflows/drizzle-publish.yaml"
  push:
    tags:
      - drizzle/v*

defaults:
  run:
    working-directory: drizzle

jobs:
  test:
    strategy:
      matrix:
        node-version: ["22", "24", "25"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Cerbos version
        id: cerbos
        run: echo "version=$(tr -d '[:space:]' < ../conformance/CERBOS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Cerbos
        uses: cerbos/cerbos-setup-action@f772482c8504a05c49018a0bf2d84012a607733c # v1
        with:
          version: v${{ steps.cerbos.outputs.version }}

      - name: Test using Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm run typecheck
      - run: npm run test

  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Read pinned Cerbos version
        id: cerbos
        run: echo "version=$(tr -d '[:space:]' < ../conformance/CERBOS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Cerbos
        uses: cerbos/cerbos-setup-action@f772482c8504a05c49018a0bf2d84012a607733c # v1
        with:
          version: v${{ steps.cerbos.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm install
      - run: npm run test:adversarial
