name: Drizzle Test

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/drizzle.yaml"
      - ".github/workflows/drizzle-publish.yaml"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"
  # Release tags invoke these same checks through the publish workflow.
  workflow_call:

# A newer push to the same pull request makes this run's result moot, so cancel it rather than
# let it finish. Only pull_request runs are ever cancelled; every other trigger runs to the end.
concurrency:
  group: drizzle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: drizzle

jobs:
  test:
    strategy:
      # The conformance harness shares this matrix, so the default fail-fast would let an
      # unrelated Node leg cancel the baseline leg mid-corpus and report it as "cancelled" —
      # neither a pass nor a failure for the repo's load-bearing signal.
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Test using Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          # Keyed on both lockfiles so every job in this workflow shares one entry, which the
          # `Warm Caches` workflow writes on main — the only scope every pull request can read.
          cache: npm
          cache-dependency-path: |
            drizzle/package-lock.json
            drizzle/example/package-lock.json

      - run: npm install
      - run: npm run typecheck
      - run: npm run test

      # The conformance harness replays the recorded goldens (no PDP) against a real store. The
      # corpus discriminates the translator and the store, not the Node runtime, so it runs on the
      # baseline leg only.
      - name: Run conformance harness (SQLite)
        if: matrix.node-version == '22'
        run: npm run test:adversarial

      # The store IS a translator property, unlike the Node runtime: `float(53)` casts, boolean
      # CASE arms, timestamp binding and division by zero all evaluate differently on PostgreSQL
      # (cerbos/query-plan-adapters#320). The container comes from testcontainers, which needs no
      # service block on ubuntu-latest.
      - name: Run conformance harness (PostgreSQL)
        if: matrix.node-version == '22'
        run: npm run test:adversarial:postgres

      # The third store, and the one that disagrees with the other two on the most
      # (cerbos/query-plan-adapters#340): its default collation makes `=` case- AND
      # accent-insensitive, `CAST(... AS TEXT)` is a syntax error rather than a portable cast,
      # `x / 0` is NULL where PostgreSQL raises, and `CAST(... AS FLOAT(53))` exists only from
      # MySQL 8.0.17.
      - name: Run conformance harness (MySQL)
        if: matrix.node-version == '22'
        run: npm run test:adversarial:mysql

  # The example application: the published package, installed from `npm pack`'s tarball and used
  # the way a consumer uses it, against the shared demo domain. It covers the two things the
  # suites above structurally cannot — the packaging surface (`exports`, `types`, the `files`
  # allowlist, the peer range), which every harness bypasses by importing from `"."`, and the
  # usage shapes past a single flat query (pagination, and composing the adapter's filter with
  # the application's own). See cerbos/query-plan-adapters#349 and
  # docs/adr/0002-examples-install-the-packed-artifact.md.
  #
  # THIS JOB MUST STAY IN THIS WORKFLOW. `renovate.json` sets `automerge: true` for every
  # non-major bump, and that is the path an ORM regression takes into `main` today. Because the
  # example's lockfile is committed and Renovate manages it, a Drizzle bump arrives as ONE PR
  # touching both drizzle/package.json and drizzle/example/package.json — and this job, being a
  # check on that PR, is what blocks the automerge when the new ORM breaks real usage. Moving it
  # to a nightly run or a workflow of its own silently restores that gap.
  #
  # One Node leg only: the demo domain discriminates the package and the ORM, not the runtime —
  # the same reasoning that gates the adversarial steps above to Node 22. SQLite only, for the
  # matching reason: the PostgreSQL leg exists to discriminate collation, LIKE escaping and
  # parameter typing, which are semantics the corpus already covers, and this proves plumbing.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # Keyed on both lockfiles so every job in this workflow shares one entry, which the
          # `Warm Caches` workflow writes on main — the only scope every pull request can read.
          cache: npm
          cache-dependency-path: |
            drizzle/package-lock.json
            drizzle/example/package-lock.json

      - run: npm install

      # The PDP is a container started by the runner from demo/docker-compose.yml, pinned to
      # `current` in conformance/pdp-versions.json (tag and digest) — no cerbos-setup-action
      # here, because an example must reach the PDP the way a deployed application does.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh drizzle
