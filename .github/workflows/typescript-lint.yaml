name: TypeScript Lint

on:
  pull_request:
    paths:
      - "convex/**"
      - "drizzle/**"
      - "langchain-chromadb/**"
      - "mongoose/**"
      - "prisma/**"
      - "tools/oxlint/**"
      - ".github/workflows/typescript-lint.yaml"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"

concurrency:
  group: typescript-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: tools/oxlint

jobs:
  anti-slop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm ci
      - run: npm run lint
