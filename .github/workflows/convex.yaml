name: Convex Test

on:
  pull_request:
    paths:
      - "convex/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/convex.yaml"
      - ".github/workflows/convex-publish.yaml"
  push:
    tags:
      - convex/v*

defaults:
  run:
    working-directory: convex

jobs:
  certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/validate-adapterctl
        with:
          adapter: convex

  unit-test:
    strategy:
      matrix:
        node-version: ["22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Cerbos sidecar: `npm test` is the translator unit test, which reads its plans from
      # conformance/wire-fixtures/ — replanned against the pinned PDP and diffed by the
      # `Conformance Corpus` workflow — and its expected filters from golden/expectations.json.
      # No PDP, no Convex backend, no Docker.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      # `npm run typecheck` is NOT run here: src/adversarial.test.ts imports
      # convex/_generated/api.js, which is produced by `npx convex codegen` against a live
      # backend and is gitignored. It runs in the integration-test job instead, right after
      # codegen.
      - run: npm install
      - run: npm run test

  # The backend-dependent leg: corpus validation, Convex codegen, the type-check that needs the
  # generated API, and the adversarial suite. Convex is the one adapter where that cannot share a
  # job with `npm test` — the harness imports `convex/_generated`, which only exists after a live
  # backend has been deployed to, so folding it into `unit-test` would put Docker and a Convex
  # deploy on every Node leg. The job id is left as `integration-test` deliberately: the suite it
  # was named for is gone (cerbos/query-plan-adapters#385), and renaming the job would rename the
  # required check.
  integration-test:
    strategy:
      matrix:
        node-version: ["22"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Read pinned Cerbos version
        id: cerbos
        run: echo "version=$(tr -d '[:space:]' < ../conformance/CERBOS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Cerbos
        uses: cerbos/cerbos-setup-action@30ad92b0242d792bd156985682426577fcfcc589 # v1
        with:
          version: v${{ steps.cerbos.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install

      # One native lifecycle shared with adapterctl: start the pinned backend, wait, generate an
      # admin key, deploy, codegen, then run both consumers of the generated API before cleanup.
      # Keeping typecheck inside test:integration preserves the workflow's previous coverage
      # without paying for a second backend deployment.
      - name: Type-check and run adversarial conformance tests
        run: bash scripts/with-self-hosted-backend.sh npm run test:integration

  # The example application: the published package, installed from `npm pack`'s tarball and used
  # the way a consumer uses it, against the shared demo domain. It covers the two things the jobs
  # above structurally cannot — the packaging surface (`exports`, `types`, the `files` allowlist,
  # the `@cerbos/core` peer range), which every harness bypasses by importing from `"."`, and the
  # usage shapes past a single flat query (pagination, and composing the adapter's filter with the
  # application's own). See cerbos/query-plan-adapters#349 and
  # docs/adr/0002-examples-install-the-packed-artifact.md.
  #
  # THIS JOB MUST STAY IN THIS WORKFLOW. `renovate.json` sets `automerge: true` for every
  # non-major bump, and that is the path a Convex regression takes into `main` today. Because the
  # example's lockfile is committed and Renovate manages it, a Convex bump arrives as ONE PR
  # touching both convex/package.json and convex/example/package.json — and this job, being a
  # check on that PR, is what blocks the automerge when the new Convex breaks real usage. Moving it
  # to a nightly run or a workflow of its own silently restores that gap.
  #
  # One Node leg only: the demo domain discriminates the package and the ORM, not the runtime —
  # the same reasoning that keeps the adversarial corpus on a single leg above.
  #
  # No Convex backend is started here, unlike `integration-test`: the example's own run.sh starts
  # one, on 13210 rather than 3210, because a consumer's deployment is part of what it proves.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - run: npm install

      # The PDP is a container started by the runner from demo/docker-compose.yml, pinned to
      # conformance/CERBOS_VERSION and conformance/CERBOS_IMAGE_DIGEST — no cerbos-setup-action
      # here, because an example must reach the PDP the way a deployed application does.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh convex
