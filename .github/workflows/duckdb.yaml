name: DuckDB

# No branch filter, so stacked PRs are tested too.
on:
  pull_request:
    paths:
      - "duckdb/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/duckdb.yaml"
      - ".github/workflows/duckdb-publish.yaml"
      # The domain stress kit is run by hand and never gates CI (conformance/domains/README.md).
      - "!conformance/domains/**"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"
  # Release tags invoke these same checks through the publish workflow.
  workflow_call:

permissions: {}

# Cancel a pull request's superseded runs; other triggers always finish.
concurrency:
  group: duckdb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: duckdb

jobs:
  test:
    name: DuckDB ${{ matrix.duckdb.name }} test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The locked 2.x, the 1.5 line and the 1.4 LTS floor. They differ in what the regex
        # lowering and LIST/ARRAY handling meet, so each runs the whole harness.
        duckdb:
          - name: "2.x"
            constraint: ""
          - name: "1.5"
            constraint: "duckdb<2"
          - name: "1.4"
            constraint: "duckdb<1.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        name: Setup PDM
        with:
          python-version: "3.11"

      # 2.x uses pdm.lock. The others re-resolve into a throwaway lockfile.
      # -G selects only the named dev groups, so `test` is listed explicitly.
      - if: matrix.duckdb.constraint == ''
        run: pdm install -G test -G lint

      - if: matrix.duckdb.constraint != ''
        env:
          CONSTRAINT: ${{ matrix.duckdb.constraint }}
          NAME: ${{ matrix.duckdb.name }}
        run: |
          echo "${CONSTRAINT}" > "${RUNNER_TEMP}/duckdb-constraint.txt"
          pdm install -G test \
            --override "${RUNNER_TEMP}/duckdb-constraint.txt" \
            --lockfile "${RUNNER_TEMP}/duckdb-${NAME}.lock"

      # Run once. Both rewrite files, and check-repo-status fails on any diff.
      - name: Format
        if: matrix.duckdb.constraint == ''
        run: pdm run format

      - name: Lint
        if: matrix.duckdb.constraint == ''
        run: pdm run lint

      - name: Check repo status
        if: matrix.duckdb.constraint == ''
        uses: cerbos/actions/check-repo-status@19e204e7bafa58a693eff12f5e95a09763723be5 # main

      # Fail if the constraint did not take effect.
      - name: Assert DuckDB version
        env:
          NAME: ${{ matrix.duckdb.name }}
        run: |
          pdm run python - <<'PY'
          import os
          import duckdb
          installed = duckdb.__version__
          expected = os.environ["NAME"].rstrip("x")
          assert installed.startswith(expected), f"expected {expected}*, got {installed}"
          print(f"DuckDB {installed}")
          PY

      # The conformance harness replays every case in conformance/golden/ against an in-process
      # DuckDB. No PDP runs here: the plans and the decisions are recorded.
      - run: pdm run test

  # Runs the example against the built wheel, testing packaging and usage shapes.
  # See docs/adr/0002-examples-install-the-packed-artifact.md.
  # Keep this job in this workflow: it is the check that blocks Renovate's automerge
  # of a DuckDB bump that breaks real usage.
  example:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        name: Setup PDM
        with:
          python-version: "3.12"

      # No `pdm install`: the example builds the adapter and installs its own pinned tree.
      # The runner starts the PDP from demo/docker-compose.yml (pinned in
      # conformance/pdp-versions.json), as a deployed app would reach it.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh duckdb
