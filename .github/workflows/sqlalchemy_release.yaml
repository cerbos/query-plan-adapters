name: SQLAlchemy Publish

on:
  push:
    tags:
      - sqla/v*

permissions: {}

defaults:
  run:
    working-directory: sqlalchemy

jobs:
  # A local call runs the full adapter matrix and example at this release's commit.
  test:
    uses: ./.github/workflows/sqlalchemy_pr.yaml
    permissions:
      contents: read

  release-sqla:
    needs: test
    name: SQLA publish
    runs-on: ubuntu-latest
    # PyPI trusted publishing names this workflow and the `pypi` environment.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        name: Setup PDM
        with:
          python-version: "3.10"

      - name: Set PDM version env
        run: echo "PDM_BUILD_SCM_VERSION=${GITHUB_REF_NAME#*\/}" >> $GITHUB_ENV

      - run: pdm build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sqlalchemy/dist/
