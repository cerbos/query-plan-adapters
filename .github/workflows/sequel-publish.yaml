name: Sequel Publish

on:
  push:
    tags:
      - sequel/v*

defaults:
  run:
    working-directory: sequel

permissions: {}

jobs:
  # A local call runs the full adapter matrix and example at this release's commit.
  test:
    uses: ./.github/workflows/sequel.yaml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      # Trusted publishing to RubyGems, so no API key is stored in secrets.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `defaults.run.working-directory` only affects `run` steps, so these actions need
      # their own `working-directory` to find the Gemfile.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: sequel

      # The tag names the version; the gem must agree, or the gem pushed is not the one tagged.
      - name: Check the tag against the gem version
        run: |
          version="$(ruby -e 'print Gem::Specification.load(ARGV[0]).version' cerbos-sequel.gemspec)"
          [[ "sequel/v${version}" == "${GITHUB_REF_NAME}" ]] \
            || { echo "tag ${GITHUB_REF_NAME} does not match gem version ${version}" >&2; exit 1; }

      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          await-release: false
          working-directory: sequel

  github-release:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yaml
    with:
      path: sequel
