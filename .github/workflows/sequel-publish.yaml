name: Sequel Publish

on:
  push:
    tags:
      - sequel/v*

defaults:
  run:
    working-directory: sequel

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      # Trusted publishing to RubyGems, so no API key is stored in secrets.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `defaults.run.working-directory` only affects `run` steps, so these actions need
      # their own `working-directory` to find the Gemfile.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: sequel

      - uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1.4.0
        with:
          await-release: false
          working-directory: sequel
