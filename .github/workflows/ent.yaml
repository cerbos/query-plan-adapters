name: Ent Test

on:
  pull_request:
    paths:
      - "ent/**"
      - "conformance/**"
      - "policies/**"
      - ".github/workflows/ent.yaml"
  push:
    tags:
      - ent/v*

defaults:
  run:
    working-directory: ent

jobs:
  # Lint and the adversarial suite share one job: they need the identical checkout and Go
  # toolchain, and the lint steps run first so a formatting break still fails in about a minute
  # rather than after the container-backed suite.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ent/go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          working-directory: ent
          args: --config=.golangci.yaml

      - name: Check formatting
        run: |
          golangci-lint fmt ./...
          git diff --exit-code

      # The unit suite covers the translator and the renderer over hand-built plans — the malformed
      # and hostile shapes no planner emits, and the per-dialect spellings. It is run on its own
      # first for two reasons: it fails in seconds where the container-backed suite takes minutes,
      # and running it with the adversarial test skipped is what keeps "these tests need no Docker"
      # a checked claim. Under `./...` a unit test that grew a container dependency would be
      # invisible, because the suite that follows starts Docker anyway.
      - name: Unit suite (no Docker)
        run: go test -race -skip TestAdversarialConformance ./...

      # The harness starts its own Cerbos PDP with testcontainers, reading the pinned version from
      # conformance/CERBOS_VERSION — there is no separate sidecar to set up, and the version is
      # never hardcoded here. The corpus is replayed against an in-memory SQLite database and
      # PostgreSQL and MySQL testcontainers, so every dialect this adapter claims through
      # WithDialect is actually exercised. Three dialect legs share one PDP and one plan pass;
      # the timeout allows for the extra container start.
      - name: Adversarial conformance suite
        run: go test -race -timeout 30m ./...
