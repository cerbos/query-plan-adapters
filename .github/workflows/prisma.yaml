name: Prisma Test

on:
  pull_request:
    paths:
      - "prisma/**"
      - "conformance/**"
      - "demo/**"
      - ".github/workflows/prisma.yaml"
      - ".github/workflows/prisma-publish.yaml"
      # No script, harness or build reads Markdown, so a prose-only change cannot alter this
      # result. A negation must come after every pattern it narrows.
      - "!**/*.md"
  # Release tags invoke these same checks through the publish workflow.
  workflow_call:

# A newer push to the same pull request makes this run's result moot, so cancel it rather than
# let it finish. Only pull_request runs are ever cancelled; every other trigger runs to the end.
concurrency:
  group: prisma-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: prisma

jobs:
  test:
    strategy:
      # The conformance harness shares this matrix, so the default fail-fast would let an
      # unrelated Node leg cancel the baseline leg mid-corpus and report it as "cancelled" —
      # neither a pass nor a failure for the repo's load-bearing signal. It also costs a whole
      # extra CI cycle whenever a genuinely broken change would have failed both.
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
        prisma-version: ["6", "7"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Test using Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          # Keyed on both lockfiles so every job in this workflow shares one entry, which the
          # `Warm Caches` workflow writes on main — the only scope every pull request can read.
          cache: npm
          cache-dependency-path: |
            prisma/package-lock.json
            prisma/example/package-lock.json

      - run: npm install

      - name: Generate Prisma clients
        run: npm run prisma:generate

      - name: Type-check sources and test suites
        run: npm run typecheck

      # The translator unit test: offline, and engine-agnostic because it never hands a filter to
      # a Prisma client. The prisma-version dimension therefore no longer discriminates it — it
      # is still the dimension the conformance legs below and `npm run typecheck` above are
      # matrixed on, which is why it stays.
      - name: Run tests
        run: npm test

      # The conformance harness replays the recorded goldens (no PDP) against a real store. The
      # corpus discriminates the translator and the store, not the Node runtime, so it runs per
      # Prisma major on the baseline Node leg only.
      - name: Run conformance harness (SQLite)
        if: matrix.node-version == '22'
        run: npm run test:adversarial:v${{ matrix.prisma-version }}

      # The provider IS a translator property, unlike the Node runtime — and unlike the Prisma
      # major above it, which is an ENGINE matrix. A fractional threshold against an `Int` column,
      # a LIKE metacharacter, a real `timestamp` rather than milliseconds since the epoch: all of
      # them evaluate differently here and were unproven while the corpus ran on SQLite alone
      # (cerbos/query-plan-adapters#320). The container comes from testcontainers, started by the
      # suite's own jest globalSetup, so it needs no service block on ubuntu-latest.
      - name: Run conformance harness (PostgreSQL)
        if: matrix.node-version == '22'
        run: npm run test:adversarial:postgres:v${{ matrix.prisma-version }}

      # The third provider (cerbos/query-plan-adapters#340), and the one whose STORE CONFIGURATION
      # is part of the contract: Prisma's MySQL migration engine writes
      # `COLLATE utf8mb4_unicode_ci` into every CREATE TABLE, which is case- and
      # accent-insensitive, so a Prisma-managed MySQL database over-grants `string/equals/case-sensitive`, `string/equals/non-ascii-literal`
      # and every `hierarchy/*` prefix case until someone converts the tables. This leg proves the
      # corpus against the collation README.md tells consumers to use. Gated to the baseline Node
      # leg like the other two, giving 2 majors x 3 stores = 6 runs, all on Node 22.
      - name: Run conformance harness (MySQL)
        if: matrix.node-version == '22'
        run: npm run test:adversarial:mysql:v${{ matrix.prisma-version }}

  # The example application: the published package, installed from `npm pack`'s tarball and used
  # the way a consumer uses it, against the shared demo domain. It covers the two things the
  # suites above structurally cannot — the packaging surface (`exports`, `types`, the `files`
  # allowlist, the peer range), which every harness bypasses by importing from `"."`, and the
  # usage shapes past a single flat query (pagination, and composing the adapter's filter with
  # the application's own). See cerbos/query-plan-adapters#349 and
  # docs/adr/0002-examples-install-the-packed-artifact.md.
  #
  # THIS JOB MUST STAY IN THIS WORKFLOW. `renovate.json` sets `automerge: true` for every
  # non-major bump, and that is the path an ORM regression takes into `main` today. Because the
  # example's lockfile is committed and Renovate manages it, a Prisma bump arrives as ONE PR
  # touching both prisma/package.json and prisma/example/package.json — and this job, being a
  # check on that PR, is what blocks the automerge when the new ORM breaks real usage. Moving it
  # to a nightly run or a workflow of its own silently restores that gap.
  #
  # One Node leg only: the demo domain discriminates the package and the ORM, not the runtime —
  # the same reasoning that gates the conformance steps above to Node 22.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate conformance corpus
        run: ../conformance/scripts/validate-corpus.sh

      - name: Validate demo domain
        run: ../demo/scripts/validate-demo.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # Keyed on both lockfiles so every job in this workflow shares one entry, which the
          # `Warm Caches` workflow writes on main — the only scope every pull request can read.
          cache: npm
          cache-dependency-path: |
            prisma/package-lock.json
            prisma/example/package-lock.json

      - run: npm install

      # The PDP is a container started by the runner from demo/docker-compose.yml, pinned to
      # `current` in conformance/pdp-versions.json (tag and digest) — no cerbos-setup-action
      # here, because an example must reach the PDP the way a deployed application does.
      - name: Run the example against the demo domain
        run: ../demo/scripts/run-example.sh prisma
