name: Publish Prisma Package

on:
  push:
    tags:
      - "@cerbos/orm-prisma@v*"

defaults:
  run:
    working-directory: prisma

permissions:
  contents: read

jobs:
  # A local call runs the full adapter matrix and example at this release's commit.
  test:
    uses: ./.github/workflows/prisma.yaml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for npm trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Without an explicit version this installs whatever `latest` resolves to on the day the
      # tag was pushed. Nothing in this job reads the PDP — it only builds and publishes — but
      # an unpinned Cerbos install is still an unpinned dependency of a release artifact, and the
      # version the corpus pins is the one the package was proved against.
      - name: Read pinned Cerbos version
        id: cerbos
        run: echo "version=$(tr -d '[:space:]' < ../conformance/CERBOS_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Cerbos
        uses: cerbos/cerbos-setup-action@30ad92b0242d792bd156985682426577fcfcc589 # v1
        with:
          version: v${{ steps.cerbos.outputs.version }}

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build --if-present
      - run: npm publish
