# Everything the ActiveRecord adapter needs to run its suites, with no host toolchain
# beyond Docker.
#
#   ./scripts/test.sh                 # unit suite + adversarial suite
#   ./scripts/test.sh spec/adversarial_conformance_spec.rb
#
# The `tests` service mounts the REPOSITORY ROOT because the adversarial harness reads the
# shared corpus at ../conformance/ (seeds.json, actions.json, CERBOS_VERSION).
#
# The PDP is pinned to conformance/CERBOS_VERSION — scripts/test.sh exports it. Never
# hardcode the version here.

services:
  cerbos:
    image: ghcr.io/cerbos/cerbos:${CERBOS_VERSION:?set CERBOS_VERSION - run via scripts/test.sh}
    command: ["server", "--set=storage.disk.directory=/policies", "--set=storage.driver=disk", "--set=telemetry.disabled=true", "--log-level=error"]
    environment:
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      # Both policy sets live under one disk store: the shared suite drives resource kind
      # `resource`, the adversarial corpus drives kind `adversarial`, so they never collide.
      - ../policies:/policies/shared:ro
      - ../conformance/policies:/policies/conformance:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--insecure"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  tests:
    build:
      context: .
      args:
        RUBY_VERSION: ${RUBY_VERSION:-3.4}
        ACTIVERECORD_VERSION: ${ACTIVERECORD_VERSION:-8.0}
    depends_on:
      cerbos:
        condition: service_healthy
    environment:
      CERBOS_HOST: cerbos:3593
    volumes:
      # Only the repo is mounted: the bundle lives at /bundle inside the image, so a volume
      # here would mask it and leave `bundle exec` without its gems.
      - ..:/repo
    working_dir: /repo/activerecord
    command: ["bundle", "exec", "rspec"]
