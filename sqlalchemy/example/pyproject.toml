[project]
name = "cerbos-sqlalchemy-example"
version = "0.0.0"
description = "Example application for cerbos-sqlalchemy, run against the shared demo domain"
license = {text = "Apache-2.0"}
# Matches the Python the `example` job installs.
requires-python = ">=3.10"

# cerbos-sqlalchemy is absent: run.sh installs the freshly built wheel.
# Exact pins so every Renovate bump opens a PR that the `example` job gates.
dependencies = [
    "cerbos==0.16.0",
    "sqlalchemy==2.0.52",
]

[tool.pdm]
# A program, not a package: PDM installs dependencies only.
distribution = false
