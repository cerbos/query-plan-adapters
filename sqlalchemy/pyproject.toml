[project]
name = "cerbos-sqlalchemy"
description = "SQLAlchemy adapter for generating queries with Cerbos: an open core, language-agnostic, scalable authorization solution"
authors = [
    {name = "Cerbos Developers", email = "sdk+sqlalchemy@cerbos.dev"},
]
dependencies = [
    "sqlalchemy>=1.4",
    "cerbos>=0.10.4",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
readme = "README.md"
license = {text = "Apache-2.0"}
dynamic = ["version"]

[project.urls]
Homepage = "https://cerbos.dev"
Repository = "https://github.com/cerbos/query-plan-adapters/tree/main/sqlalchemy"

[project.optional-dependencies]
testcontainers = [
    "testcontainers>=3.5.3",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "scm"

[tool.pdm.dev-dependencies]
test = [
    "pytest>=7.1.2",
    # The PostgreSQL driver for the harness's declared-collection-storage leg. psycopg2 rather
    # than psycopg 3, whose dialect SQLAlchemy 1.4 does not have.
    "psycopg2-binary>=2.9.10",
    # The async driver for the harness's AsyncSession leg: `get_query` returns a plain
    # `Select`, and that leg executes it through `AsyncSession` rather than asserting it could.
    "aiosqlite>=0.17",
]
lint = [
    "ruff>=0.11.13",
    "isort>=5.10.1",
]
tools = [
    "ptpython>=3.0.25",
]

[tool.pdm.scripts]
test = "pytest"
# Rewrites golden/expectations.json from what the translator emits today, preserving every
# `note`. A deliberate act, exactly like conformance/scripts/regenerate-wire-fixtures.sh: the
# diff is the review. CI never sets GOLDEN_UPDATE, so a translator change that moves the
# emitted SQL fails there whatever anyone ran locally.
"golden:update" = {cmd = "pytest tests/test_translator.py", env = {"GOLDEN_UPDATE" = "1"}}
isort = {cmd = "isort src tests example"}
ruff_format = {cmd = "ruff format src tests example"}
lint = {cmd = "ruff check --fix src tests example"}
format = {composite = ["isort", "ruff_format"]}

[tool.pyprojectx]
pdm = "pdm"
ruff = "ruff"
isort = "isort"

[tool.pyprojectx.aliases]
install = "pdm install -G :all"
run = "pdm run"
test = "pdm run test"
lint = "pdm lint"
format = "pdm format"
outdated = "pdm update --outdated"

[tool.isort]
profile = 'black'
