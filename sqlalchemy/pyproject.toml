[project]
name = "cerbos-sqlalchemy"
description = "SQLAlchemy adapter for generating queries with Cerbos: an open core, language-agnostic, scalable authorization solution"
authors = [
    {name = "Cerbos Developers", email = "sdk+sqlalchemy@cerbos.dev"},
]
dependencies = [
    "sqlalchemy>=1.4",
    "cerbos>=0.10.4",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
readme = "README.md"
license = {text = "Apache-2.0"}
dynamic = ["version"]

[project.urls]
Homepage = "https://cerbos.dev"
Repository = "https://github.com/cerbos/query-plan-adapters/tree/main/sqlalchemy"

[project.optional-dependencies]
testcontainers = [
    "testcontainers>=3.5.3",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "scm"

[tool.pdm.dev-dependencies]
test = [
    "pytest>=7.1.2",
    # PostgreSQL driver for the harness. psycopg2, since SQLAlchemy 1.4 lacks psycopg 3.
    "psycopg2-binary>=2.9.10",
    # Async driver for the harness's AsyncSession leg.
    "aiosqlite>=0.17",
    # MySQL driver for the harness. Pure Python, and the driver testcontainers' MySqlContainer
    # names in its connection URL.
    "pymysql>=1.1",
]
lint = [
    "ruff>=0.11.13",
    "isort>=5.10.1",
]
tools = [
    "ptpython>=3.0.25",
]

[tool.pdm.scripts]
test = "pytest"
isort = {cmd = "isort src tests example"}
ruff_format = {cmd = "ruff format src tests example"}
lint = {cmd = "ruff check --fix src tests example"}
format = {composite = ["isort", "ruff_format"]}

[tool.pyprojectx]
pdm = "pdm"
ruff = "ruff"
isort = "isort"

[tool.pyprojectx.aliases]
install = "pdm install -G :all"
run = "pdm run"
test = "pdm run test"
lint = "pdm lint"
format = "pdm format"
outdated = "pdm update --outdated"

[tool.isort]
profile = 'black'
# This directory is named `sqlalchemy`, so isort would treat it as first-party.
known_third_party = ["sqlalchemy"]

[tool.ruff.lint]
ignore = [
    # Refusals raise ValueError by contract; TypeError would change what callers catch.
    "TRY004",
]
