[project]
name = "cerbos-duckdb-example"
version = "0.0.0"
description = "Example application for cerbos-duckdb, run against the shared demo domain"
license = {text = "Apache-2.0"}
# Matches the Python the `example` job installs.
requires-python = ">=3.11"

# cerbos-duckdb is absent: run.sh installs the freshly built wheel.
# Exact pins so every Renovate bump opens a PR that the `example` job gates.
dependencies = [
    "cerbos==0.16.1",
    "duckdb==2.0.1",
]

[tool.pdm]
# A program, not a package: PDM installs dependencies only.
distribution = false
