kind: order
note: >
  E-commerce orders. The root table is literally named `order`, a reserved word everywhere.
  Online orders have no store. Money is BIGINT cents. Line items are a child table that
  policies quantify over with exists/all, including arithmetic inside the lambda.
tables:
  stores:
    pk: id
    columns:
      id: string
      region: string
      country: string
  customers:
    pk: id
    columns:
      id: string
      email: string
      tier: string
      loyalty_points: int
  order:
    pk: id
    columns:
      id: string
      customer_id: string -> customers
      store_id: string? -> stores
      status: string
      channel: string
      total_cents: bigint
      currency: string
      coupon_code: string?
      placed_at: timestamp
      gift: bool
  order_line:
    pk: id
    columns:
      id: string
      order_id: string -> order
      line_no: int
      sku: string
      category: string
      quantity: int
      unit_price_cents: bigint
resource:
  table: order
  attributes:
    status: status
    channel: channel
    totalCents: total_cents
    currency: currency
    couponCode: coupon_code
    placedAt: placed_at
    isGift: gift
    customer:
      one: customer_id
      attributes: {id: id, tier: tier, loyaltyPoints: loyalty_points}
    store:
      one: store_id
      attributes: {region: region, country: country}
    lines:
      many: order_line
      fk: order_id
      orderBy: line_no
      attributes: {sku: sku, category: category, quantity: quantity, unitPriceCents: unit_price_cents}
