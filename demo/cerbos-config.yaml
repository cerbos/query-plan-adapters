---
# PDP configuration for the demo domain. One PDP serves every example application, so an example
# never carries policy or PDP configuration of its own — see demo/README.md.
server:
  httpListenAddr: ":3592"
  grpcListenAddr: ":3593"

storage:
  driver: "disk"
  disk:
    directory: /policies
    watchForChanges: false

telemetry:
  disabled: true
