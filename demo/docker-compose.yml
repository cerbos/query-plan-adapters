# The single PDP every example application plans against, started and stopped by
# demo/scripts/run-example.sh.
#
# There is one compose file for every example rather than one per example: the demo domain is
# a single policy suite by construction (ADR 0001), so ten identical compose files would be ten
# copies of the same PDP pin waiting to drift apart.
services:
  cerbos:
    # Pinned to `current` in conformance/pdp-versions.json, tag AND digest. The demo domain gets no
    # pin of its own — one PDP pin in the repository, reused — and both
    # conformance/scripts/validate-corpus.sh and demo/scripts/validate-demo.sh assert that BOTH
    # halves of this reference agree with it. The tag alone would leave the digest free to name
    # some other build entirely.
    image: ghcr.io/cerbos/cerbos:0.55.0@sha256:4b9d3b58c4f11c1b8953bc798d8d086e64f276882253ab169625fddc7f432515
    # No `container_name`: the runner gives each adapter its own compose project, and a fixed
    # container name is global, so a container left behind by one adapter's interrupted run could
    # not be cleaned up by the next adapter's `compose down`.
    command:
      - "server"
      - "--config=/config/cerbos-config.yaml"
    environment:
      CERBOS_NO_TELEMETRY: "1"
    # Deliberately NOT the default 3592/3593 on the host. They are Cerbos's default ports, which
    # any other local PDP may be holding, and a client that assumes the defaults would then talk
    # to THIS PDP — which serves demo policies — or this one's client to that PDP, and fail for a
    # reason nothing in its output names. Different host ports make that collision impossible;
    # the runner passes the address through $CERBOS_HOST, so no example hardcodes either number.
    ports:
      - "13592:3592"
      - "13593:3593"
    volumes:
      - ./cerbos-config.yaml:/config/cerbos-config.yaml:ro
      - ./policies:/policies:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
