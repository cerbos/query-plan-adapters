services:
  backend:
    # Tag AND digest. Convex publishes only commit-SHA tags, so the tag is not more readable than
    # the digest — it is here because it names the upstream commit this backend was built from,
    # which is what a bump has to be diffed against. validate-corpus.sh asserts every service
    # image reference in the repository carries both halves.
    image: ghcr.io/get-convex/convex-backend:82d5e9f2e8298641e45e5227b9967aa4c1d10620@sha256:f0de0647e46c0ac830a6dda036ee78e4956cecc00144d951bf39b14cc570ad4d
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${PORT:-3210}:3210"
      - "${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3210}}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
      - DISABLE_BEACON=true
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

volumes:
  data:
